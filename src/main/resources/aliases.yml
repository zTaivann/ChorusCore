# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   A L I A S E S                                                        │
# │   extra names for every command                                        │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# The real name on the left always works; anything you list is added on top of it.
# An alias another plugin already owns is skipped. Leave a list empty for no extra
# names at all.
#
# A name the server itself answers to is taken over: /clear reaches /clearinventory.
# The original stays available as /minecraft:clear.
#
# Changing this file needs a server restart, not /chorus reload.

