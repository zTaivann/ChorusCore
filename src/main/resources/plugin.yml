name: ChorusCore
version: '${version}'
main: dev.chorus.core.ChorusPlugin
api-version: '1.18'
description: Modular core for Paper servers.
authors: [ zTaivann ]
folia-supported: false
softdepend: [ Vault ]

libraries:
  - com.zaxxer:HikariCP:${hikari}
  - org.xerial:sqlite-jdbc:${sqlite}
  - org.mariadb.jdbc:mariadb-java-client:${mariadb}

# No permission or aliases here on purpose.
#   permission -> Bukkit would refuse the command itself and print its own message
#                 instead of the one in messages.yml. Every command checks in code.
#   aliases    -> they all live in aliases.yml so there is one place to edit them.
commands:
  chorus:
    description: Core administration.
    usage: /chorus reload
  home:
    description: Teleport to one of your homes.
    usage: /home [name]
  sethome:
    description: Save your current position as a home.
    usage: /sethome [name]
  delhome:
    description: Delete one of your homes.
    usage: /delhome [name]
  homes:
    description: List your homes.
    usage: /homes
  warp:
    description: Teleport to a warp.
    usage: /warp [name]
  warps:
    description: List the warps you can use.
    usage: /warps
  setwarp:
    description: Create a warp or move an existing one.
    usage: /setwarp [name]
  delwarp:
    description: Delete a warp.
    usage: /delwarp [name]
  spawn:
    description: Teleport to spawn.
    usage: /spawn [world]
  setspawn:
    description: Set the spawn point to your position.
    usage: /setspawn
  tpa:
    description: Ask a player to let you teleport to them.
    usage: /tpa [player]
  tpahere:
    description: Ask a player to teleport to you.
    usage: /tpahere [player]
  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept [player]
  tpdeny:
    description: Reject a teleport request.
    usage: /tpdeny [player]
  tpcancel:
    description: Cancel a request you sent.
    usage: /tpcancel [player]
  tptoggle:
    description: Stop accepting teleport requests.
    usage: /tptoggle
  back:
    description: Return to where you were before your last teleport.
    usage: /back [steps]

  heal:
    description: Restore health.
    usage: /heal [player]
  feed:
    description: Restore hunger.
    usage: /feed [player]
  fly:
    description: Toggle flight.
    usage: /fly [player]
  god:
    description: Toggle invulnerability.
    usage: /god [player]
  ping:
    description: Show a connection delay.
    usage: /ping [player]
  fix:
    description: Repair the item you are holding.
    usage: /fix [all]
  trash:
    description: Open a throwaway inventory.
    usage: /trash
  craft:
    description: Open a crafting table.
    usage: /craft
  anvil:
    description: Open an anvil.
    usage: /anvil
  smithingtable:
    description: Open a smithing table.
    usage: /smithingtable
  grindstone:
    description: Open a grindstone.
    usage: /grindstone
  stonecutter:
    description: Open a stonecutter.
    usage: /stonecutter
  loom:
    description: Open a loom.
    usage: /loom
  cartography:
    description: Open a cartography table.
    usage: /cartography
  enchanting:
    description: Open an enchanting table.
    usage: /enchanting
  enderchest:
    description: Open your ender chest.
    usage: /enderchest

  pay:
    description: Send money to another player.
    usage: /pay [player] [amount]
  balance:
    description: Show a money balance.
    usage: /balance [player]
  baltop:
    description: Show the richest players online.
    usage: /baltop
  eco:
    description: Give, take or set a balance.
    usage: /eco [give|take|set] [player] [amount]
  paylog:
    description: Show recent payments.
    usage: /paylog [player]
  msg:
    description: Send a private message.
    usage: /msg [player] [message]
  reply:
    description: Answer the last private message.
    usage: /reply [message]
  socialspy:
    description: Watch private messages.
    usage: /socialspy

  speed:
    description: Change walking or flying speed.
    usage: /speed [walk|fly] [1-10] [player]
  top:
    description: Teleport to the surface above you.
    usage: /top
  near:
    description: List the players around you.
    usage: /near [radius]
  tps:
    description: Show how the server is holding up.
    usage: /tps
  getpos:
    description: Show where a player is standing.
    usage: /getpos [player]
  suicide:
    description: Kill yourself.
    usage: /suicide
  burn:
    description: Set a player on fire.
    usage: /burn [player] [seconds]
  invsee:
    description: Look inside another player's inventory.
    usage: /invsee [player]
  ecsee:
    description: Look inside another player's ender chest.
    usage: /ecsee [player]

  tp:
    description: Teleport to a player, or move one to another.
    usage: /tp [player] [target]
  tphere:
    description: Bring a player to you.
    usage: /tphere [player]
  tppos:
    description: Teleport to coordinates.
    usage: /tppos [x] [y] [z] [world] [player]
  tpall:
    description: Bring everyone to you.
    usage: /tpall
  vanish:
    description: Hide yourself from other players.
    usage: /vanish
  gamemode:
    description: Change a game mode.
    usage: /gamemode [mode] [player]
  gmc:
    description: Switch to creative.
    usage: /gmc [player]
  gms:
    description: Switch to survival.
    usage: /gms [player]
  gma:
    description: Switch to adventure.
    usage: /gma [player]
  gmsp:
    description: Switch to spectator.
    usage: /gmsp [player]
  freeze:
    description: Hold a player still.
    usage: /freeze [player]
  sudo:
    description: Run a command as another player.
    usage: /sudo [player] [command]
  lockdown:
    description: Close the server to everyone but staff.
    usage: /lockdown [on|off] [reason]
  tempfly:
    description: Give a player flight that runs out.
    usage: /tempfly [player] [minutes]
  note:
    description: Keep notes about a player.
    usage: /note [add|list|clear] [player] [text]
  stafflog:
    description: Show what staff have been doing.
    usage: /stafflog [player]
  afk:
    description: Mark yourself away.
    usage: /afk
  seen:
    description: Show when a player was last online.
    usage: /seen [player]
  playtime:
    description: Show how long a player has played.
    usage: /playtime [player]
  whois:
    description: Show everything known about a player.
    usage: /whois [player]
  list:
    description: Show who is online.
    usage: /list
  ptime:
    description: Change the time of day you alone see.
    usage: /ptime [day|night|reset] [player]
  pweather:
    description: Change the weather you alone see.
    usage: /pweather [clear|rain|reset] [player]
  hat:
    description: Wear the item you are holding.
    usage: /hat
  condense:
    description: Pack loose materials into blocks.
    usage: /condense
  clearinventory:
    description: Empty an inventory.
    usage: /clearinventory [player]
  itemname:
    description: Rename the item you are holding.
    usage: /itemname [text]
  lore:
    description: Edit the lore of the item you are holding.
    usage: /lore [add|set|remove|clear]
  more:
    description: Fill the stack you are holding.
    usage: /more [amount]
  skull:
    description: Give yourself a player head.
    usage: /skull [player]
  unbreakable:
    description: Make the item you are holding unbreakable.
    usage: /unbreakable
  glow:
    description: Give the item you are holding the enchanted shimmer.
    usage: /glow
  enchant:
    description: Enchant the item you are holding.
    usage: /enchant [enchantment] [level]
  stack:
    description: Merge the loose stacks in your inventory.
    usage: /stack

  kit:
    description: Take a kit.
    usage: /kit [name]
  kits:
    description: List the kits you can take.
    usage: /kits

permissions:
  chorus.admin:
    description: Access to /chorus.
    default: op
  chorus.home.use:
    description: Allows /home.
    default: true
  chorus.home.set:
    description: Allows /sethome.
    default: true
  chorus.home.delete:
    description: Allows /delhome.
    default: true
  chorus.home.list:
    description: Allows /homes.
    default: true
  chorus.home.unlimited:
    description: Ignores the home limit.
    default: op
  chorus.warp.use:
    description: Allows /warp.
    default: true
  chorus.warp.list:
    description: Allows /warps.
    default: true
  chorus.warp.set:
