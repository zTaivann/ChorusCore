    default: true
  chorus.spawn.set:
    description: Allows /setspawn.
    default: op
  chorus.spawn.world:
    description: Allows /spawn on a named world.
    default: op
  chorus.tpa.use:
    description: Allows /tpa and /tpcancel.
    default: true
  chorus.tpa.here:
    description: Allows /tpahere.
    default: true
  chorus.tpa.accept:
    description: Allows /tpaccept.
    default: true
  chorus.tpa.toggle:
    description: Allows /tptoggle.
    default: true
  chorus.tpa.toggle.bypass:
    description: Sends requests to players who have /tptoggle on.
    default: op
  chorus.tpa.deny:
