# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   P A L E T T E                                                        │
# │   the colours every line is written in                                 │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Colour names for messages and menus: <c:accent>text</c> uses accent below.
# A value can be a colour, a gradient or another name with formatting:
#
#   accent: '<color:#c9a227>'
#   heading: '<gradient:#6b3fb5:#9b6fd4>'
#   shout: '<c:bad><bold>'

# ── Background ────────────────────────────────────────────────────────────
frame: '<color:#1a1a1a>'
muted: '<color:#333333>'

# ── Meaning ───────────────────────────────────────────────────────────────
accent: '<color:#c9a227>'
good: '<color:#3f9e4d>'
bad: '<color:#b03a3a>'

# ── Plugin name ───────────────────────────────────────────────────────────
brand: '<gradient:#a06bff:#e0c3fc>'

# ── Menu titles ───────────────────────────────────────────────────────────
menu-homes: '<gradient:#6b3fb5:#9b6fd4>'
menu-warps: '<gradient:#1f8f8c:#3fb8b4>'
menu-kits: '<gradient:#b8761f:#d9a04a>'
menu-backups: '<gradient:#8f4fd6:#b47ceb>'
menu-disposal: '<gradient:#8a4a2f:#b8724a>'
menu-inventory: '<gradient:#1f8f8c:#3fb8b4>'
menu-enderchest: '<gradient:#6b3fb5:#9b6fd4>'

# ── Headings in chat ──────────────────────────────────────────────────────
heading-info: '<gradient:#6bb6ff:#c3e0fc>'      # /whois /mail /itemdb /recipe
heading-economy: '<gradient:#ffd76b:#fff3c3>'   # /baltop /paylog
heading-staff: '<gradient:#ff8a8a:#ffd0d0>'     # /note /stafflog /restore
heading-server: '<gradient:#6bffb6:#c3fce0>'    # /tps /worlds
heading-kits: '<gradient:#ffb347:#ffe0a3>'      # the kit editor
heading-warps: '<gradient:#3ddad7:#a8f0ee>'     # /warpinfo /warpset
heading-shops: '<gradient:#b8761f:#d9a04a>'     # /shop

# ── Shop signs ────────────────────────────────────────────────────────────
sign-owner: '<color:#1f7a3f>'
sign-price: '<color:#8a5a1f>'
