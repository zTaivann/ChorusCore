# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   M E N U S                                                            │
# │   every word that appears on a screen                                  │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Titles, button names and the lore under them. Lines sent to chat are in
# messages.yml.
#
# Each menu is its own block, so every screen can say something different.
#
# MiniMessage tags such as <gold>, and the old codes &6 and &l, both work in the
# same line. Write && for an & that is not a colour.
#
# <newline> starts a new line of lore. An empty line ('') draws nothing.

menu:

  # ── The navigation strip ────────────────────────────────────────────────
  #
  # The bottom row of every paged screen.
  buttons:
    previous: '<color:#c9a227>« Previous'
    previous-lore: '<dark_gray>▪ <gray>Page <white>%page%'
    next: '<color:#c9a227>Next »'
    next-lore: '<dark_gray>▪ <gray>Page <white>%page%'
    close: '<color:#b03a3a>✖ Close'
    close-lore: '<dark_gray>▪ <gray>Closes this menu'
    back: '<color:#c9a227>« Back'
    back-lore: '<dark_gray>▪ <gray>To the screen before this one'

  # ── /homes ──────────────────────────────────────────────────────────────
  homes:
    title: '<color:#1a1a1a>» <gradient:#6b3fb5:#9b6fd4>YOUR HOMES</gradient> <color:#1a1a1a>« <color:#333333>%page%<color:#1a1a1a>/<color:#333333>%pages%'
    entry: '<gradient:#6b3fb5:#9b6fd4>%home%'
    lore-world: '<dark_gray>▪ <gray>World <dark_gray>» <white>%world%'
    lore-location: '<dark_gray>▪ <gray>Location <dark_gray>» <white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%'
    lore-created: '<dark_gray>▪ <gray>Created on <dark_gray>» <white>%date%'
    lore-divider: '<dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪'
    lore-action: '<color:#3f9e4d>➜ <gray>Click to teleport'

  # ── /warps ──────────────────────────────────────────────────────────────
  #
  # Warps with a section of their own open a screen of sections first. Give them
  # one with /warpset <warp> section <name>.
  warps:
    title: '<color:#1a1a1a>» <gradient:#1f8f8c:#3fb8b4>WARPS</gradient> <color:#1a1a1a>« <color:#333333>%page%<color:#1a1a1a>/<color:#333333>%pages%'
    section: '<gradient:#1f8f8c:#3fb8b4>%section%'
    section-lore: '<dark_gray>▪ <gray>Contains <white>%count%</white> <gray>warps<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to open'
    section-title: '<color:#1a1a1a>» <gradient:#1f8f8c:#3fb8b4>%section%</gradient> <color:#1a1a1a>« <color:#333333>%page%<color:#1a1a1a>/<color:#333333>%pages%'
    section-loose: 'Other'
    entry: '<gradient:#1f8f8c:#3fb8b4>%warp%'
    lore-description: '<gray>%description%'
    lore-uses: '<dark_gray>▪ <gray>Used <dark_gray>» <white>%uses%</white> <gray>times'
    lore-world: '<dark_gray>▪ <gray>World <dark_gray>» <white>%world%'
    lore-location: '<dark_gray>▪ <gray>Location <dark_gray>» <white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%'
    lore-divider: '<dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪'
    lore-action: '<color:#3f9e4d>➜ <gray>Click to teleport'

  # ── /kits ───────────────────────────────────────────────────────────────
  kits:
    title: '<color:#1a1a1a>» <gradient:#b8761f:#d9a04a>KITS</gradient> <color:#1a1a1a>« <color:#333333>%page%<color:#1a1a1a>/<color:#333333>%pages%'
    lore-divider: '<dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪'
    lore-action: '<color:#3f9e4d>➜ <gray>Click to claim this kit'
    lore-cooldown: '<color:#b03a3a>✖ <gray>Ready in <white>%time%'
    lore-taken: '<color:#b03a3a>✖ <gray>Already taken'
    lore-locked: '<color:#b03a3a>✖ <gray>You do not meet what it asks for'

  # ── /restore ────────────────────────────────────────────────────────────
  #
  # The saved inventories, one of them laid out, and its ender chest.
  backups:
    title: '<color:#1a1a1a>» <gradient:#8f4fd6:#b47ceb>BACKUPS</gradient> <color:#1a1a1a>« <color:#333333>%player% <color:#1a1a1a>▪ <color:#333333>%page%<color:#1a1a1a>/<color:#333333>%pages%'
    entry: '<gradient:#8f4fd6:#b47ceb>%reason%</gradient> <dark_gray>▪ <gray>%ago% ago'
    entry-lore: '<dark_gray>▪ <gray>By <dark_gray>» <white>%actor%<newline><dark_gray>▪ <gray>At <dark_gray>» <white>%world% %x% %y% %z%<newline><dark_gray>▪ <gray>Level <white>%level%</white> <dark_gray>▪ <gray>Health <white>%health%</white> <dark_gray>▪ <gray>Food <white>%food%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to look inside'
    entry-death-lore: '<dark_gray>▪ <color:#b03a3a>Cause <dark_gray>» <white>%cause%<newline><dark_gray>▪ <gray>At <dark_gray>» <white>%world% %x% %y% %z%<newline><dark_gray>▪ <gray>Level <white>%level%</white> <dark_gray>▪ <gray>Health <white>%health%</white> <dark_gray>▪ <gray>Food <white>%food%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to look inside'
    entry-killed-lore: '<dark_gray>▪ <color:#b03a3a>Killed by <dark_gray>» <white>%killer%<newline><dark_gray>▪ <gray>At <dark_gray>» <white>%world% %x% %y% %z%<newline><dark_gray>▪ <gray>Level <white>%level%</white> <dark_gray>▪ <gray>Health <white>%health%</white> <dark_gray>▪ <gray>Food <white>%food%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to look inside'
    reason-death: 'Death'
    reason-join: 'Joined'
    reason-quit: 'Left'
    reason-world: 'Left world'
    reason-clear: 'Cleared'
    reason-kit: 'Kit'
    reason-restore: 'Restored'
    reason-manual: 'Saved by hand'
    view-title: '<color:#1a1a1a>» <gradient:#8f4fd6:#b47ceb>BACKUP</gradient> <color:#1a1a1a>« <color:#333333>%player% <color:#1a1a1a>▪ <color:#333333>%ago% ago'
    ender-title: '<color:#1a1a1a>» <gradient:#6b3fb5:#9b6fd4>ENDER CHEST</gradient> <color:#1a1a1a>« <color:#333333>%player% <color:#1a1a1a>▪ <color:#333333>%ago% ago'
    ender: '<color:#c9a227>◆ Ender chest'
    ender-lore: '<dark_gray>▪ <gray>What was in it at the time<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to look'
    restore: '<color:#3f9e4d>✚ Restore inventory'
    restore-lore: '<dark_gray>▪ <gray>Puts these items back<newline><dark_gray>▪ <gray>What they carry now is saved first<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to restore'
    restore-all: '<color:#3f9e4d>✦ Restore everything'
    restore-all-lore: '<dark_gray>▪ <gray>Inventory, ender chest, XP, health and food<newline><dark_gray>▪ <gray>What they have now is saved first<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to restore'
    hand-over: '<color:#c9a227>✋ Hand the items over'
    hand-over-lore: '<dark_gray>▪ <gray>Gives these items back without<newline><dark_gray>▪ <gray>taking away what they carry now<newline><dark_gray>▪ <gray>Anything that does not fit drops at their feet<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to hand over'
    filter: '<color:#c9a227>◆ Showing <white>%filter%'
    filter-all: 'everything'
    filter-lore: '<dark_gray>▪ <gray>Next <dark_gray>» <white>%next%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to change'
    restore-ender: '<color:#3f9e4d>✚ Restore ender chest'
    restore-ender-lore: '<dark_gray>▪ <gray>Puts only these items back<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to restore'

  # ── Chest shop signs ────────────────────────────────────────────────────
  #
  # The four lines a [Shop] sign shows once it is made.
  shops:
    sign-owner: '<color:#1f7a3f>%player%'
    sign-selling: '<color:#1a1a1a>Selling <color:#333333>%amount%'
    sign-buying: '<color:#1a1a1a>Buying <color:#333333>%amount%'
    sign-item: '<color:#333333>%item%'
    sign-price: '<color:#8a5a1f>%price% <color:#1a1a1a>each'


  # ── Screens that show an inventory ──────────────────────────────────────
  titles:
    disposal: '<color:#1a1a1a>» <gradient:#8a4a2f:#b8724a>DISPOSAL</gradient> <color:#1a1a1a>«'
    invsee: '<color:#1a1a1a>» <gradient:#1f8f8c:#3fb8b4>INVENTORY</gradient> <color:#1a1a1a>« <color:#333333>%player%'
    ecsee: '<color:#1a1a1a>» <gradient:#6b3fb5:#9b6fd4>ENDER CHEST</gradient> <color:#1a1a1a>« <color:#333333>%player%'

  # ── /kitedit ────────────────────────────────────────────────────────────
  #
  # The kit editor, buttons and chat prompts.
  editor:
    list-title: '<color:#1a1a1a>» <gradient:#b8761f:#d9a04a>KIT EDITOR</gradient> <color:#1a1a1a>« <color:#333333>%page%<color:#1a1a1a>/<color:#333333>%pages%'
    ask-name: '%prefix%<gray>Type a name for the new kit. Letters, numbers, <white>-</white> and <white>_</white>.'
    ask-display: '%prefix%<gray>Type the name <white>%kit%</white> should be shown by. Colours work either way: <white>&&6VIP</white> or <white>\<gold>VIP'
    ask-lore: '%prefix%<gray>Type the lines under the name of <white>%kit%</white>. Separate them with <white>|</white>, or type <white>none</white> to clear them.'
    ask-permission: '%prefix%<gray>Type the permission <white>%kit%</white> should need, or <white>none</white> for everyone.'
    ask-cooldown: '%prefix%<gray>Type the wait for <white>%kit%</white>, in seconds. <white>3600</white> is an hour, <white>86400</white> a day.'
    ask-maxclaims: '%prefix%<gray>Type how many times <white>%kit%</white> may ever be taken. <white>0</white> is no limit.'
    ask-price: '%prefix%<gray>Type what <white>%kit%</white> should cost. <white>0</white> is free.'
    icon: '<color:#c9a227>✎ Icon'
    icon-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%icon%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click an item in your inventory to copy it<newline><dark_gray>▪ <gray>Its name and enchantments are kept<newline><dark_gray>▪ <gray>Nothing is taken from your inventory'
    icon-title: '<color:#1a1a1a>» <gradient:#b8761f:#d9a04a>%kit%</gradient> <color:#1a1a1a>« <color:#333333>Click an item to copy it'
    icon-set: '%prefix%<gray>Kit <white>%kit%</white> <dark_gray>» <gray>icon is now <white>%icon%</white>.'
    lore: '<color:#c9a227>✎ Lore'
    lore-lore: '<dark_gray>▪ <gray>Lines <dark_gray>» <white>%value%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to type them'
    header-lore: '<dark_gray>▪ <gray>Shown as <dark_gray>» <white>%display%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to rename it'
    list-entry: '<gradient:#b8761f:#d9a04a>%kit%'
    list-entry-lore: '<dark_gray>▪ <gray>Contains <white>%items%</white> items<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to edit'
    new: '<color:#3f9e4d>✚ New kit'
    new-lore: '<dark_gray>▪ <gray>Carry what it should hold first<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click for the command'
    title: '<color:#1a1a1a>» <gradient:#b8761f:#d9a04a>%kit%</gradient> <color:#1a1a1a>«'
    header: '<gradient:#b8761f:#d9a04a>%kit%'
    items: '<color:#c9a227>✦ Items'
    items-lore: '<dark_gray>▪ <gray>Contains <white>%count%</white><newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to lay them out<newline><dark_gray>▪ <gray>Copies only. Nothing is taken from your inventory'
    items-title: '<color:#1a1a1a>» <gradient:#b8761f:#d9a04a>%kit%</gradient> <color:#1a1a1a>« <color:#333333>Click to copy, close to save'
    preview: '<color:#c9a227>◆ Preview'
    preview-lore: '<dark_gray>▪ <gray>See it as a player would<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to look'
    preview-title: '<color:#1a1a1a>» <gradient:#1f8f8c:#3fb8b4>%kit%</gradient> <color:#1a1a1a>« <color:#333333>Preview'
    cooldown: '<color:#c9a227>● Cooldown'
    cooldown-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>▸ <gray>Left <white>+1m</white><dark_gray>, <gray>right <white>-1m<newline><color:#3f9e4d>▸ <gray>Shift for whole days<newline><color:#3f9e4d>▸ <gray>Press <white>Q</white> to type the seconds'
    maxclaims: '<color:#c9a227>◇ Max claims'
    maxclaims-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>▸ <gray>Left <white>+1</white><dark_gray>, <gray>right <white>-1<newline><color:#3f9e4d>▸ <gray>Shift for ten at a time<newline><color:#3f9e4d>▸ <gray>Press <white>Q</white> to type the number'
    price: '<color:#c9a227>★ Price'
    price-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>▸ <gray>Left <white>+10</white><dark_gray>, <gray>right <white>-10<newline><color:#3f9e4d>▸ <gray>Shift for hundreds<newline><color:#3f9e4d>▸ <gray>Press <white>Q</white> to type the amount'
    permission: '<color:#c9a227>✎ Permission'
    permission-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to change it'
    onetime: '<color:#c9a227>◆ One-time'
    onetime-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪ <gray>Can only ever be claimed once, whatever the cooldown is<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to switch'
    autoarmor: '<color:#c9a227>◆ Auto armour'
    autoarmor-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪ <gray>Armour goes on, not into the inventory<newline><dark_gray>▪ <gray>A slot already filled is left alone<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to switch'
    clearinventory: '<color:#c9a227>◆ Clear first'
    clearinventory-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪ <gray>Empties the inventory before handing it over<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to switch'
    back: '<color:#c9a227>« Back'
    back-lore: '<dark_gray>▪ <gray>To the list of kits'
    delete: '<color:#b03a3a>✖ Delete'
    delete-lore: '<dark_gray>▪ <gray>Removes it from kits.yml<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#b03a3a>➜ <gray>Shift-click to confirm'
    delete-confirm: '%prefix%<color:#b03a3a>Shift-click to delete <white>%kit%</white> for good.'
    requirements: '<color:#c9a227>◇ Requirements'
    requirements-lore: '<dark_gray>▪ <gray>Set <dark_gray>» <white>%count%<newline><dark_gray>▪ <gray>What has to be true to take it<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to open them'
    requirements-title: '<color:#1a1a1a>» <gradient:#b8761f:#d9a04a>%kit%</gradient> <color:#1a1a1a>« <color:#333333>Requirements'
    claimactions: '<color:#c9a227>✦ Claim actions'
    claimactions-lore: '<dark_gray>▪ <gray>Set <dark_gray>» <white>%count%<newline><dark_gray>▪ <gray>What happens when it is taken<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to open them'
    claimactions-title: '<color:#1a1a1a>» <gradient:#b8761f:#d9a04a>%kit%</gradient> <color:#1a1a1a>« <color:#333333>Claim actions'
    failactions: '<color:#c9a227>✖ Fail actions'
    failactions-lore: '<dark_gray>▪ <gray>Set <dark_gray>» <white>%count%<newline><dark_gray>▪ <gray>What happens when it is refused<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to open them'
    failactions-title: '<color:#1a1a1a>» <gradient:#b8761f:#d9a04a>%kit%</gradient> <color:#1a1a1a>« <color:#333333>Fail actions'
    placeholders: '<color:#c9a227>◆ Placeholders'
    placeholders-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪ <gray>Fills <white>%player%</white> and <white>%date%</white> into item text<newline><dark_gray>▪ <gray>Only items that use one are rebuilt<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to switch'
    rule-entry: '<color:#c9a227>%index%<dark_gray>. <white>%kind%'
    rule-entry-lore: '<dark_gray>▪ <gray>%line%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to rewrite it<newline><color:#b03a3a>➜ <gray>Shift-click to remove it'
    requirement-entry-lore: '<dark_gray>▪ <gray>%line%<newline><dark_gray>▪ <gray>Refused with <dark_gray>» <white>%deny%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to rewrite it<newline><color:#3f9e4d>▸ <gray>Right-click for the refusal line<newline><color:#b03a3a>➜ <gray>Shift-click to remove it'
    rule-deny-default: 'the usual message'
    rule-unknown: '<color:#b03a3a>%index%<dark_gray>. <color:#b03a3a>Not understood'
    rule-unknown-lore: '<dark_gray>▪ <gray>%line%<newline><dark_gray>▪ <gray>As it stands this line does nothing<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#3f9e4d>➜ <gray>Click to rewrite it<newline><color:#b03a3a>➜ <gray>Shift-click to remove it'
    rule-empty: '<gray>Nothing here yet'
    rule-empty-lore: '<dark_gray>▪ <gray>Click <white>Add</white> below<newline><dark_gray>▪ <gray>Its lore lists everything you can write'
    rule-add: '<color:#3f9e4d>✚ Add'
    action-add-lore: '<dark_gray>▪ <gray>Written as <white>type: value<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#c9a227>▸ <white>message: <gray>a line to the player<newline><color:#c9a227>▸ <white>broadcast: <gray>a line to everyone<newline><color:#c9a227>▸ <white>actionbar: <gray>a line above the hotbar<newline><color:#c9a227>▸ <white>title: <gray>big text<dark_gray>;<gray>small text<newline><color:#c9a227>▸ <white>sound: <gray>name volume pitch<newline><color:#c9a227>▸ <white>console: <gray>a command run as the server<newline><color:#c9a227>▸ <white>player: <gray>a command run as the player<newline><color:#c9a227>▸ <white>close <gray>shuts the screen<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><dark_gray>▪ <gray>Example <dark_gray>» <white>sound: entity.player.levelup 1 1.4<newline><dark_gray>▪ <gray>Colours work: <white>&&a</white> or <white>\<green><newline><dark_gray>▪ <gray>They run in the order listed<newline><color:#3f9e4d>➜ <gray>Click to type one'
    requirement-add-lore: '<dark_gray>▪ <gray>Written as <white>type: value<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><color:#c9a227>▸ <white>permission: <gray>a permission node<newline><color:#c9a227>▸ <white>money: <gray>how much they must have<newline><color:#c9a227>▸ <white>playtime: <gray>seconds they must have played<newline><color:#c9a227>▸ <white>kit: <gray>another kit they must have taken<newline><color:#c9a227>▸ <white>placeholder: <gray>any PlaceholderAPI value<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><dark_gray>▪ <gray>Compare with <white>>=</white> <white>\<=</white> <white>==</white> <white>!=</white> <white>></white> <white>\<</white> <gray>or <white>contains<newline><dark_gray>▪ <gray>Example <dark_gray>» <white>placeholder: %player_level% >= 10<newline><dark_gray>▪ <gray>Example <dark_gray>» <white>money: 500<newline><dark_gray>▪ <gray>All of them must pass<newline><color:#3f9e4d>➜ <gray>Click to type one'
    rule-back: '<color:#c9a227>« Back'
    rule-back-lore: '<dark_gray>▪ <gray>To <white>%kit%'
    rule-current: '%prefix%<gray>Now <dark_gray>» <white>%line%'
    rule-saved: '%prefix%<gray>Kit <white>%kit%</white> <dark_gray>» <gray>saved.'
