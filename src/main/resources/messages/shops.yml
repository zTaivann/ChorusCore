# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   S H O P S                                                            │
# │   [Buy] and [Sell] signs  -  /sell  /worth  /setworth                  │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

shops:
  sign-created: '%prefix%<green>Shop sign created for <white>%amount% %item%</white>.'
  sign-invalid: '%prefix%<red>That sign is not a valid shop. It needs four lines: the header, an amount, an item and a price.'
  no-worth: '%prefix%<red><white>%item%</white> cannot be sold on this server.'
  not-enough: '%prefix%<red>You need <white>%amount% %item%</white>.'
  none-carried: '%prefix%<gray>You are not carrying any <white>%item%</white>.'
  nothing-to-sell: '%prefix%<gray>Nothing you are carrying can be sold.'
  no-room: '%prefix%<red>There is no room for <white>%item%</white>.'
  bought: '%prefix%<green>You bought <white>%amount% %item%</white> for <white>%price%</white>.'
  sold: '%prefix%<green>You sold <white>%amount% %item%</white> for <white>%price%</white>.'
  sold-all: '%prefix%<green>You sold <white>%amount%</white> items of <white>%kinds%</white> types for <white>%price%</white>.'
  sell-usage: '%prefix%<gray>Usage: <white>/sell [hand|all|item] [amount]</white>'
  sell-unknown: '%prefix%<red>There is no item called <white>%item%</white>.'
  worth: '%prefix%<white>%item%</white> <dark_gray>» <white>%each%</white> <gray>each <dark_gray>▪ <white>%amount%</white> <gray>are worth <white>%total%</white>.'
  setworth-usage: '%prefix%<gray>Usage: <white>/setworth [item] [price]</white>. A price of 0 removes it from the list.'
  setworth-done: '%prefix%<green><white>%item%</white> now sells for <white>%price%</white>.'
  setworth-cleared: '%prefix%<gray><white>%item%</white> can no longer be sold.'

  chest-usage: '%prefix%<gray>Usage: <white>/shop [info|price|mode|unlimited|remove|list]</white>'
  chest-needs-container: '%prefix%<red>A shop sign has to be placed on a chest, a barrel or a trapped chest.'
  chest-hold-item: '%prefix%<red>Hold the item you want to trade while you write the sign.'
  chest-already: '%prefix%<red>That container is already a shop.'
  chest-limit: '%prefix%<red>You already have <white>%limit%</white> shops.'
  chest-limit-world: '%prefix%<red>You already have <white>%limit%</white> shops in <white>%world%</white>.'
  chest-price-too-high: '%prefix%<red>The highest price for one item is <white>%max%</white>.'
  chest-ask-price: '%prefix%<gray>Creating a shop for <white>%item%</white>.'
  chest-ask-price-prompt: '%prefix%<gray>Type the price of <white>one</white> item.'
  chest-bad-price: '%prefix%<red>That is not a valid price, so the shop was not created.'
  chest-cancelled: '%prefix%<gray>Nothing was changed.'
  chest-created-selling: '%prefix%<green>Shop created. Selling <white>%item%</white> for <white>%price%</white> each.'
  chest-created-buying: '%prefix%<green>Shop created. Buying <white>%item%</white> for <white>%price%</white> each.'
  chest-gone: '%prefix%<red>That shop no longer exists.'
  chest-broken: '%prefix%<red>That shop cannot be read. Tell an administrator.'
  chest-too-far: '%prefix%<gray>You are too far from the shop.'
  chest-not-looking: '%prefix%<red>You are not looking at a shop.'
  chest-not-yours: '%prefix%<red>That shop belongs to <white>%player%</white>.'
  chest-protected: '%prefix%<red>That belongs to the shop of <white>%player%</white>.'
  chest-info-header: '<dark_gray>» <c:heading-shops><bold>SHOP</bold></c> <dark_gray>«'
  chest-info-owner: '<dark_gray>▪ <gray>Owner <dark_gray>» <white>%player%'
  chest-info-item: '<dark_gray>▪ <gray>Item <dark_gray>» <white>%item%'
  chest-info-price: '<dark_gray>▪ <gray>Price <dark_gray>» <white>%price%</white> <gray>each'
  chest-info-stock: '<dark_gray>▪ <gray>In stock <dark_gray>» <white>%amount%'
  chest-info-room: '<dark_gray>▪ <gray>Room for <dark_gray>» <white>%amount%'
  chest-info-unlimited: '<dark_gray>▪ <gray>This shop is unlimited.'
  chest-info-yours: '<dark_gray>▪ <gray>This is your shop. Change it with <white>/shop</white>, or right-click the chest to open it.'
  chest-unlimited: 'unlimited'
  chest-ask-buy: '%prefix%<gray>You can buy <white>%amount%</white>.'
  chest-ask-sell: '%prefix%<gray>You can sell <white>%amount%</white>.'
  chest-ask-amount: '%prefix%<gray>Type the amount, or <white>all</white>.'
  chest-bad-amount: '%prefix%<red>That is not a valid number.'
  chest-empty: '%prefix%<red>That shop is out of stock.'
  chest-full: '%prefix%<red>That shop is full.'
  chest-owner-broke: '%prefix%<red><white>%player%</white> cannot pay for that right now.'
  chest-bought: '%prefix%<green>You bought <white>%amount% %item%</white> for <white>%price%</white>.'
  chest-sold: '%prefix%<green>You sold <white>%amount% %item%</white> for <white>%price%</white>.'
  chest-owner-sold: '%prefix%<white>%player%</white><gray> bought <white>%amount% %item%</white> from you for <white>%price%</white>.'
  chest-owner-bought: '%prefix%<white>%player%</white><gray> sold you <white>%amount% %item%</white> for <white>%price%</white>.'
  chest-price-set: '%prefix%<green>The price is now <white>%price%</white> each.'
  chest-mode-selling: '%prefix%<gray>This shop now <white>sells</white> to players.'
  chest-mode-buying: '%prefix%<gray>This shop now <white>buys</white> from players.'
  chest-unlimited-on: '%prefix%<green>This shop is now unlimited.'
  chest-unlimited-off: '%prefix%<gray>This shop uses its container again.'
  chest-remove-confirm: '%prefix%<red>This removes the shop. The items in the container stay there.'
  chest-removed: '%prefix%<gray>Shop removed.'
  chest-list-header: '<dark_gray>» <c:heading-shops><bold>YOUR SHOPS</bold></c> <dark_gray>« <gray>%count%/%limit%'
  chest-list-entry: '<dark_gray>▪ <white>%item% <dark_gray>» <gray>%price% <dark_gray>▪ <gray>%world% %x% %y% %z%'
  chest-list-empty: '%prefix%<gray>You have no shops.'
  chest-list-broken: 'unreadable item'
