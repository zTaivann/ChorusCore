# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   E C O N O M Y                                                        │
# │   /pay  /balance  /baltop  /eco  /paylog                               │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

economy:
  insufficient: '%prefix%<red>The price is <white>%price%</white> and your balance is <white>%balance%</white>.'
  charged: '%prefix%<gray>Charged <white>%price%</white>.'
  refunded: '%prefix%<gray>Refunded <white>%price%</white>.'
  insufficient-items: '%prefix%<red>The price is <white>%amount% %item%</white> and you have <white>%held%</white>.'
  charged-items: '%prefix%<gray>Charged <white>%amount% %item%</white>.'
  refunded-items: '%prefix%<gray>Refunded <white>%amount% %item%</white>.'
  unavailable: '%prefix%<red>This server has no economy set up.'
  balance: '%prefix%<gray>Your balance is <white>%balance%</white>.'
  balance-other: '%prefix%<gray>The balance of <white>%player%</white> is <white>%balance%</white>.'
  pay-usage: '%prefix%<gray>Usage: <white>/pay [player] [amount]</white>'
  pay-self: '%prefix%<red>You cannot pay yourself.'
  invalid-amount: '%prefix%<red>That is not a valid amount.'
  pay-minimum: '%prefix%<red>The smallest payment is <white>%amount%</white>.'
  pay-maximum: '%prefix%<red>The largest payment is <white>%amount%</white>.'
  transfer-failed: '%prefix%<red>The payment failed. Nothing was taken.'
  pay-sent: '%prefix%<gray>You paid <white>%amount%</white> to <white>%player%</white>.'
  pay-sent-taxed: '%prefix%<gray>You paid <white>%amount%</white> to <white>%player%</white>. The tax was <white>%tax%</white>, so they got <white>%received%</white>.'
  pay-received: '%prefix%<gray><white>%player%</white> paid you <white>%amount%</white>.'
  eco-usage: '%prefix%<gray>Usage: <white>/eco [give|take|set|reset] [player] [amount]</white>'
  eco-failed: '%prefix%<red>The economy plugin refused that change to the balance of %player%.'
  eco-give-done: '%prefix%<gray>Gave <white>%amount%</white> to <white>%player%</white>. Their balance is now <white>%balance%</white>.'
  eco-give-received: '%prefix%<green>You received <white>%amount%</white></green><gray>. Your balance is now <white>%balance%</white>.'
  eco-take-done: '%prefix%<gray>Took <white>%amount%</white> from <white>%player%</white>. Their balance is now <white>%balance%</white>.'
  eco-take-received: '%prefix%<red><white>%amount%</white> was taken from you</red><gray>. Your balance is now <white>%balance%</white>.'
  eco-set-done: '%prefix%<gray>The balance of <white>%player%</white> is now <white>%balance%</white>.'
  eco-set-received: '%prefix%<gray>Your balance is now <white>%balance%</white>.'
  baltop-header: '<dark_gray>» <c:heading-economy><bold>TOP BALANCES</bold></c> <dark_gray>« <gray>%count% <dark_gray>▪ <gray>%page%<dark_gray>/<gray>%pages%'
  baltop-entry: '<dark_gray>▪ <gray>%place%<dark_gray>. <white>%player% <dark_gray>» <gold>%amount%'
  baltop-empty: '%prefix%<gray>There are no players to rank yet.'
  baltop-refreshed: '%prefix%<gray>The ranking was cleared. The next <white>/baltop</white> calculates it again.'
  baltop-refresh-external: '%prefix%<gray>Another plugin keeps the balances, so there is no ranking to refresh.'
  paylog-header: '<dark_gray>» <c:heading-economy><bold>PAYMENTS</bold></c> <dark_gray>« <gray>%count%'
  paylog-entry: '<dark_gray>▪ <white>%payer% <dark_gray>-> <white>%payee% <dark_gray>» <gold>%amount% <dark_gray>(<gray>%ago% ago<dark_gray>)'
  paylog-empty: '%prefix%<gray>The payment log is empty.'
  paylog-disabled: '%prefix%<red>The payment log is disabled on this server.'

  toggle-on: '%prefix%<green>You accept payments again.'
  toggle-off: '%prefix%<gray>You no longer accept payments. <white>/paytoggle</white> turns them back on.'
  pay-refused: '%prefix%<red>%player% does not accept payments.'
  pay-confirm: '%prefix%<gray>You are about to pay <white>%amount%</white> to <white>%player%</white>.'
  baltop-total: '<dark_gray>▪ <gray>Server total <dark_gray>» <white>%amount%'

  eco-reset-done: '%prefix%<gray>The balance of <white>%player%</white> was reset to <white>%balance%</white>.'
  eco-reset-received: '%prefix%<gray>Your balance was reset to <white>%balance%</white>.'
