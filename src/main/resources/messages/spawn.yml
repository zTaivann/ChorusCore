# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   S P A W N                                                            │
# │   /spawn  /setspawn                                                    │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

spawn:
  set: '%prefix%<gray>Spawn set at your location.'
  set-world: '%prefix%<gray>Spawn of <white>%world%</white> set at your location.'
  teleported: '%prefix%<gray>You arrived at the spawn.'
  not-set: '%prefix%<red>The spawn has not been set yet.'
  world-missing: '%prefix%<red>The spawn world <white>%world%</white> is not loaded.'
  no-such-world: '%prefix%<red>There is no world called <white>%world%</white>.'
