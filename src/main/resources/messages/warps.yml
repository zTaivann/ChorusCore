# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   W A R P S                                                            │
# │   /warp  /warps  /setwarp  /delwarp  /warpinfo  /warpset               │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Part of the messages folder. See core.yml.
# A 'prefix' set here is what %prefix% means in this file.

warp:
  none: '%prefix%<gray>There are no warps you can use.'
  created: '%prefix%<gray>Warp <white>%warp%</white> created.'
  updated: '%prefix%<gray>Warp <white>%warp%</white> moved to where you are standing.'
  deleted: '%prefix%<gray>Warp <white>%warp%</white> deleted.'
  teleported: '%prefix%<gray>Teleported to <white>%warp%</white>.'
  unknown: '%prefix%<red>There is no warp called <white>%warp%</white>.'
  locked: '%prefix%<red>You do not have access to the warp <white>%warp%</white>.'
  invalid-name: '%prefix%<red>Invalid name. Use letters, numbers, <white>-</white> or <white>_</white>, up to %max% characters.'
  world-missing: '%prefix%<red>The world <white>%world%</white> is not loaded right now.'
  use-usage: '%prefix%<gray>Usage: <white>/warp [name]</white>'
  set-usage: '%prefix%<gray>Usage: <white>/setwarp [name]</white>'
  delete-usage: '%prefix%<gray>Usage: <white>/delwarp [name]</white>'
  sent: '%prefix%<gray>Sent <white>%player%</white> to <white>%warp%</white>.'
  sent-received: '%prefix%<gray>%player% sent you to <white>%warp%</white>.'
  sign-created: '%prefix%<gray>Sign made. It sends players to <white>%warp%</white>.'
  settings-help-header: '<dark_gray>» <c:heading-warps><bold>WARP SETTINGS</bold></c> <dark_gray>«'
  settings-help-line: '<dark_gray>▪ <aqua>%usage% <dark_gray>» <gray>%what%'
  settings-help-hover: '<gray>Click to start typing the command'
  settings-help-footer: '<dark_gray>▪ <gray>Leave the value off to put a setting back to what <white>warps.yml</white> says.<newline><dark_gray>▪ <gray>See it all with <white>/warpinfo [warp]</white>.'
  settings-help-icon: 'how it looks in the /warps menu'
  settings-help-permission: 'who may use it. Wins over per-warp-permission'
  settings-help-price: 'what that one warp costs, through Vault'
  settings-help-cooldown: 'the wait after using that one warp'
  settings-help-description: 'a line under its name in the menu'
  settings-help-section: 'groups it with the others in /warps'
  info-usage: '%prefix%<gray>Usage: <white>/warpinfo [warp]</white>'
  info-header: '<dark_gray>» <c:heading-warps>%warp%</c> <dark_gray>«'
  info-description: '<gray>%description%'
  info-world: '<dark_gray>▪ <gray>Location <dark_gray>» <white>%world%</white> <dark_gray>(<white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%<dark_gray>)'
  info-section: '<dark_gray>▪ <gray>Section <dark_gray>» <white>%section%'
  info-uses: '<dark_gray>▪ <gray>Used <dark_gray>» <white>%uses%</white> <gray>times'
  info-created: '<dark_gray>▪ <gray>Created <dark_gray>» <white>%date%'
  info-price: '<dark_gray>▪ <gray>Costs <dark_gray>» <gold>%price%'
  info-cooldown: '<dark_gray>▪ <gray>Wait <dark_gray>» <white>%time%'
  info-permission: '<dark_gray>▪ <gray>Permission <dark_gray>» <white>%permission%'
  settings-done: '%prefix%<gray>Warp <white>%warp%</white>: <white>%setting%</white> is now <white>%value%</white>.'
  settings-cleared: '%prefix%<gray>Warp <white>%warp%</white>: <white>%setting%</white> is back to the default.'
  settings-bad-icon: '%prefix%<red>This version has no item called <white>%value%</white>.'
  settings-bad-number: '%prefix%<red>%value% is not a number this setting accepts.'
  list:
    header: '%prefix%<gray>Warps <dark_gray>(<white>%count%</white>)</dark_gray>'
    entry: '<white>%warp%</white>'
    separator: '<dark_gray>, </dark_gray>'
    hover: '<gray>Go to <white>%warp%</white><newline><dark_gray>%world% %x%, %y%, %z%</dark_gray>'
    hover-description: '<gray>Go to <white>%warp%</white><newline><gray>%description%<newline><dark_gray>%world%</dark_gray>'
    section: '<dark_gray>» <gray>%section%'

  delete-confirm: '%prefix%<red>This deletes the warp <white>%warp%</white> for good.'
  section-unknown: '%prefix%<gray>There is no section called <white>%section%</white>.'
