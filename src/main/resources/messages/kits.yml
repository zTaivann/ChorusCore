# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   K I T S                                                              │
# │   /kit  /kits  /kitedit                                                │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

kits:
  usage: '%prefix%<gray>Usage: <white>/kit [kit]</white>. Use <white>/kits</white> to see them all.'
  none: '%prefix%<gray>There are no kits you can claim.'
  unknown: '%prefix%<red>There is no kit called <white>%kit%</white>.'
  received: '%prefix%<gray>You claimed the <white>%kit%</white> kit.'
  cooldown: '%prefix%<red>The <white>%kit%</white> kit is available again in <white>%time%</white>.'
  one-time: '%prefix%<red>The <white>%kit%</white> kit can only be claimed once.'
  spent: '%prefix%<red>You have claimed the <white>%kit%</white> kit as many times as allowed.'
  requirement: '%prefix%<red>You do not meet the requirements of the <white>%kit%</white> kit.'
  list-header: '%prefix%<gray>Kits <dark_gray>(<white>%count%</white>)</dark_gray>'
  list-entry: '<white>%kit%</white>'
  list-separator: '<dark_gray>, </dark_gray>'

  edit-help-header: '<dark_gray>» <c:heading-kits><bold>KIT EDITOR</bold></c> <dark_gray>«'
  edit-help-line: '<dark_gray>▪ <yellow>%usage% <dark_gray>» <gray>%what%'
  edit-help-hover: '<gray>Click to type the command'
  edit-help-footer: '<dark_gray>▪ <gray>Without a value, the setting goes back to its default.<newline><dark_gray>▪ <gray>See all settings with <white>/kitedit [kit]</white>.'
  edit-help-create: 'creates the kit from what you are carrying'
  edit-help-items: 'replaces its items with what you are carrying'
  edit-help-icon: 'the icon in the /kits menu'
  edit-help-display: 'the name shown in the menu, with colour codes or tags'
  edit-help-lore: 'lines under that name. Separate them with |'
  edit-help-cooldown: 'the cooldown before the same player can claim it again'
  edit-help-maxclaims: 'how many times it can be claimed in total. 0 is no limit'
  edit-help-price: 'the price to claim it'
  edit-help-permission: 'the permission needed to claim it. Leave it empty for everyone'
  edit-help-onetime: 'it can only be claimed once, whatever the cooldown'
  edit-help-autoarmor: 'armour is equipped directly instead of going into the inventory'
  edit-help-clearinventory: 'empties the inventory before giving the kit'
  edit-help-placeholders: 'replaces %player% and %date% in the text of the items'
  edit-help-delete: 'deletes the kit from kits.yml'

  edit-info-header: '<dark_gray>» <c:heading-kits>%kit%</c> <dark_gray>«'
  edit-info-display: '<dark_gray>▪ <gray>Display name <dark_gray>» <white>%display%'
  edit-info-icon: '<dark_gray>▪ <gray>Icon <dark_gray>» <white>%icon%'
  edit-info-cooldown: '<dark_gray>▪ <gray>Cooldown <dark_gray>» <white>%cooldown%'
  edit-info-maxclaims: '<dark_gray>▪ <gray>Max claims <dark_gray>» <white>%claims%'
  edit-info-price: '<dark_gray>▪ <gray>Price <dark_gray>» <white>%price%'
  edit-info-permission: '<dark_gray>▪ <gray>Permission <dark_gray>» <white>%permission%'
  edit-info-onetime: '<dark_gray>▪ <gray>One time <dark_gray>» <white>%onetime%'
  edit-info-autoarmor: '<dark_gray>▪ <gray>Auto armour <dark_gray>» <white>%autoarmor%'
  edit-info-clearinventory: '<dark_gray>▪ <gray>Clear inventory <dark_gray>» <white>%clearinventory%'
  edit-info-placeholders: '<dark_gray>▪ <gray>Placeholders <dark_gray>» <white>%placeholders%'
  edit-info-items: '<dark_gray>▪ <gray>Items <dark_gray>» <white>%count%'
  edit-info-requirements: '<dark_gray>▪ <gray>Requirements <dark_gray>» <white>%count%'
  edit-info-actions: '<dark_gray>▪ <gray>Actions <dark_gray>» <white>%claim%</white> <gray>on claim<dark_gray>, <white>%fail%</white> <gray>on failure'
  edit-info-footer: '<dark_gray>▪ <gray>Change one with <white>/kitedit %kit% [setting] [value]</white>'

  edit-unknown: '%prefix%<red>There is no kit called <white>%kit%</white>. Create it with <white>/kitedit %kit% create</white>.'
  edit-unknown-setting: '%prefix%<red>There is no kit setting called <white>%setting%</white>.'
  edit-created: '%prefix%<gray>Kit <white>%kit%</white> created from your inventory.'
  edit-exists: '%prefix%<red>There is already a kit called <white>%kit%</white>.'
  edit-bad-name: '%prefix%<red>Invalid name. Use letters, numbers, <white>-</white> or <white>_</white>, up to 32 characters.'
  edit-deleted: '%prefix%<gray>Kit <white>%kit%</white> deleted.'
  edit-items: '%prefix%<gray>The <white>%kit%</white> kit now has <white>%count%</white> items.'
  edit-items-simplified: '%prefix%<yellow>%count% of them had data this format cannot save, such as custom model data. They were saved without it.'
  edit-set: '%prefix%<gray>Kit <white>%kit%</white>: <white>%setting%</white> is now <white>%value%</white>.'
  edit-cleared: '%prefix%<gray>Kit <white>%kit%</white>: <white>%setting%</white> is back to the default.'
  edit-bad-icon: '%prefix%<red>There is no item called <white>%value%</white> on this version.'
  edit-bad-number: '%prefix%<red><white>%value%</white> is not a valid number for <white>%setting%</white>.'

  word-true: 'yes'
  word-false: 'no'
  word-none: 'none'
  word-once: 'once'
  word-free: 'free'
  word-unlimited: 'no limit'
  word-everyone: 'everyone'
  word-claims: 'claims'

  reset-usage: '%prefix%<gray>Usage: <white>/kitreset [kit|*] [player]</white>'
  reset-done: '%prefix%<white>%player%</white><green> can claim <white>%kit%</white> again.'
  reset-all: '%prefix%<white>%player%</white><green> can claim all <white>%count%</white> kits again.'
  reset-received: '%prefix%<green>You can claim <white>%kit%</white> again.'
  reset-all-received: '%prefix%<green>You can claim every kit again.'
  reset-nothing: '%prefix%<white>%player%</white><gray> has not claimed <white>%kit%</white>.'
  reset-not-ready: '%prefix%<gray>The kit history of <white>%player%</white> is still loading.'
