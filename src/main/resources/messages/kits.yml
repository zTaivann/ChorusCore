#
# Part of the messages folder. See core.yml.
# A 'prefix' set here is what %prefix% means in this file.

kits:
  usage: '%prefix%<gray>Usage: <white>/kit [name]</white>. See <white>/kits</white>.'
  none: '%prefix%<gray>There are no kits you can take.'
  unknown: '%prefix%<red>There is no kit called <white>%kit%</white>.'
  received: '%prefix%<gray>You claimed <white>%kit%</white>.'
  cooldown: '%prefix%<red>The <white>%kit%</white> kit is ready again in <white>%time%</white>.'
  one-time: '%prefix%<red>The <white>%kit%</white> kit can only be taken once.'
  requirement: '%prefix%<red>You do not meet what the <white>%kit%</white> kit asks for.'
  edit-help-autoarmor: 'armour goes straight on rather than into the inventory'
  edit-help-clearinventory: 'empties the inventory before handing the kit over'
  edit-help-placeholders: 'fills %player% and %date% into the text on the items'
  edit-info-autoarmor: '<dark_gray>▪ <gray>Auto armour <dark_gray>» <white>%autoarmor%'
  edit-info-clearinventory: '<dark_gray>▪ <gray>Clear first <dark_gray>» <white>%clearinventory%'
  edit-info-placeholders: '<dark_gray>▪ <gray>Placeholders <dark_gray>» <white>%placeholders%'
  edit-info-requirements: '<dark_gray>▪ <gray>Requirements <dark_gray>» <white>%count%'
  edit-info-actions: '<dark_gray>▪ <gray>Actions <dark_gray>» <white>%claim%</white> <gray>on claim<dark_gray>, <white>%fail%</white> <gray>on refusal'
  word-true: 'true'
  word-false: 'false'
  word-none: 'none'
  word-once: 'once only'
  word-free: 'free'
  word-unlimited: 'no limit'
  word-everyone: 'everyone'
  word-claims: 'claims'
  edit-help-header: '<dark_gray>» <c:heading-kits><bold>KIT EDITOR</bold></c> <dark_gray>«'
  edit-help-line: '<dark_gray>▪ <yellow>%usage% <dark_gray>» <gray>%what%'
  edit-help-hover: '<gray>Click to start typing the command'
  edit-help-footer: '<dark_gray>▪ <gray>Leave the value off to put a setting back to its default.<newline><dark_gray>▪ <gray>Use <white>/kitedit [kit]</white> on its own to see what it is set to now.'
  edit-help-create: 'makes the kit out of what you are carrying'
  edit-help-items: 'replaces its items with what you carry now'
  edit-help-icon: 'how it looks in the /kits menu'
  edit-help-display: 'the name shown in the menu, in colour codes or tags'
  edit-help-lore: 'lines under that name. Separate them with |'
  edit-help-cooldown: 'the wait before the same player may take it again'
  edit-help-maxclaims: 'how many times in total. 0 is no limit'
  edit-help-price: 'what taking it costs, through Vault'
  edit-help-permission: 'who may take it. Leave it off for everyone'
  edit-help-onetime: 'can only ever be claimed once, whatever the cooldown is'
  edit-help-delete: 'removes the kit from kits.yml'
  edit-info-header: '<dark_gray>» <c:heading-kits>%kit%</c> <dark_gray>«'
  edit-info-display: '<dark_gray>▪ <gray>Display <dark_gray>» <white>%display%'
  edit-info-icon: '<dark_gray>▪ <gray>Icon <dark_gray>» <white>%icon%'
  edit-info-cooldown: '<dark_gray>▪ <gray>Cooldown <dark_gray>» <white>%cooldown%'
  edit-info-maxclaims: '<dark_gray>▪ <gray>Max claims <dark_gray>» <white>%claims%'
  edit-info-price: '<dark_gray>▪ <gray>Price <dark_gray>» <white>%price%'
  edit-info-permission: '<dark_gray>▪ <gray>Permission <dark_gray>» <white>%permission%'
  edit-info-onetime: '<dark_gray>▪ <gray>One-time <dark_gray>» <white>%onetime%'
  edit-info-items: '<dark_gray>▪ <gray>Items <dark_gray>» <white>%count%'
  edit-info-footer: '<dark_gray>▪ <gray>Change one with <white>/kitedit %kit% [setting] [value]</white>'
  edit-unknown: '%prefix%<red>There is no kit called <white>%kit%</white>. Make it with <white>/kitedit %kit% create</white>.'
  edit-unknown-setting: '%prefix%<red>A kit has no setting called <white>%setting%</white>.'
  spent: '%prefix%<red>You have taken the <white>%kit%</white> kit as many times as you can.'
  edit-created: '%prefix%<gray>Kit <white>%kit%</white> created from your inventory.'
  edit-exists: '%prefix%<red>There is already a kit called <white>%kit%</white>.'
  edit-bad-name: '%prefix%<red>Use letters, numbers, <white>-</white> or <white>_</white>, up to 32 characters.'
  edit-deleted: '%prefix%<gray>Kit <white>%kit%</white> deleted.'
  edit-items: '%prefix%<gray>Kit <white>%kit%</white> now contains <white>%count%</white> items.'
  edit-items-simplified: '%prefix%<yellow>%count% of them carried details this format cannot write down, such as custom model data. They were saved without it.'
  edit-set: '%prefix%<gray>Kit <white>%kit%</white> <dark_gray>» <gray>%setting% is now <white>%value%</white>.'
  edit-cleared: '%prefix%<gray>Kit <white>%kit%</white> <dark_gray>» <gray>%setting% is back to the default.'
  edit-bad-icon: '%prefix%<red>This version has no item called <white>%value%</white>.'
  edit-bad-number: '%prefix%<red><white>%value%</white> is not a number <white>%setting%</white> accepts.'
  list-header: '%prefix%<gray>Kits <dark_gray>(<white>%count%</white>)</dark_gray>'
  list-entry: '<white>%kit%</white>'
  list-separator: '<dark_gray>, </dark_gray>'
  reset-usage: '%prefix%<gray>Use <white>/kitreset [kit|*] [player]</white>.'
  reset-done: '%prefix%<green>%player% can take <white>%kit%</white> again.'
  reset-all: '%prefix%<green>%player% can take all <white>%count%</white> kits again.'
  reset-received: '%prefix%<green>You can take <white>%kit%</white> again.'
  reset-all-received: '%prefix%<green>Every kit is yours to take again.'
  reset-nothing: '%prefix%<gray>%player% has not taken <white>%kit%</white>.'
  reset-not-ready: '%prefix%<gray>The kit history of <white>%player%</white> is still loading.'
