# Solo las líneas que se traducen. El resto viene de messages/spawn.yml.

spawn:
  set: '%prefix%<gray>El spawn se movió a donde estás parado.'
  set-world: '%prefix%<gray>El spawn de <white>%world%</white> se movió a donde estás parado.'
  teleported: '%prefix%<gray>Bienvenido al spawn.'
  not-set: '%prefix%<red>Todavía no se ha puesto ningún spawn.'
  world-missing: '%prefix%<red>El mundo del spawn <white>%world%</white> no está cargado ahora mismo.'
  no-such-world: '%prefix%<red>Este servidor no tiene ningún mundo llamado <white>%world%</white>.'
