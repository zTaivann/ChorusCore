# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   S T A F F                                                            │
# │   /tp  /tphere  /tppos  /tpall  /vanish  /gamemode  /gmc  /gms         │
# │   /gma  /gmsp  /freeze  /sudo  /lockdown  /tempfly  /note  /stafflog   │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Solo las líneas que se traducen. El resto viene de messages/staff.yml.

staff:
  tp-usage: '%prefix%<gray>Uso: <white>/tp [jugador] [destino]</white><dark_gray>, <gray>o coordenadas: <white>/tp [x] [y] [z]</white><newline>%prefix%<dark_gray>▪ <gray>Escribe <white>~</white> para tu ubicación, <white>~10</white> para diez bloques desde ella.'
  tp-self: '%prefix%<red>Un jugador no se puede teletransportar a sí mismo.'
  tp-done: '%prefix%<gray>Teletransportaste a <white>%player%</white> hasta <white>%target%</white>.'
  tp-moved: '%prefix%<gray>Te teletransportaron hasta <white>%target%</white>.'
  tphere-usage: '%prefix%<gray>Uso: <white>/tphere [jugador]</white>'
  tphere-done: '%prefix%<gray>Teletransportaste a <white>%player%</white> hasta ti.'
  tppos-usage: '%prefix%<gray>Uso: <white>/tppos [x] [y] [z] [mundo] [jugador]</white><newline>%prefix%<dark_gray>▪ <gray>Escribe <white>~</white> para tu ubicación, <white>~10</white> para diez bloques desde ella.'
  tppos-world: '%prefix%<red>No existe ningún mundo llamado <white>%world%</white>.'
  tppos-numbers: '%prefix%<red>Las coordenadas tienen que ser números o <white>~</white>.'
  tppos-done: '%prefix%<gray>Teletransportaste a <white>%player%</white> a <white>%x%, %y%, %z%</white> en <white>%world%</white>.'
  tpall-nobody: '%prefix%<red>No hay nadie más conectado.'
  tpall-done: '%prefix%<gray>Teletransportaste a <white>%count%</white> jugadores hasta ti.'
  vanish-enabled: '%prefix%<gray>Ahora estás <green>oculto</green>.'
  vanish-disabled: '%prefix%<gray>Vuelves a estar <red>visible</red>.'

  gamemode-usage: '%prefix%<gray>Uso: <white>/gamemode [modo] [jugador]</white>'
  gamemode-unknown: '%prefix%<red>No existe ningún modo de juego llamado <white>%mode%</white>.'
  gamemode-already: '%prefix%<red>El modo de juego ya es <white>%mode%</white>.'
  gamemode-set: '%prefix%<gray>Tu modo de juego ahora es <white>%mode%</white>.'
  gamemode-set-other: '%prefix%<gray>El modo de juego de <white>%player%</white> ahora es <white>%mode%</white>.'
  gamemode-received: '%prefix%<white>%player%</white><gray> cambió tu modo de juego a <white>%mode%</white>.'

  freeze-usage: '%prefix%<gray>Uso: <white>/freeze [jugador]</white>'
  freeze-on: '%prefix%<gray>Congelaste a <white>%player%</white>.'
  freeze-off: '%prefix%<gray>Descongelaste a <white>%player%</white>.'
  freeze-received: '%prefix%<red>Te congelaron.</red><newline>%prefix%<gray>Responde al miembro del staff que te congeló con <white>/reply</white>.'
  freeze-released: '%prefix%<green>Ya no estás congelado.'
  freeze-reminder: '<red><bold>CONGELADO</bold></red><gray> - no te desconectes'
  freeze-held: '%prefix%<red>No puedes moverte mientras estás congelado.'
  freeze-no-commands: '%prefix%<red>Solo funcionan <white>/msg</white> y <white>/reply</white> mientras estás congelado.'
  freeze-exempt: '%prefix%<red><white>%player%</white> no se puede congelar.'

  sudo-usage: '%prefix%<gray>Uso: <white>/sudo [jugador] [comando]</white>'
  sudo-ran: '%prefix%<gray>Ejecutaste <white>/%command%</white> como <white>%player%</white>.'
  sudo-exempt: '%prefix%<red>No se puede usar <white>/sudo</white> con <white>%player%</white>.'

  lockdown-usage: '%prefix%<gray>Uso: <white>/lockdown [on|off] [motivo]</white>'
  lockdown-status-on: '%prefix%<gray>El servidor está <red>cerrado</red> para todos menos el staff.'
  lockdown-status-off: '%prefix%<gray>El servidor está <green>abierto</green>.'
  lockdown-closed: '%prefix%<red>El servidor ahora está cerrado para todos menos el staff.'
  lockdown-opened: '%prefix%<green>El servidor vuelve a estar abierto.'
  lockdown-kick: '<red><bold>Cerrado por mantenimiento</bold></red><newline><gray>Vuelve a intentarlo en un rato.'
  lockdown-kick-reason: '<red><bold>Cerrado por mantenimiento</bold></red><newline><gray>%reason%'

  tempfly-usage: '%prefix%<gray>Uso: <white>/tempfly [jugador] [minutos]</white>. <white>0</white> lo quita.'
  tempfly-range: '%prefix%<red>Usa un número de minutos del 0 al <white>%max%</white>.'
  tempfly-given: '%prefix%<gray>Le diste vuelo a <white>%player%</white> durante <white>%time%</white>.'
  tempfly-received: '%prefix%<green>Puedes volar durante <white>%time%</white>.'
  tempfly-ending: '%prefix%<yellow>Tu vuelo termina en <white>%seconds%</white> segundos.'
  tempfly-expired: '%prefix%<gray>Tu vuelo terminó.'
  tempfly-taken: '%prefix%<gray>Le quitaste el vuelo a <white>%player%</white>.'
  tempfly-none: '%prefix%<red><white>%player%</white> no tiene vuelo temporal.'

  note-usage: '%prefix%<gray>Uso: <white>/note add [jugador] [texto]</white>, <white>/note list [jugador]</white> o <white>/note clear [jugador]</white>'
  note-added: '%prefix%<gray>Nota guardada sobre <white>%player%</white>.'
  note-header: '<dark_gray>» <c:heading-staff><bold>NOTAS</bold></c> <dark_gray>« <white>%player%</white> <dark_gray>▪ <gray>%count%'
  note-none: '%prefix%<gray>No hay notas sobre <white>%player%</white>.'
  note-cleared: '%prefix%<gray>Borraste <white>%count%</white> notas sobre <white>%player%</white>.'

  log-header: '<dark_gray>» <c:heading-staff><bold>REGISTRO DEL STAFF</bold></c> <dark_gray>« <gray>%count%'
  log-entry: '<dark_gray>▪ <white>%actor% <gray>%action% <white>%subject% <dark_gray>(<gray>hace %ago%<dark_gray>)'
  log-entry-detailed: '<dark_gray>▪ <white>%actor% <gray>%action% <white>%subject% <dark_gray>» <gray>%detail% <dark_gray>(<gray>hace %ago%<dark_gray>)'
  log-entry-plain: '<dark_gray>▪ <white>%actor% <gray>%action% <dark_gray>(<gray>hace %ago%<dark_gray>)'
  log-empty: '%prefix%<gray>El registro del staff está vacío.'
  log-disabled: '%prefix%<red>El registro del staff está desactivado en este servidor.'
  log-actions:
    used: 'usó'
    eco-give: 'añadió saldo a'
    eco-take: 'quitó saldo a'
    eco-set: 'estableció el saldo de'
    eco-reset: 'reinició el saldo de'
    freeze: 'congeló a'
    unfreeze: 'descongeló a'
    lockdown-on: 'cerró el servidor'
    lockdown-off: 'abrió el servidor'
    note: 'añadió una nota sobre'
    note-clear: 'borró las notas sobre'
    sudo: 'ejecutó un comando como'
    tempfly-on: 'dio vuelo temporal a'
    tempfly-off: 'quitó el vuelo temporal a'
