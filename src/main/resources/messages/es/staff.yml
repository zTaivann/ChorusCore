# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   S T A F F                                                            │
# │   /tp  /vanish  /gamemode  /freeze  /sudo  /lockdown and the rest      │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Solo las líneas que se traducen. El resto viene de messages/staff.yml.

staff:
  tp-usage: '%prefix%<gray>Uso: <white>/tp [jugador] [destino]</white><dark_gray>, <gray>o coordenadas: <white>/tp [x] [y] [z]</white><newline>%prefix%<dark_gray>▪ <gray>Escribe <white>~</white> para donde estás, <white>~10</white> para diez bloques desde ahí.'
  tp-self: '%prefix%<red>Eso no movería a nadie.'
  tp-done: '%prefix%<gray>Mandaste a <white>%player%</white> con <white>%target%</white>.'
  tp-moved: '%prefix%<gray>Te movieron con <white>%target%</white>.'
  tphere-usage: '%prefix%<gray>Uso: <white>/tphere [jugador]</white>'
  tphere-done: '%prefix%<gray>Trajiste a <white>%player%</white> contigo.'
  tppos-usage: '%prefix%<gray>Uso: <white>/tppos [x] [y] [z] [mundo] [jugador]</white><newline>%prefix%<dark_gray>▪ <gray>Escribe <white>~</white> para donde estás, <white>~10</white> para diez bloques desde ahí.'
  tppos-world: '%prefix%<red>No existe ningún mundo llamado <white>%world%</white>.'
  tppos-numbers: '%prefix%<red>Las coordenadas tienen que ser números, o <white>~</white>.'
  tppos-done: '%prefix%<gray>Mandaste a <white>%player%</white> a <white>%x%, %y%, %z%</white> en <white>%world%</white>.'
  tpall-nobody: '%prefix%<red>No hay nadie más conectado.'
  tpall-done: '%prefix%<gray>Trajiste a <white>%count%</white> jugadores contigo.'
  vanish-enabled: '%prefix%<gray>Ahora estás <green>oculto</green>.'
  vanish-disabled: '%prefix%<gray>Vuelves a estar <red>visible</red>.'
  gamemode-usage: '%prefix%<gray>Uso: <white>/gamemode [modo] [jugador]</white>'
  gamemode-unknown: '%prefix%<red>No existe ningún modo de juego llamado <white>%mode%</white>.'
  gamemode-already: '%prefix%<red>Ya estás en <white>%mode%</white>.'
  gamemode-set: '%prefix%<gray>Modo de juego cambiado a <white>%mode%</white>.'
  gamemode-set-other: '%prefix%<gray>Dejaste a <white>%player%</white> en <white>%mode%</white>.'
  gamemode-received: '%prefix%<gray><white>%player%</white> te dejó el modo de juego en <white>%mode%</white>.'
  freeze-usage: '%prefix%<gray>Uso: <white>/freeze [jugador]</white>'
  freeze-on: '%prefix%<gray>Congelaste a <white>%player%</white>.'
  freeze-off: '%prefix%<gray>Soltaste a <white>%player%</white>.'
  freeze-received: '%prefix%<red>Te congelaron.</red><newline>%prefix%<gray>Respóndele con <white>/reply</white> al staff que te congeló.'
  freeze-released: '%prefix%<green>Ya te puedes mover.'
  freeze-reminder: '<red><bold>CONGELADO</bold></red><gray> - no te desconectes'
  freeze-held: '%prefix%<red>No puedes ir a ningún lado mientras estás congelado.'
  freeze-no-commands: '%prefix%<red>Solo funcionan <white>/msg</white> y <white>/reply</white> mientras estás congelado.'
  freeze-exempt: '%prefix%<red>A %player% no se le puede congelar.'
  sudo-usage: '%prefix%<gray>Uso: <white>/sudo [jugador] [comando]</white>'
  sudo-ran: '%prefix%<gray>Ejecutaste <white>/%command%</white> como <white>%player%</white>.'
  sudo-exempt: '%prefix%<red>A %player% no se le puede hacer sudo.'
  lockdown-usage: '%prefix%<gray>Uso: <white>/lockdown [on|off] [razón]</white>'
  lockdown-status-on: '%prefix%<gray>El servidor está <red>cerrado</red> para todos menos el staff.'
  lockdown-status-off: '%prefix%<gray>El servidor está <green>abierto</green>.'
  lockdown-closed: '%prefix%<red>El servidor quedó cerrado para todos menos el staff.'
  lockdown-opened: '%prefix%<green>El servidor está abierto otra vez.'
  lockdown-kick: '<red><bold>Cerrado por mantenimiento</bold></red><newline><gray>Vuelve a intentarlo en un rato.'
  lockdown-kick-reason: '<red><bold>Cerrado por mantenimiento</bold></red><newline><gray>%reason%'
  tempfly-usage: '%prefix%<gray>Uso: <white>/tempfly [jugador] [minutos]</white>. <white>0</white> se lo quita.'
  tempfly-range: '%prefix%<red>Elige una cantidad de minutos entre 0 y %max%.'
  tempfly-given: '%prefix%<gray>Le diste vuelo a <white>%player%</white> por <white>%time%</white>.'
  tempfly-received: '%prefix%<green>Puedes volar por <white>%time%</white>.'
  tempfly-ending: '%prefix%<yellow>Tu vuelo se acaba en <white>%seconds%</white> segundos.'
  tempfly-expired: '%prefix%<gray>Se acabó tu vuelo.'
  tempfly-taken: '%prefix%<gray>Le quitaste el vuelo a <white>%player%</white>.'
  tempfly-none: '%prefix%<red>%player% no tiene ningún vuelo temporal corriendo.'
  note-usage: '%prefix%<gray>Uso: <white>/note add [jugador] [texto]</white>, <white>list [jugador]</white> o <white>clear [jugador]</white>'
  note-added: '%prefix%<gray>Nota guardada sobre <white>%player%</white>.'
  note-header: '<dark_gray>» <c:heading-staff><bold>NOTAS</bold></c> <dark_gray>« <white>%player%</white> <dark_gray>▪ <gray>%count%'
  note-none: '%prefix%<gray>No hay notas sobre <white>%player%</white>.'
  note-cleared: '%prefix%<gray>Se borraron <white>%count%</white> notas sobre <white>%player%</white>.'
  log-header: '<dark_gray>» <c:heading-staff><bold>REGISTRO DE STAFF</bold></c> <dark_gray>« <gray>%count%'
  log-entry: '<dark_gray>▪ <white>%actor% <gray>%action% <white>%subject% <dark_gray>(<gray>hace %ago%<dark_gray>)'
  log-entry-detailed: '<dark_gray>▪ <white>%actor% <gray>%action% <white>%subject% <dark_gray>» <gray>%detail% <dark_gray>(<gray>hace %ago%<dark_gray>)'
  log-entry-plain: '<dark_gray>▪ <white>%actor% <gray>%action% <dark_gray>(<gray>hace %ago%<dark_gray>)'
  log-empty: '%prefix%<gray>No hay nada en el registro de staff.'
  log-disabled: '%prefix%<red>El registro de staff está apagado en este servidor.'
