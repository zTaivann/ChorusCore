# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   P L A Y E R S                                                        │
# │   /afk  /seen  /playtime  /whois  /list  /nick  /ptime  /pweather      │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Solo las líneas que se traducen. El resto viene de messages/players.yml.

players:
  afk-now: '%prefix%<gray>Ahora estás AFK.'
  afk-now-broadcast: '%prefix%<white>%player%</white><gray> está AFK.'
  afk-back: '%prefix%<gray>Bienvenido de vuelta.'
  afk-back-broadcast: '%prefix%<white>%player%</white><gray> volvió.'
  afk-kicked: '<red>Desconectado por estar AFK demasiado tiempo.'
  seen-usage: '%prefix%<gray>Uso: <white>/seen [jugador]</white>'
  seen-online: '%prefix%<white>%player%</white><gray> está conectado ahora mismo, en <white>%world%</white>.'
  seen-online-afk: '%prefix%<white>%player%</white><gray> está conectado pero AFK, en <white>%world%</white>.'
  seen-offline: '%prefix%<white>%player%</white><gray> se vio por última vez hace <white>%ago%</white>. Entró por primera vez el %first%.'
  playtime: '%prefix%<gray>Llevas jugado <white>%time%</white>.'
  playtime-other: '%prefix%<white>%player%</white><gray> lleva jugado <white>%time%</white>.'
  whois-usage: '%prefix%<gray>Uso: <white>/whois [jugador]</white>'
  whois-status-online: '<dark_gray>▪ <gray>Estado <dark_gray>» <green>conectado'
  whois-status-away: '<dark_gray>▪ <gray>Estado <dark_gray>» <yellow>AFK'
  whois-status-offline: '<dark_gray>▪ <gray>Estado <dark_gray>» <red>desconectado<gray>, visto hace <white>%ago%</white>'
  whois-world: '<dark_gray>▪ <gray>Ubicación <dark_gray>» <white>%world%</white> <dark_gray>(<white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%<dark_gray>)'
  whois-health: '<dark_gray>▪ <gray>Vida <dark_gray>» <white>%health%</white> <dark_gray>| <gray>Hambre <dark_gray>» <white>%food%'
  whois-gamemode: '<dark_gray>▪ <gray>Modo de juego <dark_gray>» <white>%gamemode%'
  whois-playtime: '<dark_gray>▪ <gray>Tiempo jugado <dark_gray>» <white>%time%'
  whois-first: '<dark_gray>▪ <gray>Primera entrada <dark_gray>» <white>%date%'
  whois-flags: '<dark_gray>▪ <gray>Ajustes <dark_gray>» <white>%flags%'
  whois-address: '<dark_gray>▪ <gray>Dirección <dark_gray>» <white>%address%'
  whois-banned: '<dark_gray>▪ <gray>Baneado <dark_gray>» <red>sí'
  whois-country: '<dark_gray>▪ <gray>País <dark_gray>» <white>%country%'
  list-header: '<dark_gray>» <gray>Conectados <dark_gray>» <white>%online%<dark_gray>/<white>%max%</white> <dark_gray>(<yellow>%away%</yellow><gray> AFK<dark_gray>)'
  list-empty: '<gray>No hay nadie más aquí ahora mismo.'
  ptime-usage: '%prefix%<gray>Uso: <white>/ptime [hora] [jugador]</white><newline>%prefix%<gray>Horas: <white>day noon sunset night midnight sunrise reset</white>, o un número del <white>0</white> al <white>23999</white>.'
  ptime-set: '%prefix%<gray>Tu cielo ahora muestra <white>%value%</white>.'
  ptime-set-other: '%prefix%<gray>El cielo de <white>%player%</white> quedó en <white>%value%</white>.'
  ptime-reset: '%prefix%<gray>Tu cielo vuelve a seguir al mundo.'
  ptime-reset-other: '%prefix%<gray>El cielo de <white>%player%</white> vuelve a seguir al mundo.'
  ptime-unknown: '%prefix%<red>No existe la hora <white>%value%</white>. Prueba un nombre o un número del 0 al 23999.'
  pweather-usage: '%prefix%<gray>Uso: <white>/pweather [clear|rain|reset] [jugador]</white>'
  pweather-set: '%prefix%<gray>Tu clima ahora es <white>%value%</white>.'
  pweather-set-other: '%prefix%<gray>El clima de <white>%player%</white> quedó en <white>%value%</white>.'
  pweather-reset: '%prefix%<gray>Tu clima vuelve a seguir al mundo.'
  pweather-reset-other: '%prefix%<gray>El clima de <white>%player%</white> vuelve a seguir al mundo.'
  pweather-unknown: '%prefix%<red>No existe el clima <white>%value%</white>. Prueba clear, rain o reset.'
  afk-now-reason: '%prefix%<gray>Estás AFK <dark_gray>» <white>%reason%'
  afk-now-reason-broadcast: '%prefix%<gray>%player% está AFK <dark_gray>» <white>%reason%'
  seen-where: '<dark_gray>▪ <gray>Se fue en <white>%world%</white> en <white>%x% %y% %z%'
  seen-address: '<dark_gray>▪ <gray>Dirección <dark_gray>» <white>%address%'
  seen-alts: '<dark_gray>▪ <gray>La comparte con <white>%count%</white> <dark_gray>» <white>%players%'
  nick-usage: '%prefix%<gray>Usa <white>/nick [nombre]</white> o <white>/nick off</white>.'
  nick-set: '%prefix%<green>Ahora eres <white>%nickname%</white>.'
  nick-set-other: '%prefix%<green>%player% ahora es <white>%nickname%</white>.'
  nick-cleared: '%prefix%<gray>Volviste a tu propio nombre.'
  nick-cleared-other: '%prefix%<gray>%player% volvió a su propio nombre.'
  nick-taken: '%prefix%<red>Alguien ya se llama <white>%nickname%</white>.'
  nick-too-long: '%prefix%<red>Un apodo puede tener como mucho <white>%limit%</white> letras.'
  nick-invalid: '%prefix%<red>Los apodos aceptan letras, números y guiones bajos.'
  nick-no-colour: '%prefix%<red>No tienes permiso para usar colores en un apodo.'
  realname-usage: '%prefix%<gray>Usa <white>/realname [apodo]</white>.'
  realname: '%prefix%<gray>%nickname% es <white>%player%</white>.'
  realname-unknown: '%prefix%<gray>No hay nadie conectado que se llame <white>%nickname%</white>.'
