# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   P L A Y E R S                                                        │
# │   /afk  /seen  /playtime  /whois  /list  /nick  /ptime  /pweather      │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Solo las líneas que se traducen. El resto viene de messages/players.yml.

players:
  afk-now: '%prefix%<gray>Ahora estás AFK.'
  afk-now-broadcast: '%prefix%<white>%player%</white><gray> ahora está AFK.'
  afk-now-reason: '%prefix%<gray>Ahora estás AFK <dark_gray>» <white>%reason%'
  afk-now-reason-broadcast: '%prefix%<white>%player%</white><gray> ahora está AFK <dark_gray>» <white>%reason%'
  afk-back: '%prefix%<gray>Ya no estás AFK.'
  afk-back-broadcast: '%prefix%<white>%player%</white><gray> ya no está AFK.'
  afk-kicked: '<red>Se te desconectó por estar AFK demasiado tiempo.'

  seen-usage: '%prefix%<gray>Uso: <white>/seen [jugador]</white>'
  seen-online: '%prefix%<white>%player%</white><gray> está conectado, en <white>%world%</white>.'
  seen-online-afk: '%prefix%<white>%player%</white><gray> está conectado pero AFK, en <white>%world%</white>.'
  seen-offline: '%prefix%<white>%player%</white><gray> se conectó por última vez hace <white>%ago%</white>. Primera entrada: <white>%first%</white>.'
  seen-where: '<dark_gray>▪ <gray>Última ubicación <dark_gray>» <white>%world%</white> <dark_gray>(<white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%<dark_gray>)'
  seen-address: '<dark_gray>▪ <gray>Dirección <dark_gray>» <white>%address%'
  seen-alts: '<dark_gray>▪ <gray>Misma dirección <dark_gray>» <white>%count%</white> <gray>jugadores <dark_gray>» <white>%players%'

  playtime: '%prefix%<gray>Has jugado <white>%time%</white>.'
  playtime-other: '%prefix%<white>%player%</white><gray> ha jugado <white>%time%</white>.'

  whois-usage: '%prefix%<gray>Uso: <white>/whois [jugador]</white>'
  whois-status-online: '<dark_gray>▪ <gray>Estado <dark_gray>» <green>conectado'
  whois-status-away: '<dark_gray>▪ <gray>Estado <dark_gray>» <yellow>AFK'
  whois-status-offline: '<dark_gray>▪ <gray>Estado <dark_gray>» <red>desconectado<gray>, visto por última vez hace <white>%ago%</white>'
  whois-world: '<dark_gray>▪ <gray>Ubicación <dark_gray>» <white>%world%</white> <dark_gray>(<white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%<dark_gray>)'
  whois-health: '<dark_gray>▪ <gray>Vida <dark_gray>» <white>%health%</white> <dark_gray>| <gray>Hambre <dark_gray>» <white>%food%'
  whois-gamemode: '<dark_gray>▪ <gray>Modo de juego <dark_gray>» <white>%gamemode%'
  whois-playtime: '<dark_gray>▪ <gray>Tiempo jugado <dark_gray>» <white>%time%'
  whois-first: '<dark_gray>▪ <gray>Primera entrada <dark_gray>» <white>%date%'
  whois-modes: '<dark_gray>▪ <gray>Modos <dark_gray>» <white>%modes%'
  whois-mode-flying: 'volando'
  whois-mode-invulnerable: 'invulnerable'
  whois-mode-sleeping: 'durmiendo'
  whois-mode-operator: 'operador'
  whois-address: '<dark_gray>▪ <gray>Dirección <dark_gray>» <white>%address%'
  whois-country: '<dark_gray>▪ <gray>País <dark_gray>» <white>%country%'
  whois-banned: '<dark_gray>▪ <gray>Baneado <dark_gray>» <red>sí'

  list-header: '<dark_gray>» <gray>Conectados <dark_gray>» <white>%online%<dark_gray>/<white>%max%</white> <dark_gray>(<yellow>%away%</yellow><gray> AFK<dark_gray>)'
  list-empty: '<gray>No hay nadie más conectado.'

  ptime-usage: '%prefix%<gray>Uso: <white>/ptime [hora] [jugador]</white><newline>%prefix%<gray>Horas: <white>day noon sunset night midnight sunrise reset</white>, o un número del <white>0</white> al <white>23999</white>.'
  ptime-set: '%prefix%<gray>Tu hora ahora es <white>%value%</white>.'
  ptime-set-other: '%prefix%<gray>La hora de <white>%player%</white> ahora es <white>%value%</white>.'
  ptime-reset: '%prefix%<gray>Tu hora vuelve a seguir la del mundo.'
  ptime-reset-other: '%prefix%<gray>La hora de <white>%player%</white> vuelve a seguir la del mundo.'
  ptime-unknown: '%prefix%<red>No existe ninguna hora llamada <white>%value%</white>. Usa un nombre o un número del 0 al 23999.'

  pweather-usage: '%prefix%<gray>Uso: <white>/pweather [clear|rain|reset] [jugador]</white>'
  pweather-set: '%prefix%<gray>Tu clima ahora es <white>%value%</white>.'
  pweather-set-other: '%prefix%<gray>El clima de <white>%player%</white> ahora es <white>%value%</white>.'
  pweather-reset: '%prefix%<gray>Tu clima vuelve a seguir el del mundo.'
  pweather-reset-other: '%prefix%<gray>El clima de <white>%player%</white> vuelve a seguir el del mundo.'
  pweather-unknown: '%prefix%<red>No existe ningún clima llamado <white>%value%</white>. Usa clear, rain o reset.'

  nick-usage: '%prefix%<gray>Uso: <white>/nick [apodo|off]</white>'
  nick-set: '%prefix%<green>Tu apodo ahora es <white>%nickname%</white>.'
  nick-set-other: '%prefix%<green>El apodo de <white>%player%</white> ahora es <white>%nickname%</white>.'
  nick-cleared: '%prefix%<gray>Ya no tienes apodo.'
  nick-cleared-other: '%prefix%<white>%player%</white><gray> ya no tiene apodo.'
  nick-taken: '%prefix%<red>Alguien ya usa el apodo <white>%nickname%</white>.'
  nick-too-long: '%prefix%<red>Un apodo puede tener como máximo <white>%limit%</white> caracteres.'
  nick-invalid: '%prefix%<red>Apodo no válido. Usa letras, números o <white>_</white>.'
  nick-no-colour: '%prefix%<red>No tienes permiso para usar colores en un apodo.'
  realname-usage: '%prefix%<gray>Uso: <white>/realname [apodo]</white>'
  realname: '%prefix%<white>%nickname%</white><gray> es <white>%player%</white>.'
  realname-unknown: '%prefix%<red>Nadie conectado usa el apodo <white>%nickname%</white>.'
