# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   E C O N O M Y                                                        │
# │   /pay  /balance  /baltop  /eco  /paylog                               │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Solo las líneas que se traducen. El resto viene de messages/economy.yml.

economy:
  insufficient: '%prefix%<red>El precio es <white>%price%</white> y tu saldo es <white>%balance%</white>.'
  charged: '%prefix%<gray>Se te cobró <white>%price%</white>.'
  refunded: '%prefix%<gray>Se te devolvió <white>%price%</white>.'
  insufficient-items: '%prefix%<red>El precio es <white>%amount% %item%</white> y tienes <white>%held%</white>.'
  charged-items: '%prefix%<gray>Pagaste <white>%amount% %item%</white>.'
  refunded-items: '%prefix%<gray>Recuperaste <white>%amount% %item%</white>.'
  unavailable: '%prefix%<red>Este servidor no tiene economía configurada.'
  balance: '%prefix%<gray>Tu saldo es <white>%balance%</white>.'
  balance-other: '%prefix%<gray>El saldo de <white>%player%</white> es <white>%balance%</white>.'
  pay-usage: '%prefix%<gray>Uso: <white>/pay [jugador] [cantidad]</white>'
  pay-self: '%prefix%<red>No puedes pagarte a ti mismo.'
  invalid-amount: '%prefix%<red>Esa no es una cantidad válida.'
  pay-minimum: '%prefix%<red>El pago mínimo es de <white>%amount%</white>.'
  pay-maximum: '%prefix%<red>El pago máximo es de <white>%amount%</white>.'
  transfer-failed: '%prefix%<red>El pago falló. No se te quitó nada.'
  pay-sent: '%prefix%<gray>Pagaste <white>%amount%</white> a <white>%player%</white>.'
  pay-sent-taxed: '%prefix%<gray>Pagaste <white>%amount%</white> a <white>%player%</white>. El impuesto fue de <white>%tax%</white>, así que recibió <white>%received%</white>.'
  pay-received: '%prefix%<gray><white>%player%</white> te pagó <white>%amount%</white>.'
  eco-usage: '%prefix%<gray>Uso: <white>/eco [give|take|set|reset] [jugador] [cantidad]</white>'
  eco-failed: '%prefix%<red>El plugin de economía rechazó ese cambio en el saldo de %player%.'
  eco-give-done: '%prefix%<gray>Diste <white>%amount%</white> a <white>%player%</white>. Su saldo ahora es <white>%balance%</white>.'
  eco-give-received: '%prefix%<green>Recibiste <white>%amount%</white></green><gray>. Tu saldo ahora es <white>%balance%</white>.'
  eco-take-done: '%prefix%<gray>Quitaste <white>%amount%</white> a <white>%player%</white>. Su saldo ahora es <white>%balance%</white>.'
  eco-take-received: '%prefix%<red>Se te quitaron <white>%amount%</white></red><gray>. Tu saldo ahora es <white>%balance%</white>.'
  eco-set-done: '%prefix%<gray>El saldo de <white>%player%</white> ahora es <white>%balance%</white>.'
  eco-set-received: '%prefix%<gray>Tu saldo ahora es <white>%balance%</white>.'
  baltop-header: '<dark_gray>» <c:heading-economy><bold>MEJORES SALDOS</bold></c> <dark_gray>« <gray>%count% <dark_gray>▪ <gray>%page%<dark_gray>/<gray>%pages%'
  baltop-empty: '%prefix%<gray>Todavía no hay jugadores en el ranking.'
  baltop-refreshed: '%prefix%<gray>Se borró el ranking. El próximo <white>/baltop</white> lo vuelve a calcular.'
  baltop-refresh-external: '%prefix%<gray>Otro plugin guarda los saldos, así que no hay ranking que actualizar.'
  paylog-header: '<dark_gray>» <c:heading-economy><bold>PAGOS</bold></c> <dark_gray>« <gray>%count%'
  paylog-entry: '<dark_gray>▪ <white>%payer% <dark_gray>-> <white>%payee% <dark_gray>» <gold>%amount% <dark_gray>(<gray>hace %ago%<dark_gray>)'
  paylog-empty: '%prefix%<gray>El registro de pagos está vacío.'
  paylog-disabled: '%prefix%<red>El registro de pagos está desactivado en este servidor.'

  toggle-on: '%prefix%<green>Vuelves a aceptar pagos.'
  toggle-off: '%prefix%<gray>Ya no aceptas pagos. <white>/paytoggle</white> los vuelve a activar.'
  pay-refused: '%prefix%<red>%player% no acepta pagos.'
  pay-confirm: '%prefix%<gray>Vas a pagar <white>%amount%</white> a <white>%player%</white>.'
  baltop-total: '<dark_gray>▪ <gray>Total del servidor <dark_gray>» <white>%amount%'

  eco-reset-done: '%prefix%<gray>El saldo de <white>%player%</white> se restableció a <white>%balance%</white>.'
  eco-reset-received: '%prefix%<gray>Tu saldo se restableció a <white>%balance%</white>.'
