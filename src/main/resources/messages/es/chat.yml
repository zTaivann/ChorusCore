# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   C H A T                                                              │
# │   /msg  /reply  /socialspy  /msgtoggle  /ignore  /mail                 │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Solo las líneas que se traducen. El resto viene de messages/chat.yml.

chat:
  msg-usage: '%prefix%<gray>Uso: <white>/msg [jugador] [mensaje]</white>'
  msg-self: '%prefix%<red>No puedes enviarte un mensaje a ti mismo.'
  msg-refused: '%prefix%<red>%player% no acepta mensajes privados.'
  toggle-off: '%prefix%<gray>Los mensajes privados ahora están <white>desactivados</white>. Nadie puede escribirte.'
  toggle-on: '%prefix%<gray>Los mensajes privados vuelven a estar <white>activados</white>.'
  ignore-usage: '%prefix%<gray>Uso: <white>/ignore [jugador]</white> o <white>/ignore list</white>'
  ignore-self: '%prefix%<red>No puedes ignorarte a ti mismo.'
  ignore-added: '%prefix%<gray>Ahora ignoras a <white>%player%</white>.'
  ignore-removed: '%prefix%<gray>Ya no ignoras a <white>%player%</white>.'
  ignore-empty: '%prefix%<gray>No ignoras a nadie.'
  ignore-header: '%prefix%<gray>Ignorados <dark_gray>(<white>%count%</white>)</dark_gray>'
  msg-sent: '<dark_gray>[<gray>tú <dark_gray>-> <white>%player%</white><dark_gray>] <gray>%message%'
  msg-received: '<dark_gray>[<white>%player%</white> <dark_gray>-> <gray>tú<dark_gray>] <gray>%message%'
  reply-usage: '%prefix%<gray>Uso: <white>/reply [mensaje]</white>'
  no-reply-target: '%prefix%<red>No hay nadie a quien responder.'
  spy-enabled: '%prefix%<gray>Social spy <green>activado</green>.'
  spy-disabled: '%prefix%<gray>Social spy <red>desactivado</red>.'
  spy-unavailable: '%prefix%<red>El social spy está desactivado en este servidor.'

  mail-usage: '%prefix%<gray>Uso: <white>/mail</white>, <white>/mail send [jugador] [mensaje]</white>, <white>/mail sendall [mensaje]</white> o <white>/mail clear</white>'
  mail-header: '<dark_gray>» <c:heading-info><bold>CORREO</bold></c> <dark_gray>« <gray>%count% <dark_gray>▪ <gray>%page%<dark_gray>/<gray>%pages%'
  mail-entry: '<dark_gray>%id%. <gray>%player% <dark_gray>» <gray>%message% <dark_gray>(<gray>hace %ago%<dark_gray>)'
  mail-entry-new: '<dark_gray>%id%. <white>%player% <dark_gray>» <white>%message% <dark_gray>(<gray>hace %ago%<dark_gray>)'
  mail-empty: '%prefix%<gray>No tienes cartas.'
  mail-waiting: '%prefix%<gray>Tienes <white>%count%</white> cartas sin leer. Léelas con <white>/mail</white>.'
  mail-arrived: '%prefix%<gray>%player% te envió una carta. Léela con <white>/mail</white>.'
  mail-sent: '%prefix%<green>Carta enviada a <white>%player%</white>.'
  mail-sent-all: '%prefix%<green>Carta enviada a <white>%count%</white> jugadores.'
  mail-full: '%prefix%<red>El buzón de %player% está lleno.'
  mail-cleared: '%prefix%<gray>Se borraron <white>%count%</white> cartas.'
  mail-cleared-one: '%prefix%<gray>Se borró la carta <white>%id%</white>.'
  mail-missing: '%prefix%<gray>No existe la carta <white>%id%</white>.'

  mail-of: '%prefix%<gray>El buzón de <white>%player%</white>. Leerlo no lo marca como leído.'
  rtoggle-sender: '%prefix%<gray>/reply ahora responde al último jugador que te escribió.'
  rtoggle-recipient: '%prefix%<gray>/reply ahora responde al último jugador al que escribiste.'
