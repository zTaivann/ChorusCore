# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   H O M E S                                                            │
# │   /home  /sethome  /delhome  /homes  /renamehome  /homeicon            │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Solo las líneas que se traducen. El resto viene de messages/homes.yml.

home:
  none: '%prefix%<gray>Todavía no tienes homes. Crea uno con <white>/sethome</white>.'
  created: '%prefix%<gray>Home <white>%home%</white> creado.'
  updated: '%prefix%<gray>Home <white>%home%</white> movido a tu ubicación.'
  deleted: '%prefix%<gray>Home <white>%home%</white> borrado.'
  teleported: '%prefix%<gray>Has llegado a <white>%home%</white>.'
  unknown: '%prefix%<red>No tienes ningún home llamado <white>%home%</white>.'
  invalid-name: '%prefix%<red>Nombre no válido. Usa letras, números, <white>-</white> o <white>_</white>, hasta %max% caracteres.'
  limit-reached: '%prefix%<red>Ya tienes %limit% homes. Borra uno con <white>/delhome</white>.'
  world-missing: '%prefix%<red>El mundo <white>%world%</white> no está cargado.'
  delete-usage: '%prefix%<gray>Uso: <white>/delhome [home]</white>'
  rename-usage: '%prefix%<gray>Uso: <white>/renamehome [home] [nombre nuevo]</white>'
  renamed: '%prefix%<gray>El home <white>%home%</white> ahora se llama <white>%name%</white>.'
  rename-same: '%prefix%<red>Ese ya es su nombre.'
  rename-taken: '%prefix%<red>Ya tienes un home llamado <white>%home%</white>.'
  world-limit-reached: '%prefix%<red>Ya tienes %limit% homes en %world%.'
  icon-usage: '%prefix%<gray>Uso: <white>/homeicon [home] [ítem]</white>. Sin ítem, se usa el ícono por defecto.'
  icon-set: '%prefix%<gray>El ícono del home <white>%home%</white> ahora es <white>%icon%</white>.'
  icon-cleared: '%prefix%<gray>El home <white>%home%</white> vuelve a usar el ícono por defecto.'
  icon-unknown: '%prefix%<red>No existe ningún ítem llamado <white>%icon%</white> en esta versión.'
  list:
    header: '%prefix%<gray>Tus homes <dark_gray>(<white>%count%</white>/%limit%)</dark_gray>'
    hover: '<gray>Ir a <white>%home%</white><newline><dark_gray>%world% %x%, %y%, %z%</dark_gray>'

  none-other: '%prefix%<gray>%player% no tiene homes.'
  teleported-other: '%prefix%<gray>Has llegado a <white>%home%</white>, un home de <white>%player%</white>.'
  overwrite-confirm: '%prefix%<gray>Ya tienes un home llamado <white>%home%</white>. Esto lo mueve a tu ubicación.'
  delete-confirm: '%prefix%<red>Esto borra para siempre el home <white>%home%</white>.'
