# Solo las líneas que se traducen. El resto viene de messages/world.yml.

world:
  not-found: '%prefix%<red>No existe ningún mundo llamado <white>%world%</white>.'
  already-there: '%prefix%<gray>Ya estás en <white>%world%</white>.'
  went: '%prefix%<gray>Has llegado a <white>%world%</white>.'
  every-world: 'todos los mundos'
  list-header: '<dark_gray>» <c:heading-server><bold>MUNDOS</bold></c> <dark_gray>« <gray>%count%'
  list-entry: '<dark_gray>▪ <white>%world% <dark_gray>» <gray>%environment% <dark_gray>▪ <gray>%players% conectados'
  time-usage: '%prefix%<gray>Uso: <white>/time [day|noon|night|midnight|ticks] [mundo|all]</white>'
  time-set: '%prefix%<gray>La hora en <white>%world%</white> ahora es <white>%time%</white>.'
  weather-usage: '%prefix%<gray>Uso: <white>/weather [clear|rain|storm] [minutos] [mundo]</white>'
  weather-set: '%prefix%<gray>El clima en <white>%world%</white> ahora es <white>%weather%</white> durante <white>%minutes%</white> minutos.'

  spawnmob-usage: '%prefix%<gray>Uso: <white>/spawnmob [mob] [cantidad] [jugador]</white>'
  spawnmob-unknown: '%prefix%<red>No existe ningún mob llamado <white>%mob%</white>.'
  spawnmob-limit: '%prefix%<red>Puedes generar como máximo <white>%limit%</white> a la vez.'
  spawnmob-done: '%prefix%<gray>Generaste <white>%count% %mob%</white> en <white>%player%</white>.'
  sweep-unknown: '%prefix%<red>No existe nada llamado <white>%target%</white> para limpiar.'
  sweep-radius: '%prefix%<red>El radio tiene que ser un número de bloques.'
  sweep-none: '%prefix%<gray>Aquí no hay <white>%target%</white>.'
  sweep-confirm: '%prefix%<red>Esto borra <white>%count% %target%</white> de todo <white>%world%</white>.'
  sweep-done: '%prefix%<green>Borraste <white>%count% %target%</white>.'
  auto-sweep-warning: '%prefix%<gray>Se va a limpiar <white>%target%</white> del suelo en <white>%seconds%</white> segundos. Recoge lo que quieras conservar.'
  auto-sweep-done: '%prefix%<gray>Se limpiaron <white>%count% %target%</white>.'
  tree-usage: '%prefix%<gray>Uso: <white>/tree [tipo]</white> <dark_gray>» <gray>%kinds%'
  tree-unknown: '%prefix%<red>No existe ningún árbol llamado <white>%kind%</white>.'
  tree-nowhere: '%prefix%<red>Mira al suelo donde debería crecer el árbol.'
  tree-refused: '%prefix%<red>Ahí no puede crecer un árbol.'
  tree-grown: '%prefix%<green>Hiciste crecer un <white>%kind%</white>.'
  spawner-none: '%prefix%<red>No estás mirando ningún generador.'
  spawner-usage: '%prefix%<gray>Uso: <white>/spawner [mob] [retraso]</white>'
  spawner-now: '%prefix%<gray>Ese generador genera <white>%mob%</white> cada <white>%delay%</white> ticks.'
  spawner-set: '%prefix%<green>Ese generador ahora genera <white>%mob%</white>.'
  unlimited-on: '%prefix%<green><white>%item%</white> ahora es ilimitado al colocarlo.'
  unlimited-off: '%prefix%<gray><white>%item%</white> ya no es ilimitado.'
  unlimited-empty: '%prefix%<gray>No tienes bloques ilimitados.'
  unlimited-cleared: '%prefix%<gray>Ya no tienes bloques ilimitados.'
  unlimited-not-a-block: '%prefix%<red>No tienes un bloque en la mano.'
  unlimited-list: '%prefix%<gray>Ilimitados <dark_gray>» <white>%count%</white> <dark_gray>(<gray>%items%<dark_gray>)'

  locate-usage: '%prefix%<gray>Uso: <white>/locate [structure|biome] [nombre]</white>, o solo el nombre.<newline>%prefix%<dark_gray>▪ <gray>Estructuras <dark_gray>» <white>%structures%<newline>%prefix%<dark_gray>▪ <gray>Biomas <dark_gray>» <white>%biomes%</white> <gray>en total. Pulsa tab después de <white>/locate biome </white><gray>para verlos.'
  locate-unknown: '%prefix%<red>No existe ninguna estructura ni bioma llamado <white>%kind%</white>.'
  locate-none: '%prefix%<gray>No hay ningún <white>%kind%</white> al alcance.'
  locate-refused: '%prefix%<red>El servidor no pudo hacer esa búsqueda desde tu ubicación.'
  locate-found: '%prefix%<gray>El <white>%kind%</white> más cercano <dark_gray>» <white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%</white> <dark_gray>(<gray>a %distance% bloques<dark_gray>)'
  locate-hover-teleport: '<gray>%world% <dark_gray>» <white>%x% %y% %z%<newline><c:good>➜ <gray>Haz clic para teletransportarte allí'
