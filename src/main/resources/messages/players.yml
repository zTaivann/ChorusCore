# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   P L A Y E R S                                                        │
# │   /afk  /seen  /playtime  /whois  /list  /nick  /ptime  /pweather      │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

players:
  afk-now: '%prefix%<gray>You are now AFK.'
  afk-now-broadcast: '%prefix%<white>%player%</white><gray> is now AFK.'
  afk-now-reason: '%prefix%<gray>You are now AFK <dark_gray>» <white>%reason%'
  afk-now-reason-broadcast: '%prefix%<white>%player%</white><gray> is now AFK <dark_gray>» <white>%reason%'
  afk-back: '%prefix%<gray>You are no longer AFK.'
  afk-back-broadcast: '%prefix%<white>%player%</white><gray> is no longer AFK.'
  afk-kicked: '<red>You were disconnected for being AFK too long.'

  seen-usage: '%prefix%<gray>Usage: <white>/seen [player]</white>'
  seen-online: '%prefix%<white>%player%</white><gray> is online, in <white>%world%</white>.'
  seen-online-afk: '%prefix%<white>%player%</white><gray> is online but AFK, in <white>%world%</white>.'
  seen-offline: '%prefix%<white>%player%</white><gray> was last seen <white>%ago%</white> ago. First joined <white>%first%</white>.'
  seen-where: '<dark_gray>▪ <gray>Last location <dark_gray>» <white>%world%</white> <dark_gray>(<white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%<dark_gray>)'
  seen-address: '<dark_gray>▪ <gray>Address <dark_gray>» <white>%address%'
  seen-alts: '<dark_gray>▪ <gray>Same address <dark_gray>» <white>%count%</white> <gray>players <dark_gray>» <white>%players%'

  playtime: '%prefix%<gray>You have played for <white>%time%</white>.'
  playtime-other: '%prefix%<white>%player%</white><gray> has played for <white>%time%</white>.'

  whois-usage: '%prefix%<gray>Usage: <white>/whois [player]</white>'
  whois-header: '<dark_gray>» <c:heading-info>%player%</c> <dark_gray>«'
  whois-uuid: '<dark_gray>▪ <gray>UUID <dark_gray>» <white>%uuid%'
  whois-status-online: '<dark_gray>▪ <gray>Status <dark_gray>» <green>online'
  whois-status-away: '<dark_gray>▪ <gray>Status <dark_gray>» <yellow>AFK'
  whois-status-offline: '<dark_gray>▪ <gray>Status <dark_gray>» <red>offline<gray>, last seen <white>%ago%</white> ago'
  whois-world: '<dark_gray>▪ <gray>Location <dark_gray>» <white>%world%</white> <dark_gray>(<white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%<dark_gray>)'
  whois-health: '<dark_gray>▪ <gray>Health <dark_gray>» <white>%health%</white> <dark_gray>| <gray>Hunger <dark_gray>» <white>%food%'
  whois-gamemode: '<dark_gray>▪ <gray>Game mode <dark_gray>» <white>%gamemode%'
  whois-ping: '<dark_gray>▪ <gray>Ping <dark_gray>» <white>%ping% ms'
  whois-playtime: '<dark_gray>▪ <gray>Playtime <dark_gray>» <white>%time%'
  whois-first: '<dark_gray>▪ <gray>First joined <dark_gray>» <white>%date%'
  whois-modes: '<dark_gray>▪ <gray>Modes <dark_gray>» <white>%modes%'
  whois-mode-flying: 'flying'
  whois-mode-invulnerable: 'invulnerable'
  whois-mode-sleeping: 'sleeping'
  whois-mode-operator: 'operator'
  whois-address: '<dark_gray>▪ <gray>Address <dark_gray>» <white>%address%'
  whois-country: '<dark_gray>▪ <gray>Country <dark_gray>» <white>%country%'
  whois-banned: '<dark_gray>▪ <gray>Banned <dark_gray>» <red>yes'

  list-header: '<dark_gray>» <gray>Online <dark_gray>» <white>%online%<dark_gray>/<white>%max%</white> <dark_gray>(<yellow>%away%</yellow><gray> AFK<dark_gray>)'
  list-names: '<gray>%players%'
  list-empty: '<gray>Nobody else is online.'

  ptime-usage: '%prefix%<gray>Usage: <white>/ptime [time] [player]</white><newline>%prefix%<gray>Times: <white>day noon sunset night midnight sunrise reset</white>, or a number from <white>0</white> to <white>23999</white>.'
  ptime-set: '%prefix%<gray>Your time is now <white>%value%</white>.'
  ptime-set-other: '%prefix%<gray>The time of <white>%player%</white> is now <white>%value%</white>.'
  ptime-reset: '%prefix%<gray>Your time follows the world again.'
  ptime-reset-other: '%prefix%<gray>The time of <white>%player%</white> follows the world again.'
  ptime-unknown: '%prefix%<red>There is no time called <white>%value%</white>. Use a name or a number from 0 to 23999.'

  pweather-usage: '%prefix%<gray>Usage: <white>/pweather [clear|rain|reset] [player]</white>'
  pweather-set: '%prefix%<gray>Your weather is now <white>%value%</white>.'
  pweather-set-other: '%prefix%<gray>The weather of <white>%player%</white> is now <white>%value%</white>.'
  pweather-reset: '%prefix%<gray>Your weather follows the world again.'
  pweather-reset-other: '%prefix%<gray>The weather of <white>%player%</white> follows the world again.'
  pweather-unknown: '%prefix%<red>There is no weather called <white>%value%</white>. Use clear, rain or reset.'

  nick-usage: '%prefix%<gray>Usage: <white>/nick [nickname|off]</white>'
  nick-set: '%prefix%<green>Your nickname is now <white>%nickname%</white>.'
  nick-set-other: '%prefix%<green>The nickname of <white>%player%</white> is now <white>%nickname%</white>.'
  nick-cleared: '%prefix%<gray>You no longer have a nickname.'
  nick-cleared-other: '%prefix%<white>%player%</white><gray> no longer has a nickname.'
  nick-taken: '%prefix%<red>Someone already uses the nickname <white>%nickname%</white>.'
  nick-too-long: '%prefix%<red>A nickname can have at most <white>%limit%</white> characters.'
  nick-invalid: '%prefix%<red>Invalid nickname. Use letters, numbers or <white>_</white>.'
  nick-no-colour: '%prefix%<red>You do not have permission to use colours in a nickname.'
  realname-usage: '%prefix%<gray>Usage: <white>/realname [nickname]</white>'
  realname: '%prefix%<white>%nickname%</white><gray> is <white>%player%</white>.'
  realname-unknown: '%prefix%<red>Nobody online uses the nickname <white>%nickname%</white>.'
