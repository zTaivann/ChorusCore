# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   C O R E                                                              │
# │   errors, /chorus and cooldowns                                        │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Colours: MiniMessage tags (<gold>), &-codes (&6, &l) and palette names
# (<c:accent>text</c>). && writes a plain &.
# https://docs.papermc.io/adventure/minimessage/format
#
# %prefix% is the prefix below. Any file can set its own prefix.
# An empty line ('') is not sent.

prefix: '<c:brand><bold>Chorus</bold></c> <dark_gray>|</dark_gray> '

error:
  no-permission: '%prefix%<red>You do not have permission to do that.'
  players-only: '%prefix%<red>Only players can use that command.'
  loading: '%prefix%<red>Your data is still loading. Try again in a second.'
  storage: '%prefix%<red>The change could not be saved. Tell an administrator.'
  load-failed: '<red>Your data could not be loaded.<newline><gray>Try again in a few minutes.'
  player-not-found: '%prefix%<red>%player% is not online.'
  command-disabled: '%prefix%<red>That command is disabled on this server.'
  command-world: '%prefix%<red>That command is disabled in this world.'
  command-requirement: '%prefix%<red>You cannot use /%command% yet.'
  module-disabled: '%prefix%<red>That module is disabled on this server.'
  command-recursion: '%prefix%<red>That command runs itself, so it was stopped. Check its run-as-console lines.'


core:
  usage: '%prefix%<gray>ChorusCore <white>%version%</white>. Usage: <white>/chorus [reload|status|check|permissions|placeholders|debug|import|purge|backup]</white>'
  reloaded: '%prefix%<green>Configuration reloaded.<newline>%prefix%<gray>Storage and aliases still need a server restart.'
  status-header: '<dark_gray>» <c:brand><bold>CHORUSCORE</bold></c> <dark_gray>« <gray>%version%'
  status-storage: '<dark_gray>▪ <gray>Storage <dark_gray>» <white>%storage%'
  status-economy: '<dark_gray>▪ <gray>Economy <dark_gray>» <white>%economy%'
  status-placeholders: '<dark_gray>▪ <gray>PlaceholderAPI <dark_gray>» <white>%placeholders%'
  status-modules: '<dark_gray>▪ <gray>Modules <dark_gray>» <white>%modules%'
  status-connected: 'connected'
  status-missing: 'not installed'
  economy-builtin: 'ChorusCore, %accounts% accounts'
  economy-vault: 'Vault, through %provider%'
  economy-vault-empty: 'Vault without an economy plugin, prices are ignored'
  economy-vault-missing: 'Vault is not installed, prices are ignored'
  economy-disabled: 'disabled, prices are ignored'
  economy-failed: 'the balance table could not be opened, prices are ignored'
  prompt-cancel: '%prefix%<dark_gray>▪ <gray>Type <white>cancel</white> to leave it as it is.'
  prompt-expired: '%prefix%<gray>Nothing was typed, so nothing changed.'

  reloaded-module: '%prefix%<green>Module <white>%module%</white> reloaded.'
  reload-unknown: '%prefix%<red>There is no module called <white>%module%</white>.'
  check-clean: '%prefix%<green>The configuration has no problems.'
  check-header: '<dark_gray>» <c:heading-staff><bold>CONFIGURATION</bold></c> <dark_gray>« <gray>%count%'
  check-problem: '<dark_gray>▪ <c:bad>%number%<dark_gray>. <gray>%problem%'
  reload-nothing: '<dark_gray>▪ <gray>Nothing changed.'
  reload-changed: '<dark_gray>▪ <gray>Changes <dark_gray>» <white>%count%'
  reload-change: '<dark_gray>  » <gray>%change%'
  reload-change-more: '<dark_gray>  » <gray>and <white>%count%</white> more'
  permissions-header: '<dark_gray>» <c:heading-staff><bold>PERMISSIONS</bold></c> <dark_gray>« <gray>%held%<dark_gray>/<gray>%count%'
  permissions-summary: '<dark_gray>▪ <gray>%group% <dark_gray>» <white>%held%<dark_gray>/<white>%count%'
  permissions-family: '<dark_gray>▪ <gray>%node%'
  permissions-usage: '%prefix%<gray>See one group with <white>/chorus permissions [group]</white>.'
  permissions-group-header: '<dark_gray>» <c:heading-staff><bold>%group%</bold></c> <dark_gray>« <gray>%count%'
  permissions-held: '<dark_gray>▪ <c:good>✔ <gray>%node%'
  permissions-missing-node: '<dark_gray>▪ <c:bad>✖ <gray>%node%'
  permissions-unknown: '%prefix%<red>There is no permission group called <white>%group%</white>.'
  permissions-missing: '%prefix%<red>The permission list is missing from the jar.'
  placeholders-header: '<dark_gray>» <c:heading-info><bold>PLACEHOLDERS</bold></c> <dark_gray>« <gray>%count%'
  placeholders-entry: '<dark_gray>▪ <gray>%name% <dark_gray>» <white>%value%'
  placeholders-none: 'nothing'
  confirm-again: '%prefix%<gray>Use the same command again within <white>%seconds%s</white> to confirm.'
  help-header: '<dark_gray>» <c:brand><bold>COMMANDS</bold></c> <dark_gray>« <gray>%count% <dark_gray>▪ <gray>%page%<dark_gray>/<gray>%pages%'
  help-module: '<dark_gray>▪ <gray>%module%'
  help-entry: '<dark_gray>  » <white>/%command% <dark_gray>- <gray>%description%'
  help-more: '%prefix%<gray>See the rest with <white>/commands %search%</white>.'
  help-modules: '%prefix%<dark_gray>▪ <gray>Filter by module with <white>/commands [module]</white> <dark_gray>(<gray>%modules%<dark_gray>)'
  help-empty: '%prefix%<gray>There are no commands here you can use.'
  help-no-match: '%prefix%<gray>No command matches <white>%search%</white>.'
  debug-header: '<dark_gray>» <c:brand><bold>CHORUSCORE</bold></c> <dark_gray>« <gray>%version%'
  debug-server: '<dark_gray>▪ <gray>Server <dark_gray>» <white>%server% %game% <dark_gray>▪ <gray>Java <white>%java%'
  debug-platform: '<dark_gray>▪ <gray>Scheduling <dark_gray>» <white>%platform% <dark_gray>▪ <gray>Memory <white>%memory%'
  debug-storage: '<dark_gray>▪ <gray>Storage <dark_gray>» <white>%storage% <dark_gray>▪ <gray>Economy <white>%economy%'
  debug-modules: '<dark_gray>▪ <gray>Enabled <dark_gray>» <white>%on%<newline><dark_gray>▪ <gray>Disabled <dark_gray>» <white>%off%'
  debug-commands: '<dark_gray>▪ <gray>Commands <dark_gray>» <white>%count% <dark_gray>▪ <gray>Online <white>%players%'
  debug-plugins: '<dark_gray>▪ <gray>Other plugins <dark_gray>» <white>%count% <dark_gray>(<gray>%plugins%<dark_gray>)'
  debug-none: 'none'

  import-usage: '%prefix%<gray>Usage: <white>/chorus import [essentials|quickshop] [run]</white>. Without <white>run</white>, it shows what would be imported.'
  import-not-found: '%prefix%<red>There is no Essentials folder in the plugins folder.'
  import-checking: '%prefix%<gray>Reading <white>%folder%</white>. Nothing will be written.'
  import-started: '%prefix%<gray>Importing from <white>%folder%</white>. This may take a moment.'
  import-confirm: '%prefix%<red>This imports homes, balances, warps and mail into ChorusCore. The Essentials folder is not changed, and data ChorusCore already has is kept.'
  import-confirm-overwrite: '%prefix%<red>This REPLACES the data ChorusCore already has with the data from Essentials.'
  import-would: '%prefix%<gray>Found <white>%players%</white> players. Nothing was written.'
  import-done: '%prefix%<green>Imported <white>%players%</white> players.'
  import-counts: '<dark_gray>▪ <gray>Homes <white>%homes%</white> <dark_gray>▪ <gray>Balances <white>%balances%</white> <dark_gray>▪ <gray>Warps <white>%warps%'
  import-counts-more: '<dark_gray>▪ <gray>Mail <white>%mail%</white> <dark_gray>▪ <gray>Nicknames <white>%nicknames%</white> <dark_gray>▪ <gray>Prices <white>%prices%'
  import-skipped: '<dark_gray>▪ <gray>Kept because ChorusCore already had them <dark_gray>» <white>%skipped%'
  import-problem: '<dark_gray>▪ <red>%problem%'
  import-problems-more: '<dark_gray>▪ <red>and %count% more like it'
  import-empty: '%prefix%<gray>That folder has nothing that can be imported.'
  import-failed: '%prefix%<red>The import stopped. The console says why. Nothing was lost.'
  import-next: '%prefix%<gray>To import it, use <white>/chorus import essentials run</white>.'
  import-restart: '%prefix%<gray>Restart the server to load the imported data.'
  import-shops-not-found: '%prefix%<red>There is no QuickShop folder in the plugins folder.'
  import-shops-confirm: '%prefix%<red>This imports every QuickShop shop into ChorusCore. The QuickShop database is not changed, and blocks that already have a ChorusCore shop are skipped.'
  import-shops-confirm-overwrite: '%prefix%<red>This REPLACES any ChorusCore shop on the same block as a QuickShop shop.'
  import-shops-would: '%prefix%<gray>Found <white>%shops%</white> shops in <white>%source%</white>. Nothing was written.'
  import-shops-done: '%prefix%<green>Imported <white>%shops%</white> shops from <white>%source%</white>.'
  import-shops-counts: '<dark_gray>▪ <gray>Read <white>%read%</white> <dark_gray>▪ <gray>Already here <white>%skipped%</white> <dark_gray>▪ <gray>Unreadable <white>%broken%'
  import-shops-empty: '%prefix%<gray>That folder has no shops that can be imported.'
  import-shops-next: '%prefix%<gray>To import them, use <white>/chorus import quickshop run</white>.'
  import-shops-restart: '%prefix%<gray>Restart the server to load the shops, then remove QuickShop.'

  purge-usage: '%prefix%<gray>Usage: <white>/chorus purge [days] [run]</white>. Without <white>run</white>, it shows what would be deleted.'
  purge-range: '%prefix%<red>A purge needs at least <white>%min%</white> days.'
  purge-confirm: '%prefix%<red>This permanently deletes the homes, balance, mail and preferences of every player not seen in %days% days.'
  purge-checking: '%prefix%<gray>Counting players not seen in <white>%days%</white> days. Nothing will be deleted.'
  purge-started: '%prefix%<gray>Purging players not seen in <white>%days%</white> days.'
  purge-would: '%prefix%<gray>Would delete <white>%players%</white> players <dark_gray>(<gray>%rows% rows<dark_gray>)<gray>. Nothing was deleted.'
  purge-done: '%prefix%<green>Deleted <white>%players%</white> players <dark_gray>(<gray>%rows% rows<dark_gray>)<green>.'
  purge-shops: '<dark_gray>▪ <gray>Kept because they own a chest shop <dark_gray>» <white>%count%'
  purge-empty: '%prefix%<gray>No player has been offline that long.'
  purge-failed: '%prefix%<red>The purge stopped. The console says why. Nothing was deleted.'
  purge-next: '%prefix%<gray>To delete them, add <white>run</white> to the end.'
  backup-started: '%prefix%<gray>Backing up the database, configs and messages.'
  backup-done: '%prefix%<green>Backup saved as <white>%file%</white> <dark_gray>(<gray>%size% MB<dark_gray>)<green>.'
  backup-remote: '%prefix%<yellow>The database is on a remote server and was not copied. Back it up with its own tools.'
  backup-rotated: '<dark_gray>▪ <gray>Old backups deleted <dark_gray>» <white>%count%'
  backup-failed: '%prefix%<red>The backup stopped. The console says why.'

  status-updates: '<dark_gray>▪ <gray>Updates <dark_gray>» <white>%updates%'
  update-available: '%prefix%<gray>ChorusCore <white>%latest%</white> is out. This server has <white>%current%</white>. <c:accent><underlined>Click to download it</underlined></c> <dark_gray>(%site%)'
  update-current: 'up to date'
  update-off: 'not checked'


cooldown:
  wait: '%prefix%<red>Wait <white>%time%</white> before using that again.'
  wait-world: '%prefix%<red>That was used in this world recently. It is available again in <white>%time%</white>.'
  wait-server: '%prefix%<red>That was used on the server recently. It is available again in <white>%time%</white>.'
  used-up: '%prefix%<red>No uses of that are left today <gray>(%uses% a day)<red>. More in <white>%time%</white>.'
