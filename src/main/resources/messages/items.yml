  potion-not-a-potion: '%prefix%<red>Hold a potion or a tipped arrow.'
  potion-unknown: '%prefix%<red>There is no effect called <white>%effect%</white>.'
  potion-unsafe: '%prefix%<red>Level <white>%max%</white> is as high as you may go.'
  potion-added: '%prefix%<green>Added <white>%effect% %level%</white> for <white>%seconds%s</white>.'
  potion-cleared: '%prefix%<gray>Every effect removed.'
  potion-none: '%prefix%<gray>That potion carries no effects of its own.'
