  itemdb-kind: '<dark_gray>▪ <gray>A %kind% <dark_gray>▪ <gray>stacks to <white>%stack%'
  itemdb-durability: '<dark_gray>▪ <gray>Durability <dark_gray>» <white>%left%<gray>/<white>%max%'
  itemdb-recipes: '<dark_gray>▪ <gray>%count% ways to make it <dark_gray>» <white>/recipe %item%'
  itemdb-matches: '%prefix%<gray>Nothing by that name. <white>%count%</white> come close <dark_gray>» <gray>%items%'
  recipe-usage: '%prefix%<gray>Use <white>/recipe [item|hand] [number]</white>.'
  recipe-none: '%prefix%<gray>%item% cannot be made.'
  recipe-unknown: '%prefix%<gray>There is no recipe <white>%number%</white>; it has <white>%count%</white>.'
  recipe-header: '<dark_gray>» <c:heading-info>%item%</c> <dark_gray>« <gray>%number%<dark_gray>/<gray>%count%'
  recipe-row: '<dark_gray>▪ <white>%one% <dark_gray>| <white>%two% <dark_gray>| <white>%three%'
  recipe-shapeless: '<dark_gray>▪ <gray>In any order <dark_gray>» <white>%items%'
  recipe-other: '<dark_gray>▪ <gray>Made in a %kind%.'
