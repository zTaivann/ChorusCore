# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   I T E M S                                                            │
# │   /hat  /condense  /clearinventory  /itemname  /lore  /more  /skull    │
# │   /unbreakable  /glow  /enchant  /stack                                │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

items:
  empty-hand: '%prefix%<red>You are not holding anything.'
  not-editable: '%prefix%<red>That item cannot be edited.'
  hat-worn: '%prefix%<gray>You are now wearing that item.'
  condense-nothing: '%prefix%<red>Nothing in your inventory can be packed into blocks.'
  condense-done: '%prefix%<gray>Packed <white>%count%</white> blocks.'
  cleared: '%prefix%<gray>Your inventory was emptied.'
  cleared-other: '%prefix%<gray>You emptied the inventory of <white>%player%</white>.'
  cleared-received: '%prefix%<white>%player%</white><gray> emptied your inventory.'
  clear-confirm: '%prefix%<red>This empties your inventory, armour and offhand.'
  clear-confirm-other: '%prefix%<red>This empties the inventory of <white>%player%</white>.'

  restore-usage: '%prefix%<gray>Usage: <white>/restore [player] [list|number]</white>'
  restore-disabled: '%prefix%<red>Inventory backups are disabled on this server.'
  restore-none: '%prefix%<gray>There are no backups of <white>%player%</white>.'
  restore-unknown: '%prefix%<red>There is no backup <white>%number%</white>. There are <white>%count%</white>.'
  restore-unreadable: '%prefix%<red>That backup was saved by an older version and cannot be read.'
  restore-gone: '%prefix%<red>That backup no longer exists.'
  restore-nothing-recent: '%prefix%<gray>There are no backups yet.'
  restore-recent-header: '<dark_gray>» <c:heading-staff><bold>RECENT BACKUPS</bold></c> <dark_gray>« <gray>%count%'
  restore-recent-entry: '<dark_gray>▪ <white>%player% <dark_gray>» <gray>%reason% <dark_gray>▪ <gray>%world% <dark_gray>▪ <gray>%ago% ago'
  restore-header: '<dark_gray>» <c:heading-staff><bold>BACKUPS</bold></c> <dark_gray>« <white>%player% <gray>%count%'
  restore-entry: '<dark_gray>▪ <c:accent>%number%<dark_gray>. <gray>before <white>%reason%</white><dark_gray>, <gray>by <white>%actor%</white> <dark_gray>(<gray>%ago% ago<dark_gray>)'
  restore-footer: '<dark_gray>▪ <gray>Restore one with <white>/restore %player% [number]</white>.'
  restored: '%prefix%<green>You restored the inventory of <white>%player%</white> from <white>%ago%</white> ago.'
  restore-received: '%prefix%<green>A member of staff restored your inventory.'
  restore-queued: '%prefix%<white>%player%</white><gray> is offline. The backup from <white>%ago%</white> ago will be restored when they join.'
  restore-waiting: '%prefix%<white>%player%</white><green> restored your inventory while you were offline.'
  handed-over: '%prefix%<green>You gave <white>%count%</white> items back to <white>%player%</white>.'
  hand-received: '%prefix%<green>You were given <white>%count%</white> items back.'

  itemname-usage: '%prefix%<gray>Usage: <white>/itemname [text|reset]</white>'
  itemname-set: '%prefix%<gray>Item renamed.'
  itemname-reset: '%prefix%<gray>The item name was removed.'
  lore-usage: '%prefix%<gray>Usage: <white>/lore add [text]</white>, <white>/lore set [line] [text]</white>, <white>/lore remove [line]</white> or <white>/lore clear</white>'
  lore-updated: '%prefix%<gray>Lore updated.'
  lore-cleared: '%prefix%<gray>Lore removed.'
  lore-full: '%prefix%<red>That item already has <white>%max%</white> lines of lore.'
  lore-no-line: '%prefix%<red>That item has <white>%lines%</white> lines of lore.'
  more: '%prefix%<gray>The stack now has <white>%amount%</white> items.'
  more-already: '%prefix%<red>That stack already has <white>%amount%</white> items.'
  more-range: '%prefix%<red>Use a number from 1 to <white>%max%</white>.'
  skull: '%prefix%<gray>You received the head of <white>%player%</white>.'
  skull-unavailable: '%prefix%<red>Player heads are not available on this server.'
  unbreakable-on: '%prefix%<gray>That item is now <green>unbreakable</green>.'
  unbreakable-off: '%prefix%<gray>That item can <red>break</red> again.'
  unbreakable-not-a-tool: '%prefix%<red>That item has no durability.'
  glow-on: '%prefix%<gray>That item now <green>glows</green>.'
  glow-off: '%prefix%<gray>That item no longer <red>glows</red>.'
  glow-already-enchanted: '%prefix%<red>Enchanted items already glow.'
  glow-unavailable: '%prefix%<red>Glow is not available on this version.'
  enchant-usage: '%prefix%<gray>Usage: <white>/enchant [enchantment] [level]</white>. Level <white>0</white> removes it.'
  enchant: '%prefix%<gray>Added <white>%enchantment% %level%</white>.'
  enchant-removed: '%prefix%<gray>Removed <white>%enchantment%</white>.'
  enchant-unknown: '%prefix%<red>There is no enchantment called <white>%enchantment%</white> on this version.'
  enchant-range: '%prefix%<red>Use a level from 0 to <white>%max%</white>.'
  enchant-blocked: '%prefix%<red><white>%enchantment%</white> cannot be added on this server.'
  stack: '%prefix%<gray>Stacked <white>%amount%</white> items.'
  stack-nothing: '%prefix%<gray>Nothing in your inventory can be stacked.'

  give-usage: '%prefix%<gray>Usage: <white>/give [player] [item] [amount]</white>'
  give-unknown: '%prefix%<red>There is no item called <white>%item%</white>.'
  give-blocked: '%prefix%<red><white>%item%</white> cannot be given on this server.'
  give-self: '%prefix%<gray>You received <white>%amount% %item%</white>.'
  give-sent: '%prefix%<gray>You gave <white>%amount% %item%</white> to <white>%player%</white>.'
  give-received: '%prefix%<gray>You were given <white>%amount% %item%</white>.'
  give-ignored: '%prefix%<gray>Ignored <white>%word%</white>: it is not a valid option.'
  exp-usage: '%prefix%<gray>Usage: <white>/exp [show|give|take|set|reset] [player] [amount]</white>. Add <white>L</white> to the amount for levels.'
  exp-show: '%prefix%<gray>Level <white>%level%</white> <dark_gray>▪ <white>%points%</white> <gray>points'
  exp-show-other: '%prefix%<white>%player%</white> <dark_gray>» <gray>level <white>%level%</white> <dark_gray>▪ <white>%points%</white> <gray>points'
  exp-changed: '%prefix%<gray>Your experience changed by <white>%amount%</white>.'
  exp-changed-other: '%prefix%<gray>The experience of <white>%player%</white> changed by <white>%amount%</white>.'
  exp-reset: '%prefix%<gray>Your experience was reset.'
  exp-reset-other: '%prefix%<gray>The experience of <white>%player%</white> was reset.'

  itemdb-usage: '%prefix%<gray>Usage: <white>/itemdb [item]</white>. Without an item, it shows the one in your hand.'
  itemdb-empty: '%prefix%<red>You are not holding anything.'
  itemdb-unknown: '%prefix%<red>There is no item called <white>%item%</white>.'
  itemdb-header: '<dark_gray>» <c:heading-info>%item%</c> <dark_gray>«'
  itemdb-kind: '<dark_gray>▪ <gray>Type <dark_gray>» <white>%kind%</white> <dark_gray>▪ <gray>Stacks to <white>%stack%'
  itemdb-durability: '<dark_gray>▪ <gray>Durability <dark_gray>» <white>%left%<gray>/<white>%max%'
  itemdb-recipes: '<dark_gray>▪ <gray>Recipes <dark_gray>» <white>%count%</white> <dark_gray>▪ <white>/recipe %item%'
  itemdb-matches: '%prefix%<gray>There is no item with that name. <white>%count%</white> are similar <dark_gray>» <gray>%items%'
  recipe-usage: '%prefix%<gray>Usage: <white>/recipe [item|hand] [number]</white>'
  recipe-none: '%prefix%<gray><white>%item%</white> cannot be crafted.'
  recipe-unknown: '%prefix%<red>There is no recipe <white>%number%</white>. It has <white>%count%</white>.'
  recipe-header: '<dark_gray>» <c:heading-info>%item%</c> <dark_gray>« <gray>%number%<dark_gray>/<gray>%count%'
  recipe-row: '<dark_gray>▪ <white>%one% <dark_gray>| <white>%two% <dark_gray>| <white>%three%'
  recipe-shapeless: '<dark_gray>▪ <gray>In any order <dark_gray>» <white>%items%'
  recipe-other: '<dark_gray>▪ <gray>Made in <dark_gray>» <white>%kind%'
  recipe-more: '%prefix%<gray>Next recipe <dark_gray>» <white>/recipe %item% %number%'

  book-usage: '%prefix%<gray>Usage: <white>/book [title|author] [text]</white>. Without arguments, it unsigns or signs the book in your hand.'
  book-not-a-book: '%prefix%<red>You are not holding a book.'
  book-not-signed: '%prefix%<red>That book is not signed.'
  book-unsealed: '%prefix%<green>The book is no longer signed and can be written in again.'
  book-signed: '%prefix%<green>The book is now signed.'
  book-title: '%prefix%<gray>The title is now <white>%text%</white>.'
  book-author: '%prefix%<gray>The author is now <white>%text%</white>.'
  firework-usage: '%prefix%<gray>Usage: <white>/firework shape:star colour:red,blue</white>, <white>/firework power [number]</white>, <white>/firework clear</white> or <white>/firework fire [amount]</white>'
  firework-not-a-rocket: '%prefix%<red>You are not holding a firework rocket.'
  firework-needs-colour: '%prefix%<red>A burst needs at least one colour <dark_gray>» <white>colour:red,blue'
  firework-added: '%prefix%<green>Burst added. The rocket has <white>%count%</white>.'
  firework-cleared: '%prefix%<gray>All bursts removed.'
  firework-power: '%prefix%<gray>The flight time is now <white>%power%</white>.'
  firework-power-range: '%prefix%<red>Use a flight time from 0 to <white>%max%</white>.'
  firework-fired: '%prefix%<gray>Launched <white>%count%</white>.'
  firework-colour-unknown: '%prefix%<red>There is no colour called <white>%colour%</white>.'
  firework-shape-unknown: '%prefix%<red>There is no shape called <white>%shape%</white>.'
  firework-ignored: '%prefix%<gray>Ignored <white>%word%</white>: it is not a valid option.'
  potion-usage: '%prefix%<gray>Usage: <white>/potion [effect] [level] [seconds]</white>, <white>/potion clear</white> or <white>/potion list</white>'
  potion-not-a-potion: '%prefix%<red>You are not holding a potion or a tipped arrow.'
  potion-unknown: '%prefix%<red>There is no effect called <white>%effect%</white>.'
  potion-unsafe: '%prefix%<red>The highest level allowed is <white>%max%</white>.'
  potion-added: '%prefix%<green>Added <white>%effect% %level%</white> for <white>%seconds%s</white>.'
  potion-cleared: '%prefix%<gray>All effects removed.'
  potion-none: '%prefix%<gray>That potion has no effects of its own.'
  potion-list-header: '%prefix%<gray>Effects <dark_gray>» <white>%count%'
  potion-list-entry: '<dark_gray>▪ <white>%effect% %level% <dark_gray>▪ <gray>%seconds%s'
  sign-usage: '%prefix%<gray>Usage: <white>/editsign set [line] [text]</white>, <white>/editsign clear</white>, <white>/editsign copy</white> or <white>/editsign paste</white>'
  sign-none: '%prefix%<red>You are not looking at a sign.'
  sign-reserved: '%prefix%<red>That sign belongs to a shop. Use <white>/shop</white> to change it.'
  sign-line-range: '%prefix%<red>Use a line from 1 to <white>%lines%</white>.'
  sign-set: '%prefix%<gray>Line <white>%line%</white> written.'
  sign-cleared: '%prefix%<gray>Sign cleared.'
  sign-copied: '%prefix%<gray>Sign copied.'
  sign-pasted: '%prefix%<gray>Sign pasted.'
  sign-nothing-copied: '%prefix%<red>You have not copied a sign yet.'
