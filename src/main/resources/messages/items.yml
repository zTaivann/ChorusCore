# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   I T E M S                                                            │
# │   the item tools, and the inventory backups                            │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Part of the messages folder. See core.yml.
# A 'prefix' set here is what %prefix% means in this file.

items:
  empty-hand: '%prefix%<red>You are not holding anything.'
  not-editable: '%prefix%<red>That item cannot be edited.'
  hat-worn: '%prefix%<gray>You are now wearing that item.'
  condense-nothing: '%prefix%<red>Nothing in your inventory packs into a block.'
  condense-done: '%prefix%<gray>Packed <white>%count%</white> blocks.'
  cleared: '%prefix%<gray>Inventory emptied.'
  cleared-other: '%prefix%<gray>Emptied the inventory of <white>%player%</white>.'
  cleared-received: '%prefix%<gray>Your inventory was emptied by <white>%player%</white>.'
  restore-usage: '%prefix%<gray>Usage: <white>/restore [player]</white><dark_gray>, <white>/restore [player] list</white><dark_gray>, <white>/restore [player] [number]</white>'
  restore-disabled: '%prefix%<red>Inventory backups are switched off on this server.'
  restore-none: '%prefix%<gray>There is nothing saved for <white>%player%</white>.'
  restore-unknown: '%prefix%<red>There is no copy <white>%number%</white>. There are <white>%count%</white>.'
  restore-unreadable: '%prefix%<red>That copy was saved by an older version and cannot be read.'
  restore-gone: '%prefix%<red>That copy is no longer there.'
  restore-nothing-recent: '%prefix%<gray>Nothing has been saved yet.'
  restore-recent-header: '<dark_gray>» <c:screen-backups><bold>RECENTLY SAVED</bold></c> <dark_gray>« <gray>%count%'
  restore-recent-entry: '<dark_gray>▪ <white>%player% <dark_gray>» <gray>%reason% <dark_gray>▪ <gray>%world% <dark_gray>▪ <gray>%ago% ago'
  restore-header: '<dark_gray>» <c:brand>SAVED INVENTORIES</c> <dark_gray>« <white>%player% <gray>%count%'
  restore-entry: '<dark_gray>▪ <c:accent>%number%<dark_gray>. <gray>before <white>%reason%</white><dark_gray>, <gray>by <white>%actor%</white> <dark_gray>(<gray>%ago% ago<dark_gray>)'
  restore-footer: '<dark_gray>▪ <gray>Put one back with <white>/restore %player% [number]</white>.'
  restored: '%prefix%<gray>Gave <white>%player%</white> back the inventory from <white>%ago%</white> ago.'
  restore-received: '%prefix%<gray>Your inventory was put back by a member of staff.'
  itemname-usage: '%prefix%<gray>Usage: <white>/itemname [text]</white> or <white>/itemname reset</white>'
  itemname-set: '%prefix%<gray>Item renamed.'
  itemname-reset: '%prefix%<gray>Item name cleared.'
  lore-usage: '%prefix%<gray>Usage: <white>/lore add [text]</white>, <white>set [line] [text]</white>, <white>remove [line]</white> or <white>clear</white>'
  lore-updated: '%prefix%<gray>Lore updated.'
  lore-cleared: '%prefix%<gray>Lore cleared.'
  lore-full: '%prefix%<red>That item already has %max% lines of lore.'
  lore-no-line: '%prefix%<red>That item has %lines% lines of lore.'
  more: '%prefix%<gray>Stack set to <white>%amount%</white>.'
  more-already: '%prefix%<red>That stack already contains %amount%.'
  more-range: '%prefix%<red>Pick a number between 1 and %max%.'
  skull: '%prefix%<gray>Here is the head of <white>%player%</white>.'
  skull-unavailable: '%prefix%<red>This server has no player heads.'
  unbreakable-on: '%prefix%<gray>That item is now <green>unbreakable</green>.'
  unbreakable-off: '%prefix%<gray>That item can <red>break</red> again.'
  unbreakable-not-a-tool: '%prefix%<red>That item has no durability to protect.'
  glow-on: '%prefix%<gray>That item now <white>shimmers</white>.'
  glow-off: '%prefix%<gray>The shimmer is gone.'
  glow-already-enchanted: '%prefix%<red>Enchanted items already shimmer on their own.'
  glow-unavailable: '%prefix%<red>The shimmer cannot be applied on this version.'
  enchant-usage: '%prefix%<gray>Usage: <white>/enchant [enchantment] [level]</white>. Level <white>0</white> removes it.'
  enchant: '%prefix%<gray>Added <white>%enchantment% %level%</white>.'
  enchant-removed: '%prefix%<gray>Removed <white>%enchantment%</white>.'
  enchant-unknown: '%prefix%<red>This version has no enchantment called <white>%enchantment%</white>.'
  enchant-range: '%prefix%<red>Pick a level between 0 and %max%.'
  enchant-blocked: '%prefix%<red>Nobody may put <white>%enchantment%</white> on an item here.'
  stack: '%prefix%<gray>Merged <white>%amount%</white> items.'
  stack-nothing: '%prefix%<gray>Nothing in your inventory could be merged.'

  clear-confirm: '%prefix%<red>This empties your inventory, armour and offhand.'
  clear-confirm-other: '%prefix%<red>This empties the inventory of <white>%player%</white>.'
  handed-over: '%prefix%<green>Handed <white>%count%</white> items to <white>%player%</white>.'
  hand-received: '%prefix%<green>You were given <white>%count%</white> items back.'
  restore-queued: '%prefix%<gray>%player% is offline. The copy from <white>%ago%</white> ago is waiting for them.'
  restore-waiting: '%prefix%<green>%player% put your inventory back while you were away.'
  give-usage: '%prefix%<gray>Use <white>/give [player] [item] [amount]</white>.'
  give-unknown: '%prefix%<red>There is no item called <white>%item%</white>.'
  give-blocked: '%prefix%<red><white>%item%</white> cannot be handed out here.'
  give-self: '%prefix%<gray>Given <white>%amount% %item%</white>.'
  give-sent: '%prefix%<gray>Given <white>%amount% %item%</white> to <white>%player%</white>.'
  give-received: '%prefix%<gray>You were given <white>%amount% %item%</white>.'
  exp-usage: '%prefix%<gray>Use <white>/exp [show|give|take|set|reset] [player] [amount]</white>. Add <white>L</white> for levels.'
  exp-show: '%prefix%<gray>Level <white>%level%</white> <dark_gray>▪ <gray>%points% points'
  exp-show-other: '%prefix%<gray>%player% <dark_gray>» <gray>level <white>%level%</white> <dark_gray>▪ <gray>%points% points'
  exp-changed: '%prefix%<gray>Experience changed by <white>%amount%</white>.'
  exp-changed-other: '%prefix%<gray>Experience of <white>%player%</white> changed by <white>%amount%</white>.'
  exp-reset: '%prefix%<gray>Experience emptied.'
  exp-reset-other: '%prefix%<gray>Experience of <white>%player%</white> emptied.'

  give-ignored: '%prefix%<gray>Ignored <white>%word%</white>, which means nothing here.'
  itemdb-usage: '%prefix%<gray>Use <white>/itemdb [item]</white>, or hold one and run it on its own.'
  itemdb-empty: '%prefix%<gray>Your hand is empty.'
  itemdb-unknown: '%prefix%<red>There is no item called <white>%item%</white>.'
