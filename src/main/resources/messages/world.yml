# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   W O R L D                                                            │
# │   /world  /time  /weather  /spawnmob  /sweep  /locate                  │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

world:
  not-found: '%prefix%<red>There is no world called <white>%world%</white>.'
  already-there: '%prefix%<gray>You are already in <white>%world%</white>.'
  went: '%prefix%<gray>You arrived at <white>%world%</white>.'
  every-world: 'every world'
  list-header: '<dark_gray>» <c:heading-server><bold>WORLDS</bold></c> <dark_gray>« <gray>%count%'
  list-entry: '<dark_gray>▪ <white>%world% <dark_gray>» <gray>%environment% <dark_gray>▪ <gray>%players% online'
  time-usage: '%prefix%<gray>Usage: <white>/time [day|noon|night|midnight|ticks] [world|all]</white>'
  time-now: '%prefix%<gray>%world% <dark_gray>» <white>%clock% <dark_gray>(<gray>%ticks% ticks<dark_gray>)'
  time-set: '%prefix%<gray>The time in <white>%world%</white> is now <white>%time%</white>.'
  weather-usage: '%prefix%<gray>Usage: <white>/weather [clear|rain|storm] [minutes] [world]</white>'
  weather-now: '%prefix%<gray>%world% <dark_gray>» <white>%weather%'
  weather-set: '%prefix%<gray>The weather in <white>%world%</white> is now <white>%weather%</white> for <white>%minutes%</white> minutes.'

  spawnmob-usage: '%prefix%<gray>Usage: <white>/spawnmob [mob] [amount] [player]</white>'
  spawnmob-unknown: '%prefix%<red>There is no mob called <white>%mob%</white>.'
  spawnmob-limit: '%prefix%<red>You can spawn at most <white>%limit%</white> at a time.'
  spawnmob-done: '%prefix%<gray>You spawned <white>%count% %mob%</white> at <white>%player%</white>.'
  sweep-unknown: '%prefix%<red>There is nothing called <white>%target%</white> to sweep.'
  sweep-radius: '%prefix%<red>The radius must be a number of blocks.'
  sweep-none: '%prefix%<gray>There is no <white>%target%</white> here.'
  sweep-confirm: '%prefix%<red>This removes <white>%count% %target%</white> from all of <white>%world%</white>.'
  sweep-done: '%prefix%<green>You removed <white>%count% %target%</white>.'
  auto-sweep-warning: '%prefix%<gray>Clearing <white>%target%</white> from the ground in <white>%seconds%</white> seconds. Pick up anything you want to keep.'
  auto-sweep-done: '%prefix%<gray>Cleared <white>%count% %target%</white>.'
  tree-usage: '%prefix%<gray>Usage: <white>/tree [type]</white> <dark_gray>» <gray>%kinds%'
  tree-unknown: '%prefix%<red>There is no tree called <white>%kind%</white>.'
  tree-nowhere: '%prefix%<red>Look at the ground where the tree should grow.'
  tree-refused: '%prefix%<red>A tree cannot grow there.'
  tree-grown: '%prefix%<green>You grew a <white>%kind%</white>.'
  spawner-none: '%prefix%<red>You are not looking at a spawner.'
  spawner-usage: '%prefix%<gray>Usage: <white>/spawner [mob] [delay]</white>'
  spawner-now: '%prefix%<gray>That spawner spawns <white>%mob%</white> every <white>%delay%</white> ticks.'
  spawner-set: '%prefix%<green>That spawner now spawns <white>%mob%</white>.'
  unlimited-on: '%prefix%<green><white>%item%</white> is now unlimited when you place it.'
  unlimited-off: '%prefix%<gray><white>%item%</white> is no longer unlimited.'
  unlimited-empty: '%prefix%<gray>You have no unlimited blocks.'
  unlimited-cleared: '%prefix%<gray>None of your blocks are unlimited now.'
  unlimited-not-a-block: '%prefix%<red>You are not holding a block.'
  unlimited-list: '%prefix%<gray>Unlimited <dark_gray>» <white>%count%</white> <dark_gray>(<gray>%items%<dark_gray>)'

  locate-usage: '%prefix%<gray>Usage: <white>/locate [structure|biome] [name]</white>, or only the name.<newline>%prefix%<dark_gray>▪ <gray>Structures <dark_gray>» <white>%structures%<newline>%prefix%<dark_gray>▪ <gray>Biomes <dark_gray>» <white>%biomes%</white> <gray>in total. Press tab after <white>/locate biome </white><gray>to see them.'
  locate-unknown: '%prefix%<red>There is no structure or biome called <white>%kind%</white>.'
  locate-none: '%prefix%<gray>There is no <white>%kind%</white> within reach.'
  locate-refused: '%prefix%<red>The server could not run that search from your location.'
  locate-found: '%prefix%<gray>Nearest <white>%kind%</white> <dark_gray>» <white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%</white> <dark_gray>(<gray>%distance% blocks away<dark_gray>)'
  locate-hover: '<gray>%world% <dark_gray>» <white>%x% %y% %z%'
  locate-hover-teleport: '<gray>%world% <dark_gray>» <white>%x% %y% %z%<newline><c:good>➜ <gray>Click to teleport there'
