# │   U T I L I T Y                                                        │
# │   /heal  /feed  /fly  /god  /ping  /fix  /trash  /speed  /top  /near   │
# │   /invsee  /ecsee  /tps  /getpos  /suicide  /burn  /craft  /anvil      │
