#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

utility:
  healed: '%prefix%<gray>Your health is full again.'
  healed-other: '%prefix%<gray>You healed <white>%player%</white>.'
  heal-received: '%prefix%<white>%player%</white><gray> healed you.'
  fed: '%prefix%<gray>Your hunger is full again.'
  fed-other: '%prefix%<gray>You fed <white>%player%</white>.'
  feed-received: '%prefix%<white>%player%</white><gray> fed you.'
  fly-enabled: '%prefix%<gray>Flight <green>enabled</green>.'
  fly-enabled-other: '%prefix%<gray>Flight <green>enabled</green> for <white>%player%</white>.'
  fly-enabled-received: '%prefix%<white>%player%</white><gray> <green>enabled</green> your flight.'
  fly-disabled: '%prefix%<gray>Flight <red>disabled</red>.'
  fly-disabled-other: '%prefix%<gray>Flight <red>disabled</red> for <white>%player%</white>.'
  fly-disabled-received: '%prefix%<white>%player%</white><gray> <red>disabled</red> your flight.'
  god-enabled: '%prefix%<gray>God mode <green>enabled</green>.'
  god-enabled-other: '%prefix%<gray>God mode <green>enabled</green> for <white>%player%</white>.'
  god-enabled-received: '%prefix%<white>%player%</white><gray> <green>enabled</green> your god mode.'
  god-disabled: '%prefix%<gray>God mode <red>disabled</red>.'
  god-disabled-other: '%prefix%<gray>God mode <red>disabled</red> for <white>%player%</white>.'
  god-disabled-received: '%prefix%<white>%player%</white><gray> <red>disabled</red> your god mode.'
  ping: '%prefix%<gray>Your ping is <white>%ping% ms</white>.'
  ping-other: '%prefix%<gray>The ping of <white>%player%</white> is <white>%ping% ms</white>.'
  repaired: '%prefix%<gray>Item repaired.'
  repaired-all: '%prefix%<gray>You repaired <white>%count%</white> items.'
  repair-nothing: '%prefix%<red>There is nothing to repair.'
  repair-empty-hand: '%prefix%<red>You are not holding anything.'
  repair-blacklisted: '%prefix%<red>That item cannot be repaired on this server.'
  repair-all-denied: '%prefix%<red>You can only repair the item in your hand.'
  speed-usage: '%prefix%<gray>Usage: <white>/speed [walk|fly] [1-10] [player]</white>'
  speed-range: '%prefix%<red>Use a number from 0 to <white>%max%</white>.'
  speed-set: '%prefix%<gray>Your <white>%mode%</white> speed is now <white>%amount%</white>.'
  speed-set-other: '%prefix%<gray>The <white>%mode%</white> speed of <white>%player%</white> is now <white>%amount%</white>.'
  speed-received: '%prefix%<white>%player%</white><gray> changed your <white>%mode%</white> speed to <white>%amount%</white>.'

  top-teleported: '%prefix%<gray>You were teleported up to <white>y %y%</white>.'
  top-none: '%prefix%<red>There is no block above you to stand on.'
  top-unavailable: '%prefix%<red><white>/top</white> cannot be used in this world.'
  bottom-teleported: '%prefix%<gray>You were teleported down to <white>y %y%</white>.'
  bottom-none: '%prefix%<red>There is no block below you to stand on.'
  jump-done: '%prefix%<gray>You were teleported to where you were looking.'
  jump-none: '%prefix%<red>There is no block in sight to jump to.'
  near-header: '%prefix%<gray>Players within <white>%radius%</white> blocks <dark_gray>(<white>%count%</white>)</dark_gray>'
  near-entry: '<white>%player%</white><dark_gray> </dark_gray><gray>%distance%m</gray>'
  near-separator: '<dark_gray>, </dark_gray>'
  near-none: '%prefix%<gray>There is nobody else within <white>%radius%</white> blocks.'
  near-radius: '%prefix%<red>Use a radius from 1 to <white>%max%</white>.'

  tps-header: '<dark_gray>» <c:heading-server><bold>SERVER</bold></c> <dark_gray>«'
  tps-rates: '<dark_gray>▪ <gray>TPS <dark_gray>» <white>%one%</white> <dark_gray>| <white>%five%</white> <dark_gray>| <white>%fifteen%</white>  <dark_gray>(1m, 5m, 15m)'
  tps-tick: '<dark_gray>▪ <gray>Tick <dark_gray>» <white>%millis% ms</white> <gray>average'
  tps-uptime: '<dark_gray>▪ <gray>Uptime <dark_gray>» <white>%time%'
  tps-memory: '<dark_gray>▪ <gray>Memory <dark_gray>» <white>%used%</white><dark_gray>/<white>%max% MB'
  getpos: '%prefix%<gray>You are at <white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%</white> in <white>%world%</white> <dark_gray>(<gray>yaw <white>%yaw%<dark_gray>, <gray>pitch <white>%pitch%<dark_gray>)'
  getpos-other: '%prefix%<white>%player%</white><gray> is at <white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%</white> in <white>%world%</white> <dark_gray>(<gray>yaw <white>%yaw%<dark_gray>, <gray>pitch <white>%pitch%<dark_gray>)'
  depth-above: '%prefix%<gray>You are <white>%blocks%</white> blocks above sea level <dark_gray>(<gray>y %y%<dark_gray>)'
  depth-below: '%prefix%<gray>You are <white>%blocks%</white> blocks below sea level <dark_gray>(<gray>y %y%<dark_gray>)'
  depth-level: '%prefix%<gray>You are at sea level <dark_gray>(<gray>y %y%<dark_gray>)'
  compass: '%prefix%<gray>Facing <white>%direction%</white> <dark_gray>(<gray>%degrees%°<dark_gray>)'
  compass-points:
    north: 'north'
    north-east: 'north-east'
    east: 'east'
    south-east: 'south-east'
    south: 'south'
    south-west: 'south-west'
    west: 'west'
    north-west: 'north-west'

  suicide: '%prefix%<gray>You killed yourself.'
  suicide-already-dead: '%prefix%<red>You are already dead.'
  burn-usage: '%prefix%<gray>Usage: <white>/burn [player] [seconds]</white>'
  burn: '%prefix%<gray>You set <white>%player%</white> on fire for <white>%seconds%s</white>.'
  burn-received: '%prefix%<red>You are on fire for <white>%seconds%s</white>.'
  burn-range: '%prefix%<red>Use a number of seconds from 1 to <white>%max%</white>.'
  ext-self: '%prefix%<gray>You are no longer on fire.'
  ext-other: '%prefix%<gray>You extinguished <white>%player%</white>.'
  ext-received: '%prefix%<white>%player%</white><gray> extinguished you.'
  smite-usage: '%prefix%<gray>Usage: <white>/smite [player]</white>'
  smite: '%prefix%<gray>You struck <white>%player%</white> with lightning.'
  smite-received: '%prefix%<red>You were struck by lightning.'
  smite-cursor: '%prefix%<gray>You struck lightning where you were looking.'
  smite-nothing: '%prefix%<red>There is nothing in sight to strike.'
  fireball-usage: '%prefix%<gray>Usage: <white>/fireball [type] [speed]</white> <dark_gray>(<gray>%kinds%<dark_gray>)'
  fireball: '%prefix%<gray>You launched a <white>%kind%</white>.'
  fireball-speed: '%prefix%<red>Use a speed from 1 to <white>%max%</white>.'
  break-none: '%prefix%<red>You are not looking at a block.'
  break-indestructible: '%prefix%<red><white>%block%</white> cannot be broken.'
  break-done: '%prefix%<gray>You broke <white>%block%</white>.'
  rested: '%prefix%<gray>You now count as having slept.'
  rested-other: '%prefix%<white>%player%</white><gray> now counts as having slept.'
  rest-received: '%prefix%<white>%player%</white><gray> made you count as having slept.'

  mirror-usage: '%prefix%<gray>Usage: <white>/%command% [player]</white>'
  mirror-self: '%prefix%<red>You cannot open your own inventory this way.'
  mirror-exempt: '%prefix%<red>You do not have permission to view the inventory of <white>%player%</white>.'
  mirror-opened: '%prefix%<gray>Viewing the inventory of <white>%player%</white>. Your changes apply immediately.'
  mirror-readonly: '%prefix%<gray>Viewing the inventory of <white>%player%</white>. Read only.'
  invsee-info: '<white>%player%'
  invsee-info-health: '<gray>Health <white>%health%</white><dark_gray>/%max%'
  invsee-info-food: '<gray>Hunger <white>%food%</white><dark_gray>/20'
  invsee-info-level: '<gray>Level <white>%level%'
  invsee-info-gamemode: '<gray>Game mode <white>%gamemode%'
  invsee-info-location: '<gray>%world% <dark_gray>%x%, %y%, %z%'

  sign-created: '%prefix%<green>%kind% sign created.'
  sign-broken: '%prefix%<red>That sign is missing a line.'
  sign-free-item: '%prefix%<red>A [Free] sign needs an item on the third line.'
  sign-free-given: '%prefix%<gray>You received <white>%amount% %item%</white>.'

  powertool-usage: '%prefix%<gray>Usage: <white>/powertool [command]</white>, <white>/powertool add [command]</white>, <white>/powertool list</white> or <white>/powertool clear</white><newline>%prefix%<dark_gray>▪ <gray>Write <white>%player%</white> in the command for the player you right-click.'
  powertool-empty-hand: '%prefix%<red>You are not holding anything.'
  powertool-bound: '%prefix%<gray>Every <white>%item%</white> now runs <white>/%command%</white>.'
  powertool-added: '%prefix%<gray>You added <white>/%command%</white> to every <white>%item%</white>.'
  powertool-full: '%prefix%<red>An item can have at most <white>%max%</white> commands.'
  powertool-too-long: '%prefix%<red>A command can have at most <white>%max%</white> characters.'
  powertool-cleared: '%prefix%<gray><white>%item%</white> no longer has commands.'
  powertool-cleared-all: '%prefix%<gray>You cleared <white>%count%</white> powertools.'
  powertool-list-header: '%prefix%<gray>Every <white>%item%</white> runs:'
  powertool-list-entry: '<dark_gray>  » <white>/%command%'
  powertool-list-empty: '%prefix%<gray><white>%item%</white> has no commands.'
  powertool-needs-player: '%prefix%<red>That command needs a player. Right-click a player with this item.'
  powertool-on: '%prefix%<gray>Powertools <green>enabled</green>.'
  powertool-off: '%prefix%<gray>Powertools <red>disabled</red>. Your commands are kept.'

  text-empty: '%prefix%<gray>There is nothing written here yet.'
  text-unknown: '%prefix%<red>There is no chapter called <white>%chapter%</white>.'
  text-page: '%prefix%<gray>Page <white>%page%</white> of <white>%pages%</white>. The rest is on <white>/%command% 2</white>.'
  text-chapters: '%prefix%<dark_gray>▪ <gray>Also here <dark_gray>» <white>%chapters%</white> <dark_gray>(<gray>read one with /%command% and its name<dark_gray>)'
