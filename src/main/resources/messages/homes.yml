# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   H O M E S                                                            │
# │   /home  /sethome  /delhome  /homes  /renamehome  /homeicon            │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

home:
  none: '%prefix%<gray>You have no homes yet. Create one with <white>/sethome</white>.'
  created: '%prefix%<gray>Home <white>%home%</white> created.'
  updated: '%prefix%<gray>Home <white>%home%</white> moved to your location.'
  deleted: '%prefix%<gray>Home <white>%home%</white> deleted.'
  teleported: '%prefix%<gray>You arrived at <white>%home%</white>.'
  unknown: '%prefix%<red>You have no home called <white>%home%</white>.'
  invalid-name: '%prefix%<red>Invalid name. Use letters, numbers, <white>-</white> or <white>_</white>, up to %max% characters.'
  limit-reached: '%prefix%<red>You already have %limit% homes. Delete one with <white>/delhome</white>.'
  world-missing: '%prefix%<red>The world <white>%world%</white> is not loaded.'
  delete-usage: '%prefix%<gray>Usage: <white>/delhome [home]</white>'
  rename-usage: '%prefix%<gray>Usage: <white>/renamehome [home] [new name]</white>'
  renamed: '%prefix%<gray>Home <white>%home%</white> is now called <white>%name%</white>.'
  rename-same: '%prefix%<red>That is already its name.'
  rename-taken: '%prefix%<red>You already have a home called <white>%home%</white>.'
  world-limit-reached: '%prefix%<red>You already have %limit% homes in %world%.'
  icon-usage: '%prefix%<gray>Usage: <white>/homeicon [home] [item]</white>. Without an item, the default icon is used.'
  icon-set: '%prefix%<gray>The icon of home <white>%home%</white> is now <white>%icon%</white>.'
  icon-cleared: '%prefix%<gray>Home <white>%home%</white> uses the default icon again.'
  icon-unknown: '%prefix%<red>There is no item called <white>%icon%</white> in this version.'
  list:
    header: '%prefix%<gray>Your homes <dark_gray>(<white>%count%</white>/%limit%)</dark_gray>'
    entry: '<white>%home%</white>'
    separator: '<dark_gray>, </dark_gray>'
    hover: '<gray>Go to <white>%home%</white><newline><dark_gray>%world% %x%, %y%, %z%</dark_gray>'

  none-other: '%prefix%<gray>%player% has no homes.'
  teleported-other: '%prefix%<gray>You arrived at <white>%home%</white>, a home of <white>%player%</white>.'
  overwrite-confirm: '%prefix%<gray>You already have a home called <white>%home%</white>. This moves it to your location.'
  delete-confirm: '%prefix%<red>This permanently deletes the home <white>%home%</white>.'
