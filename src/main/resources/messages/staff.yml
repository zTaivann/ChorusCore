# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   S T A F F                                                            │
# │   /tp  /tphere  /tppos  /tpall  /vanish  /gamemode  /gmc  /gms         │
# │   /gma  /gmsp  /freeze  /sudo  /lockdown  /tempfly  /note  /stafflog   │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

staff:
  tp-usage: '%prefix%<gray>Usage: <white>/tp [player] [target]</white><dark_gray>, <gray>or coordinates: <white>/tp [x] [y] [z]</white><newline>%prefix%<dark_gray>▪ <gray>Write <white>~</white> for your location, <white>~10</white> for ten blocks from it.'
  tp-self: '%prefix%<red>A player cannot be teleported to themselves.'
  tp-done: '%prefix%<gray>You teleported <white>%player%</white> to <white>%target%</white>.'
  tp-moved: '%prefix%<gray>You were teleported to <white>%target%</white>.'
  tphere-usage: '%prefix%<gray>Usage: <white>/tphere [player]</white>'
  tphere-done: '%prefix%<gray>You teleported <white>%player%</white> to you.'
  tppos-usage: '%prefix%<gray>Usage: <white>/tppos [x] [y] [z] [world] [player]</white><newline>%prefix%<dark_gray>▪ <gray>Write <white>~</white> for your location, <white>~10</white> for ten blocks from it.'
  tppos-world: '%prefix%<red>There is no world called <white>%world%</white>.'
  tppos-numbers: '%prefix%<red>The coordinates must be numbers or <white>~</white>.'
  tppos-done: '%prefix%<gray>You teleported <white>%player%</white> to <white>%x%, %y%, %z%</white> in <white>%world%</white>.'
  tpall-nobody: '%prefix%<red>There is nobody else online.'
  tpall-done: '%prefix%<gray>You teleported <white>%count%</white> players to you.'
  vanish-enabled: '%prefix%<gray>You are now <green>hidden</green>.'
  vanish-disabled: '%prefix%<gray>You are <red>visible</red> again.'

  gamemode-usage: '%prefix%<gray>Usage: <white>/gamemode [mode] [player]</white>'
  gamemode-unknown: '%prefix%<red>There is no game mode called <white>%mode%</white>.'
  gamemode-already: '%prefix%<red>The game mode is already <white>%mode%</white>.'
  gamemode-set: '%prefix%<gray>Your game mode is now <white>%mode%</white>.'
  gamemode-set-other: '%prefix%<gray>The game mode of <white>%player%</white> is now <white>%mode%</white>.'
  gamemode-received: '%prefix%<white>%player%</white><gray> changed your game mode to <white>%mode%</white>.'

  freeze-usage: '%prefix%<gray>Usage: <white>/freeze [player]</white>'
  freeze-on: '%prefix%<gray>You froze <white>%player%</white>.'
  freeze-off: '%prefix%<gray>You unfroze <white>%player%</white>.'
  freeze-received: '%prefix%<red>You have been frozen.</red><newline>%prefix%<gray>Reply to the staff member who froze you with <white>/reply</white>.'
  freeze-released: '%prefix%<green>You are no longer frozen.'
  freeze-reminder: '<red><bold>FROZEN</bold></red><gray> - do not log out'
  freeze-held: '%prefix%<red>You cannot move while frozen.'
  freeze-no-commands: '%prefix%<red>Only <white>/msg</white> and <white>/reply</white> work while frozen.'
  freeze-exempt: '%prefix%<red><white>%player%</white> cannot be frozen.'

  sudo-usage: '%prefix%<gray>Usage: <white>/sudo [player] [command]</white>'
  sudo-ran: '%prefix%<gray>You ran <white>/%command%</white> as <white>%player%</white>.'
  sudo-exempt: '%prefix%<red><white>/sudo</white> cannot be used on <white>%player%</white>.'

  lockdown-usage: '%prefix%<gray>Usage: <white>/lockdown [on|off] [reason]</white>'
  lockdown-status-on: '%prefix%<gray>The server is <red>closed</red> to everyone but staff.'
  lockdown-status-off: '%prefix%<gray>The server is <green>open</green>.'
  lockdown-closed: '%prefix%<red>The server is now closed to everyone but staff.'
  lockdown-opened: '%prefix%<green>The server is open again.'
  lockdown-kick: '<red><bold>Closed for maintenance</bold></red><newline><gray>Please try again shortly.'
  lockdown-kick-reason: '<red><bold>Closed for maintenance</bold></red><newline><gray>%reason%'

  tempfly-usage: '%prefix%<gray>Usage: <white>/tempfly [player] [minutes]</white>. <white>0</white> removes it.'
  tempfly-range: '%prefix%<red>Use a number of minutes from 0 to <white>%max%</white>.'
  tempfly-given: '%prefix%<gray>You gave <white>%player%</white> flight for <white>%time%</white>.'
  tempfly-received: '%prefix%<green>You can fly for <white>%time%</white>.'
  tempfly-ending: '%prefix%<yellow>Your flight ends in <white>%seconds%</white> seconds.'
  tempfly-expired: '%prefix%<gray>Your flight has ended.'
  tempfly-taken: '%prefix%<gray>You removed the flight of <white>%player%</white>.'
  tempfly-none: '%prefix%<red><white>%player%</white> has no temporary flight.'

  note-usage: '%prefix%<gray>Usage: <white>/note add [player] [text]</white>, <white>/note list [player]</white> or <white>/note clear [player]</white>'
  note-added: '%prefix%<gray>Note saved about <white>%player%</white>.'
  note-header: '<dark_gray>» <c:heading-staff><bold>NOTES</bold></c> <dark_gray>« <white>%player%</white> <dark_gray>▪ <gray>%count%'
  note-entry: '<dark_gray>▪ <gray>%date% <white>%author% <dark_gray>» <gray>%note%'
  note-none: '%prefix%<gray>There are no notes about <white>%player%</white>.'
  note-cleared: '%prefix%<gray>You removed <white>%count%</white> notes about <white>%player%</white>.'

  log-header: '<dark_gray>» <c:heading-staff><bold>STAFF LOG</bold></c> <dark_gray>« <gray>%count%'
  log-entry: '<dark_gray>▪ <white>%actor% <gray>%action% <white>%subject% <dark_gray>(<gray>%ago% ago<dark_gray>)'
  log-entry-detailed: '<dark_gray>▪ <white>%actor% <gray>%action% <white>%subject% <dark_gray>» <gray>%detail% <dark_gray>(<gray>%ago% ago<dark_gray>)'
  log-entry-plain: '<dark_gray>▪ <white>%actor% <gray>%action% <dark_gray>(<gray>%ago% ago<dark_gray>)'
  log-empty: '%prefix%<gray>The staff log is empty.'
  log-disabled: '%prefix%<red>The staff log is disabled on this server.'
  log-actions:
    used: 'used'
    eco-give: 'added balance to'
    eco-take: 'took balance from'
    eco-set: 'set the balance of'
    eco-reset: 'reset the balance of'
    freeze: 'froze'
    unfreeze: 'unfroze'
    lockdown-on: 'closed the server'
    lockdown-off: 'opened the server'
    note: 'added a note about'
    note-clear: 'removed the notes about'
    sudo: 'ran a command as'
    tempfly-on: 'gave temporary flight to'
    tempfly-off: 'removed the temporary flight of'
