# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   S T A F F                                                            │
# │   /tp  /vanish  /gamemode  /freeze  /sudo  /lockdown and the rest      │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Part of the messages folder. See core.yml.
# A 'prefix' set here is what %prefix% means in this file.

staff:
  tp-usage: '%prefix%<gray>Usage: <white>/tp [player] [target]</white><dark_gray>, <gray>or coordinates: <white>/tp [x] [y] [z]</white><newline>%prefix%<dark_gray>▪ <gray>Write <white>~</white> for where you are, <white>~10</white> for ten blocks from it.'
  tp-self: '%prefix%<red>That would not move anybody.'
  tp-done: '%prefix%<gray>Sent <white>%player%</white> to <white>%target%</white>.'
  tp-moved: '%prefix%<gray>You were moved to <white>%target%</white>.'
  tphere-usage: '%prefix%<gray>Usage: <white>/tphere [player]</white>'
  tphere-done: '%prefix%<gray>Brought <white>%player%</white> to you.'
  tppos-usage: '%prefix%<gray>Usage: <white>/tppos [x] [y] [z] [world] [player]</white><newline>%prefix%<dark_gray>▪ <gray>Write <white>~</white> for where you are, <white>~10</white> for ten blocks from it.'
  tppos-world: '%prefix%<red>There is no world called <white>%world%</white>.'
  tppos-numbers: '%prefix%<red>The coordinates have to be numbers, or <white>~</white>.'
  tppos-done: '%prefix%<gray>Sent <white>%player%</white> to <white>%x%, %y%, %z%</white> in <white>%world%</white>.'
  tpall-nobody: '%prefix%<red>There is nobody else online.'
  tpall-done: '%prefix%<gray>Brought <white>%count%</white> players to you.'
  vanish-enabled: '%prefix%<gray>You are now <green>hidden</green>.'
  vanish-disabled: '%prefix%<gray>You are <red>visible</red> again.'
  gamemode-usage: '%prefix%<gray>Usage: <white>/gamemode [mode] [player]</white>'
  gamemode-unknown: '%prefix%<red>There is no game mode called <white>%mode%</white>.'
  gamemode-already: '%prefix%<red>Already in <white>%mode%</white>.'
  gamemode-set: '%prefix%<gray>Game mode set to <white>%mode%</white>.'
  gamemode-set-other: '%prefix%<gray>Set <white>%player%</white> to <white>%mode%</white>.'
  gamemode-received: '%prefix%<gray>Your game mode was set to <white>%mode%</white> by <white>%player%</white>.'
  freeze-usage: '%prefix%<gray>Usage: <white>/freeze [player]</white>'
  freeze-on: '%prefix%<gray>Froze <white>%player%</white>.'
  freeze-off: '%prefix%<gray>Released <white>%player%</white>.'
  freeze-received: '%prefix%<red>You have been frozen.</red><newline>%prefix%<gray>Answer the staff member who froze you with <white>/reply</white>.'
  freeze-released: '%prefix%<green>You can move again.'
  freeze-reminder: '<red><bold>FROZEN</bold></red><gray> - do not log out'
  freeze-held: '%prefix%<red>You cannot go anywhere while frozen.'
  freeze-no-commands: '%prefix%<red>Only <white>/msg</white> and <white>/reply</white> work while frozen.'
  freeze-exempt: '%prefix%<red>%player% cannot be frozen.'
  sudo-usage: '%prefix%<gray>Usage: <white>/sudo [player] [command]</white>'
  sudo-ran: '%prefix%<gray>Ran <white>/%command%</white> as <white>%player%</white>.'
  sudo-exempt: '%prefix%<red>%player% cannot be sudoed.'
  lockdown-usage: '%prefix%<gray>Usage: <white>/lockdown [on|off] [reason]</white>'
  lockdown-status-on: '%prefix%<gray>The server is <red>closed</red> to everyone but staff.'
  lockdown-status-off: '%prefix%<gray>The server is <green>open</green>.'
  lockdown-closed: '%prefix%<red>The server is now closed to everyone but staff.'
  lockdown-opened: '%prefix%<green>The server is open again.'
  lockdown-kick: '<red><bold>Closed for maintenance</bold></red><newline><gray>Please try again shortly.'
  lockdown-kick-reason: '<red><bold>Closed for maintenance</bold></red><newline><gray>%reason%'
  tempfly-usage: '%prefix%<gray>Usage: <white>/tempfly [player] [minutes]</white>. <white>0</white> takes it back.'
  tempfly-range: '%prefix%<red>Pick a number of minutes between 0 and %max%.'
  tempfly-given: '%prefix%<gray>Gave <white>%player%</white> flight for <white>%time%</white>.'
  tempfly-received: '%prefix%<green>You can fly for <white>%time%</white>.'
  tempfly-ending: '%prefix%<yellow>Your flight ends in <white>%seconds%</white> seconds.'
  tempfly-expired: '%prefix%<gray>Your flight has ended.'
  tempfly-taken: '%prefix%<gray>Took the flight of <white>%player%</white>.'
  tempfly-none: '%prefix%<red>%player% has no timed flight running.'
  note-usage: '%prefix%<gray>Usage: <white>/note add [player] [text]</white>, <white>list [player]</white> or <white>clear [player]</white>'
  note-added: '%prefix%<gray>Note saved about <white>%player%</white>.'
  note-header: '<dark_gray>» <c:heading-staff><bold>NOTES</bold></c> <dark_gray>« <white>%player%</white> <dark_gray>▪ <gray>%count%'
  note-entry: '<dark_gray>▪ <gray>%date% <white>%author% <dark_gray>» <gray>%note%'
  note-none: '%prefix%<gray>There are no notes about <white>%player%</white>.'
  note-cleared: '%prefix%<gray>Removed <white>%count%</white> notes about <white>%player%</white>.'
  log-header: '<dark_gray>» <c:heading-staff><bold>STAFF LOG</bold></c> <dark_gray>« <gray>%count%'
  log-entry: '<dark_gray>▪ <white>%actor% <gray>%action% <white>%subject% <dark_gray>(<gray>%ago% ago<dark_gray>)'
  log-entry-detailed: '<dark_gray>▪ <white>%actor% <gray>%action% <white>%subject% <dark_gray>» <gray>%detail% <dark_gray>(<gray>%ago% ago<dark_gray>)'
  log-entry-plain: '<dark_gray>▪ <white>%actor% <gray>%action% <dark_gray>(<gray>%ago% ago<dark_gray>)'
  log-empty: '%prefix%<gray>There is nothing in the staff log.'
  log-disabled: '%prefix%<red>The staff log is switched off on this server.'
