# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   M E N U S                                                            │
# │   every word that appears in a menu                                    │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Format: see core.yml. A prefix here replaces %prefix% in this file.

menu:

  # ── Page buttons ────────────────────────────────────────────────────────
  buttons:
    previous: '<c:accent>« Previous'
    previous-lore: '<dark_gray>▪ <gray>Page <white>%page%'
    next: '<c:accent>Next »'
    next-lore: '<dark_gray>▪ <gray>Page <white>%page%'
    close: '<c:bad>✖ Close'
    close-lore: '<dark_gray>▪ <gray>Closes this menu'
    back: '<c:accent>« Back'
    back-lore: '<dark_gray>▪ <gray>To the previous menu'

  # ── /homes ──────────────────────────────────────────────────────────────
  homes:
    title: '<c:frame>» <c:menu-homes>YOUR HOMES</c> <c:frame>« <c:muted>%page%<c:frame>/<c:muted>%pages%'
    entry: '<c:menu-homes>%home%'
    lore-world: '<dark_gray>▪ <gray>World <dark_gray>» <white>%world%'
    lore-location: '<dark_gray>▪ <gray>Location <dark_gray>» <white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%'
    lore-created: '<dark_gray>▪ <gray>Created <dark_gray>» <white>%date%'
    lore-divider: '<dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪'
    lore-action: '<c:good>➜ <gray>Click to teleport'

  # ── /warps ──────────────────────────────────────────────────────────────
  # Sections are set with /warpset <warp> section <name>.
  warps:
    title: '<c:frame>» <c:menu-warps>WARPS</c> <c:frame>« <c:muted>%page%<c:frame>/<c:muted>%pages%'
    section: '<c:menu-warps>%section%'
    section-lore: '<dark_gray>▪ <gray>Warps <dark_gray>» <white>%count%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to open'
    section-title: '<c:frame>» <c:menu-warps>%section%</c> <c:frame>« <c:muted>%page%<c:frame>/<c:muted>%pages%'
    section-loose: 'Other'
    entry: '<c:menu-warps>%warp%'
    lore-description: '<gray>%description%'
    lore-uses: '<dark_gray>▪ <gray>Used <dark_gray>» <white>%uses%</white> <gray>times'
    lore-world: '<dark_gray>▪ <gray>World <dark_gray>» <white>%world%'
    lore-location: '<dark_gray>▪ <gray>Location <dark_gray>» <white>%x%<dark_gray>, <white>%y%<dark_gray>, <white>%z%'
    lore-divider: '<dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪'
    lore-action: '<c:good>➜ <gray>Click to teleport'

  # ── /kits ───────────────────────────────────────────────────────────────
  kits:
    title: '<c:frame>» <c:menu-kits>KITS</c> <c:frame>« <c:muted>%page%<c:frame>/<c:muted>%pages%'
    lore-divider: '<dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪'
    lore-action: '<c:good>➜ <gray>Click to claim this kit'
    lore-cooldown: '<c:bad>✖ <gray>Available in <white>%time%'
    lore-taken: '<c:bad>✖ <gray>Already claimed'
    lore-locked: '<c:bad>✖ <gray>You do not meet the requirements'

  # ── /restore ────────────────────────────────────────────────────────────
  backups:
    title: '<c:frame>» <c:menu-backups>BACKUPS</c> <c:frame>« <c:muted>%player% <c:frame>▪ <c:muted>%page%<c:frame>/<c:muted>%pages%'
    entry: '<c:menu-backups>%reason%</c> <dark_gray>▪ <gray>%ago% ago'
    entry-lore: '<dark_gray>▪ <gray>By <dark_gray>» <white>%actor%<newline><dark_gray>▪ <gray>Location <dark_gray>» <white>%world% %x% %y% %z%<newline><dark_gray>▪ <gray>Level <white>%level%</white> <dark_gray>▪ <gray>Health <white>%health%</white> <dark_gray>▪ <gray>Hunger <white>%food%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to view'
    entry-death-lore: '<dark_gray>▪ <c:bad>Cause <dark_gray>» <white>%cause%<newline><dark_gray>▪ <gray>Location <dark_gray>» <white>%world% %x% %y% %z%<newline><dark_gray>▪ <gray>Level <white>%level%</white> <dark_gray>▪ <gray>Health <white>%health%</white> <dark_gray>▪ <gray>Hunger <white>%food%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to view'
    entry-killed-lore: '<dark_gray>▪ <c:bad>Killed by <dark_gray>» <white>%killer%<newline><dark_gray>▪ <gray>Location <dark_gray>» <white>%world% %x% %y% %z%<newline><dark_gray>▪ <gray>Level <white>%level%</white> <dark_gray>▪ <gray>Health <white>%health%</white> <dark_gray>▪ <gray>Hunger <white>%food%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to view'
    reason-death: 'Death'
    reason-join: 'Join'
    reason-quit: 'Quit'
    reason-world: 'World change'
    reason-clear: 'Inventory cleared'
    reason-kit: 'Kit'
    reason-restore: 'Restore'
    reason-manual: 'Manual'
    view-title: '<c:frame>» <c:menu-backups>BACKUP</c> <c:frame>« <c:muted>%player% <c:frame>▪ <c:muted>%ago% ago'
    ender-title: '<c:frame>» <c:menu-backups>ENDER CHEST</c> <c:frame>« <c:muted>%player% <c:frame>▪ <c:muted>%ago% ago'
    ender: '<c:accent>◆ Ender chest'
    ender-lore: '<dark_gray>▪ <gray>Its contents in this backup<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to view'
    restore: '<c:good>✚ Restore inventory'
    restore-lore: '<dark_gray>▪ <gray>Restores these items<newline><dark_gray>▪ <gray>Their current inventory is backed up first<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to restore'
    restore-all: '<c:good>✦ Restore everything'
    restore-all-lore: '<dark_gray>▪ <gray>Inventory, ender chest, experience, health and hunger<newline><dark_gray>▪ <gray>Their current state is backed up first<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to restore'
    hand-over: '<c:accent>✋ Give the items back'
    hand-over-lore: '<dark_gray>▪ <gray>Gives these items back without<newline><dark_gray>▪ <gray>removing their current items<newline><dark_gray>▪ <gray>Items that do not fit drop at their feet<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to give them back'
    filter: '<c:accent>◆ Showing <white>%filter%'
    filter-all: 'all'
    filter-lore: '<dark_gray>▪ <gray>Next <dark_gray>» <white>%next%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to change'
    restore-ender: '<c:good>✚ Restore ender chest'
    restore-ender-lore: '<dark_gray>▪ <gray>Restores only these items<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to restore'

  # ── Chest shop signs ────────────────────────────────────────────────────
  # The lines of a finished [Shop] sign.
  shops:
    sign-owner: '<c:sign-owner>%player%'
    sign-selling: '<c:frame>Selling <c:muted>%amount%'
    sign-buying: '<c:frame>Buying <c:muted>%amount%'
    sign-item: '<c:muted>%item%'
    sign-price: '<c:sign-price>%price% <c:frame>each'

  # ── /trash, /invsee and /ecsee ──────────────────────────────────────────
  titles:
    disposal: '<c:frame>» <c:menu-disposal>DISPOSAL</c> <c:frame>«'
    invsee: '<c:frame>» <c:menu-inventory>INVENTORY</c> <c:frame>« <c:muted>%player%'
    ecsee: '<c:frame>» <c:menu-enderchest>ENDER CHEST</c> <c:frame>« <c:muted>%player%'

  # ── /kitedit ────────────────────────────────────────────────────────────
  editor:
    list-title: '<c:frame>» <c:menu-kits>KIT EDITOR</c> <c:frame>« <c:muted>%page%<c:frame>/<c:muted>%pages%'
    list-entry: '<c:menu-kits>%kit%'
    list-entry-lore: '<dark_gray>▪ <gray>Items <dark_gray>» <white>%items%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to edit'
    new: '<c:good>✚ New kit'
    new-lore: '<dark_gray>▪ <gray>Carry its items first<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click for the command'
    ask-name: '%prefix%<gray>Type a name for the new kit. Use letters, numbers, <white>-</white> or <white>_</white>.'
    title: '<c:frame>» <c:menu-kits>%kit%</c> <c:frame>«'
    header: '<c:menu-kits>%kit%'
    header-lore: '<dark_gray>▪ <gray>Display name <dark_gray>» <white>%display%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to change it'
    ask-display: '%prefix%<gray>Type the display name of <white>%kit%</white>. Colours work: <white>&&6VIP</white> or <white>\<gold>VIP'
    icon: '<c:accent>✎ Icon'
    icon-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%icon%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click an item in your inventory to copy it<newline><dark_gray>▪ <gray>Its name and enchantments are kept<newline><dark_gray>▪ <gray>Nothing is taken from your inventory'
    icon-title: '<c:frame>» <c:menu-kits>%kit%</c> <c:frame>« <c:muted>Click an item to copy it'
    icon-set: '%prefix%<gray>Kit <white>%kit%</white>: the icon is now <white>%icon%</white>.'
    items: '<c:accent>✦ Items'
    items-lore: '<dark_gray>▪ <gray>Items <dark_gray>» <white>%count%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to edit them<newline><dark_gray>▪ <gray>Nothing is taken from your inventory'
    items-title: '<c:frame>» <c:menu-kits>%kit%</c> <c:frame>« <c:muted>Click to copy, close to save'
    preview: '<c:accent>◆ Preview'
    preview-lore: '<dark_gray>▪ <gray>See it as a player would<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to view'
    preview-title: '<c:frame>» <c:menu-kits>%kit%</c> <c:frame>« <c:muted>Preview'
    lore: '<c:accent>✎ Lore'
    lore-lore: '<dark_gray>▪ <gray>Lines <dark_gray>» <white>%value%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to type them'
    ask-lore: '%prefix%<gray>Type the lines under the name of <white>%kit%</white>. Separate them with <white>|</white>, or type <white>none</white> to remove them.'
    cooldown: '<c:accent>● Cooldown'
    cooldown-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>▸ <gray>Left-click <white>+1m</white><dark_gray>, <gray>right-click <white>-1m<newline><c:good>▸ <gray>Hold shift for whole days<newline><c:good>▸ <gray>Press <white>Q</white> to type the seconds'
    ask-cooldown: '%prefix%<gray>Type the cooldown of <white>%kit%</white>, in seconds. <white>3600</white> is an hour, <white>86400</white> a day.'
    maxclaims: '<c:accent>◇ Max claims'
    maxclaims-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>▸ <gray>Left-click <white>+1</white><dark_gray>, <gray>right-click <white>-1<newline><c:good>▸ <gray>Hold shift for ten at a time<newline><c:good>▸ <gray>Press <white>Q</white> to type the number'
    ask-maxclaims: '%prefix%<gray>Type how many times <white>%kit%</white> can be claimed in total. <white>0</white> is no limit.'
    price: '<c:accent>★ Price'
    price-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>▸ <gray>Left-click <white>+10</white><dark_gray>, <gray>right-click <white>-10<newline><c:good>▸ <gray>Hold shift for hundreds<newline><c:good>▸ <gray>Press <white>Q</white> to type the amount'
    ask-price: '%prefix%<gray>Type the price of <white>%kit%</white>. <white>0</white> is free.'
    permission: '<c:accent>✎ Permission'
    permission-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to change it'
    ask-permission: '%prefix%<gray>Type the permission needed to claim <white>%kit%</white>, or <white>none</white> for everyone.'
    onetime: '<c:accent>◆ One time'
    onetime-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪ <gray>It can only be claimed once, whatever the cooldown<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to change'
    autoarmor: '<c:accent>◆ Auto armour'
    autoarmor-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪ <gray>Armour is equipped instead of going into the inventory<newline><dark_gray>▪ <gray>An occupied slot is not replaced<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to change'
    clearinventory: '<c:accent>◆ Clear inventory'
    clearinventory-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪ <gray>Empties the inventory before giving the kit<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to change'
    placeholders: '<c:accent>◆ Placeholders'
    placeholders-lore: '<dark_gray>▪ <gray>Now <dark_gray>» <white>%value%<newline><dark_gray>▪ <gray>Replaces <white>%player%</white> and <white>%date%</white> in the text of the items<newline><dark_gray>▪ <gray>Only items that use them are rebuilt<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to change'
    back: '<c:accent>« Back'
    back-lore: '<dark_gray>▪ <gray>To the list of kits'
    delete: '<c:bad>✖ Delete'
    delete-lore: '<dark_gray>▪ <gray>Deletes it from kits.yml<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:bad>➜ <gray>Shift-click to confirm'
    delete-confirm: '%prefix%<c:bad>Shift-click to delete <white>%kit%</white> permanently.'

    requirements: '<c:accent>◇ Requirements'
    requirements-lore: '<dark_gray>▪ <gray>Lines <dark_gray>» <white>%count%<newline><dark_gray>▪ <gray>What a player needs to claim it<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to open'
    requirements-title: '<c:frame>» <c:menu-kits>%kit%</c> <c:frame>« <c:muted>Requirements'
    claimactions: '<c:accent>✦ Claim actions'
    claimactions-lore: '<dark_gray>▪ <gray>Lines <dark_gray>» <white>%count%<newline><dark_gray>▪ <gray>What happens when it is claimed<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to open'
    claimactions-title: '<c:frame>» <c:menu-kits>%kit%</c> <c:frame>« <c:muted>Claim actions'
    failactions: '<c:accent>✖ Fail actions'
    failactions-lore: '<dark_gray>▪ <gray>Lines <dark_gray>» <white>%count%<newline><dark_gray>▪ <gray>What happens when claiming it fails<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to open'
    failactions-title: '<c:frame>» <c:menu-kits>%kit%</c> <c:frame>« <c:muted>Fail actions'
    rule-entry: '<c:accent>%index%<dark_gray>. <white>%kind%'
    rule-entry-lore: '<dark_gray>▪ <gray>%line%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to rewrite it<newline><c:bad>➜ <gray>Shift-click to remove it'
    requirement-entry-lore: '<dark_gray>▪ <gray>%line%<newline><dark_gray>▪ <gray>Failure message <dark_gray>» <white>%deny%<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to rewrite it<newline><c:good>▸ <gray>Right-click to change the failure message<newline><c:bad>➜ <gray>Shift-click to remove it'
    rule-deny-default: 'the default message'
    rule-unknown: '<c:bad>%index%<dark_gray>. <c:bad>Invalid'
    rule-unknown-lore: '<dark_gray>▪ <gray>%line%<newline><dark_gray>▪ <gray>This line does nothing until it is fixed<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:good>➜ <gray>Click to rewrite it<newline><c:bad>➜ <gray>Shift-click to remove it'
    rule-empty: '<gray>Nothing here yet'
    rule-empty-lore: '<dark_gray>▪ <gray>Click <white>Add</white> below<newline><dark_gray>▪ <gray>Its description lists every option'
    rule-add: '<c:good>✚ Add'
    action-add-lore: '<dark_gray>▪ <gray>Written as <white>type: value<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:accent>▸ <white>message: <gray>a line to the player<newline><c:accent>▸ <white>broadcast: <gray>a line to everyone<newline><c:accent>▸ <white>actionbar: <gray>a line above the hotbar<newline><c:accent>▸ <white>title: <gray>title<dark_gray>;<gray>subtitle<newline><c:accent>▸ <white>sound: <gray>name volume pitch<newline><c:accent>▸ <white>console: <gray>a command run by the console<newline><c:accent>▸ <white>player: <gray>a command run by the player<newline><c:accent>▸ <white>close <gray>closes the menu<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><dark_gray>▪ <gray>Example <dark_gray>» <white>sound: entity.player.levelup 1 1.4<newline><dark_gray>▪ <gray>Colours work: <white>&&a</white> or <white>\<green><newline><dark_gray>▪ <gray>They run in the order listed<newline><c:good>➜ <gray>Click to type one'
    requirement-add-lore: '<dark_gray>▪ <gray>Written as <white>type: value<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><c:accent>▸ <white>permission: <gray>a permission<newline><c:accent>▸ <white>balance: <gray>the minimum balance<newline><c:accent>▸ <white>playtime: <gray>the minimum playtime, in seconds<newline><c:accent>▸ <white>kit: <gray>another kit they must have claimed<newline><c:accent>▸ <white>placeholder: <gray>any PlaceholderAPI value<newline><dark_gray>▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪<newline><dark_gray>▪ <gray>Compare with <white>>=</white> <white>\<=</white> <white>==</white> <white>!=</white> <white>></white> <white>\<</white> <gray>or <white>contains<newline><dark_gray>▪ <gray>Example <dark_gray>» <white>placeholder: %player_level% >= 10<newline><dark_gray>▪ <gray>Example <dark_gray>» <white>balance: 500<newline><dark_gray>▪ <gray>All of them must be met<newline><c:good>➜ <gray>Click to type one'
    rule-back: '<c:accent>« Back'
    rule-back-lore: '<dark_gray>▪ <gray>To <white>%kit%'
    rule-current: '%prefix%<gray>Now <dark_gray>» <white>%line%'
    rule-saved: '%prefix%<gray>Kit <white>%kit%</white>: line saved.'
    rule-removed: '%prefix%<gray>Kit <white>%kit%</white>: line removed.'
    ask-claimaction: '%prefix%<gray>Type what happens when <white>%kit%</white> is claimed, as <white>type: value</white>.<newline><c:accent>▸ <white>message<dark_gray>, <white>broadcast<dark_gray>, <white>actionbar<dark_gray>, <white>title<dark_gray>, <white>sound<dark_gray>, <white>console<dark_gray>, <white>player<dark_gray>, <white>close<newline><c:good>▸ <gray>Example <dark_gray>» <white>message: \<green>Enjoy your kit'
    ask-failaction: '%prefix%<gray>Type what happens when claiming <white>%kit%</white> fails, as <white>type: value</white>.<newline><c:accent>▸ <white>message<dark_gray>, <white>broadcast<dark_gray>, <white>actionbar<dark_gray>, <white>title<dark_gray>, <white>sound<dark_gray>, <white>console<dark_gray>, <white>player<dark_gray>, <white>close<newline><c:good>▸ <gray>Example <dark_gray>» <white>sound: block.note_block.bass 0.5 0.7'
    ask-requirement: '%prefix%<gray>Type a requirement for <white>%kit%</white>, as <white>type: value</white>.<newline><c:accent>▸ <white>permission<dark_gray>, <white>balance<dark_gray>, <white>playtime<dark_gray>, <white>kit<dark_gray>, <white>placeholder<newline><c:accent>▸ <gray>Compare with <white>>=</white> <white>\<=</white> <white>==</white> <white>!=</white> <white>></white> <white>\<</white> <gray>or <white>contains<newline><c:good>▸ <gray>Example <dark_gray>» <white>placeholder: %player_level% >= 10'
    ask-deny: '%prefix%<gray>Type the message a player gets when they do not meet this requirement of <white>%kit%</white>, or <white>none</white> for the default message.'
    bad-action: '%prefix%<c:bad>That is not a valid action.<newline><c:accent>▸ <white>message<dark_gray>, <white>broadcast<dark_gray>, <white>actionbar<dark_gray>, <white>title<dark_gray>, <white>sound<dark_gray>, <white>console<dark_gray>, <white>player<dark_gray>, <white>close<newline><c:good>▸ <gray>Written as <white>type: value<dark_gray>, <gray>for example <white>message: Enjoy your kit'
    bad-requirement: '%prefix%<c:bad>That is not a valid requirement.<newline><c:accent>▸ <white>permission<dark_gray>, <white>balance<dark_gray>, <white>playtime<dark_gray>, <white>kit<dark_gray>, <white>placeholder<newline><c:good>▸ <gray>Written as <white>type: value<dark_gray>, <gray>for example <white>balance: 500'
