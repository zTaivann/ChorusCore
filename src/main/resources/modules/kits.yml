# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   K I T S                                                              │
# │   /kit  /kits  /kitedit                                                │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Every command block reads the `defaults` block first and then its own, so a
# command only writes down what it does differently. See homes.yml for the full
# list of options a command block takes.

# Switches off every command in this file at once.
enabled: true

# ── Settings ──────────────────────────────────────────────────────────────
kits:
  # Given automatically the first time a player ever joins. Empty for none.
  first-join: starter

  # /kits opens a clickable grid instead of printing a line of names.
  menu:
    enabled: true
    rows: 3
    icon: CHEST
    filler: ''
    navigation-filler: GRAY_STAINED_GLASS_PANE
    previous-page: ARROW
    next-page: ARROW
    close: BARRIER

  # ── The kits themselves ─────────────────────────────────────────────────
  #
  #   display           the name shown in /kits, in MiniMessage.
  #   lore              extra lines under that name.
  #   icon              the item it is shown as.
  #   cooldown-seconds  how long before the same player may take it again.
  #   one-time          true means once ever, whatever the cooldown says.
#   max-claims        how many times in total it may ever be taken. 0 is no limit.
#                     Unlike one-time this still honours the cooldown in between.
#   run-as-player     commands run as the player when they take it.
#   run-as-console    commands run as the console when they take it. This is how
#                     a kit hands out something the player could not give
#                     themselves. %player% works in both.
  #   price             what taking it costs, through Vault.
  #   permission        who may take it. Leave it out and it defaults to
  #                     chorus.kits.use.<name>. Set it to '' for everyone.
  #   items             what is in it. Each entry takes:
  #                       material      required, a Bukkit material name
  #                       amount        defaults to 1
  #                       name          renames the item, in MiniMessage
  #                       lore          lines under the item name
  #                       enchantments  vanilla names, for example
  #                                     protection, sharpness, unbreaking.
  #                                     These are the same on every version,
  #                                     unlike the old PROTECTION_ENVIRONMENTAL
  #                                     spellings, so use them.
  #                       unbreakable   true for a tool that never wears out
  #
  # Anything that will not fit in the player's bags lands at their feet.
  #
  # ── Editing kits in game ────────────────────────────────────────────────
  #
  # /kitedit writes back into this file, in exactly the form above, so a kit
  # made in game can still be opened in a text editor afterwards:
  #
  #   /kitedit vip create           makes it out of whatever you are carrying
  #   /kitedit vip items            replaces its items with what you carry now
  #   /kitedit vip icon DIAMOND     how it looks in /kits
  #   /kitedit vip display <gold>VIP
  #   /kitedit vip cooldown 3600
  #   /kitedit vip maxclaims 5
  #   /kitedit vip price 500
  #   /kitedit vip permission chorus.kits.use.vip
  #   /kitedit vip onetime true
  #   /kitedit vip delete
  #
  # Leaving the value off puts a setting back to its default. Items are written
  # in the form above rather than as a block of encoded data, which keeps the
  # file readable and portable between versions; the cost is that anything the
  # form cannot say, such as custom model data, is not carried over. The
  # command says so when it happens.
  # Anything that will not fit in the player's bags lands at their feet.
  definitions:

    starter:
      display: '<green><bold>Starter'
      lore:
        - '<gray>Everything you need to begin'
      icon: LEATHER_CHESTPLATE
      cooldown-seconds: 0
      one-time: true
      price: 0.0
      permission: ''
      items:
        - material: STONE_SWORD
        - material: STONE_PICKAXE
        - material: STONE_AXE
        - material: BREAD
          amount: 16
        - material: LEATHER_CHESTPLATE
          name: '<green>Starter Chestplate'
          lore:
            - '<dark_gray>Welcome to the server'
          enchantments:
            protection: 1
        - material: TORCH
          amount: 32

    daily:
      display: '<gold><bold>Daily'
      lore:
        - '<gray>Once a day, every day'
      icon: GOLD_INGOT
      cooldown-seconds: 86400
      one-time: false
      max-claims: 0
      price: 0.0
      run-as-player: [ ]
      run-as-console: [ ]
      items:
        - material: GOLDEN_APPLE
          amount: 2
        - material: COOKED_BEEF
          amount: 16
        - material: IRON_INGOT
          amount: 8

# ── Commands ──────────────────────────────────────────────────────────────
commands:

  # Everything below inherits this and overrides only what it needs.
  defaults:
    enabled: true
    warmup-seconds: 0
    cooldown-seconds: 0
    price: 0.0
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2
    particle:
      name: ''
      count: 0
      spread: 0.4
      height: 1.8
      speed: 0.02

  # The per-kit cooldown above is the one that matters. This one would stop a
  # player using /kit at all for a while, whichever kit they asked for.
  kit:
    enabled: true
    sound:
      key: entity.player.levelup
      volume: 0.6
      pitch: 1.4

  kits:
    enabled: true
    sound:
      pitch: 1.5

  kitedit:
    enabled: true
    sound:
      key: block.note_block.pling
      volume: 0.5
      pitch: 1.2
