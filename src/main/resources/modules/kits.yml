# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   K I T S                                                              │
# │   /kit  /kits  /kitedit                                                │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Every command block reads the `defaults` block first and then its own, so a
# command only writes down what it does differently. See homes.yml for the full
# list of options a command block takes.

# Switches off every command in this file at once.
enabled: true

# ── Settings ──────────────────────────────────────────────────────────────
kits:
  # Given automatically the first time a player ever joins. Empty for none.
  first-join: starter

  # /kits opens a clickable grid instead of printing a line of names.
  menu:
    enabled: true
    rows: 3
    icon: CHEST
    filler: ''
    navigation-filler: GRAY_STAINED_GLASS_PANE
    previous-page: ARROW
    next-page: ARROW
    close: BARRIER

  # ── The editor screen ───────────────────────────────────────────────────
  #
  # Which block each button in /kitedit is made of. Every one falls back to
  # something that has existed far longer than the oldest version this jar runs
  # on, so a name you leave out can never break the screen.
  editor:
    # Rows in the screen the items are laid out in. 1 to 6.
    item-rows: 4

    filler: ''
    icon: ITEM_FRAME
    lore: BOOK
    items: CHEST
    preview: HOPPER
    cooldown: CLOCK
    max-claims: PAPER
    price: GOLD_INGOT
    permission: NAME_TAG
    enabled: LIME_DYE
    disabled: GRAY_DYE
    requirements: COMPARATOR
    claim-actions: EXPERIENCE_BOTTLE
    fail-actions: FIRE_CHARGE
    add: EMERALD
    new-kit: WRITABLE_BOOK
    back: ARROW
    delete: LAVA_BUCKET
    close: BARRIER

  # ── The kits themselves ─────────────────────────────────────────────────
  #
  #   display           the name shown in /kits. MiniMessage, the old &-codes,
  #                     or both in the same line: '&c&lVIP <gray>kit' works.
  #                     Write && for an & that is not a colour.
  #   lore              extra lines under that name. A line that names no colour
  #                     is drawn grey, not the purple the game falls back to.
  #   icon              the item it is shown as. Either a material name, or the
  #                     same block an item takes, which is what /kitedit writes
  #                     when you drop a real item into the icon slot:
  #
  #                       icon: DIAMOND_SWORD
  #
  #                       icon:
  #                         material: DIAMOND_SWORD
  #                         name: '<gold>VIP Sword'
  #                         enchantments: { sharpness: 5 }
  #   cooldown-seconds  how long before the same player may take it again.
  #   one-time          true means once ever, whatever the cooldown says.
  #   max-claims        how many times in total it may ever be taken. 0 is no limit.
  #                     Unlike one-time this still honours the cooldown in between.
  #   auto-armor        armour goes onto the player instead of into their
  #                     inventory. A slot they have already filled is left alone.
  #   clear-inventory   empties their inventory before handing the kit over.
  #
  #   requirements      what has to be true before they may take it. Each one is
  #                     written type: value, and takes either shape:
  #
  #                       - 'permission: chorus.kits.vip'
  #                       - condition: 'placeholder: %player_level% >= 10'
  #                         deny: '<red>Come back at level 10.'
  #
  #                     The types are permission, placeholder, money, playtime
  #                     (in seconds) and kit (another kit they must have taken).
  #                     placeholder is the one that makes the rest optional:
  #                     anything any plugin exposes through PlaceholderAPI can
  #                     gate a kit, with >=, <=, ==, !=, >, < or contains.
  #                     Without a deny line they get the message from
  #                     messages.yml instead.
  #
  #   claim-actions     what happens when they take it.
  #   fail-actions      what happens when they are refused, whatever the reason.
  #
  #                     Both are written type: value, run in the order listed:
  #
  #                       - 'message: <green>Enjoy your %kit% kit.'
  #                       - 'broadcast: <gray>%player% just claimed %kit%.'
  #                       - 'actionbar: <green>Claimed'
  #                       - 'title: <gold><bold>VIP;<gray>Welcome aboard'
  #                       - 'sound: entity.player.levelup 1 1.4'
  #                       - 'console: lp user %player% parent add vip'
  #                       - 'player: spawn'
  #                       - 'close'
  #
  #                     console runs as the server, which is how a kit hands out
  #                     something the player could not give themselves. It is
  #                     also how a kit could hand out anything at all, so it is
  #                     worth reading twice. %player% and %kit% work in all of
  #                     them, as does anything PlaceholderAPI knows.
  #   price             what taking it costs, through Vault.
  #   permission        who may take it. Leave it out and it defaults to
  #                     chorus.kit.<name>. Set it to '' for everyone.
  #   placeholders      fills %placeholders% into the name and the lore of the
  #                     items themselves, at the moment the kit is handed over:
  #
  #                       placeholders: true
  #                       items:
  #                         - material: DIAMOND_SWORD
  #                           name: '<gold>%player%''s Blade'
  #                           lore:
  #                             - '<gray>Claimed on %date%'
  #
  #                     %player%, %date% and %time% are this plugin's own, and
  #                     anything PlaceholderAPI knows works too when it is
  #                     installed. Off by default, and only the items that
  #                     actually hold a % are rebuilt per player, so leaving it
  #                     on costs a kit of plain items nothing.
  #
  #   items             what is in it. Each entry takes:
  #                       material      required, a Bukkit material name
  #                       amount        defaults to 1
  #                       name          renames the item, in codes or tags
  #                       lore          lines under the item name
  #                       enchantments  vanilla names, for example
  #                                     protection, sharpness, unbreaking.
  #                                     These are the same on every version,
  #                                     unlike the old PROTECTION_ENVIRONMENTAL
  #                                     spellings, so use them.
  #                       unbreakable   true for a tool that never wears out
  #
  # Anything that will not fit in the player's inventory lands at their feet.
  #
  # ── Editing kits in game ────────────────────────────────────────────────
  #
  # /kitedit on its own opens the screen, where every setting above is a button:
  # the icon is set by clicking an item in your inventory, numbers are nudged
  # with the mouse or typed in chat, and the requirements, the claim actions and
  # fail actions each open a screen of their own with one line to an item, so a
  # single action can be rewritten or taken out without touching the rest.
  #
  # /kitedit <kit> <setting> writes back into this file, in exactly the form
  # above, so a kit made in game can still be opened in a text editor:
  #
  #   /kitedit vip create           makes it out of whatever you are carrying
  #   /kitedit vip items            replaces its items with what you carry now
  #   /kitedit vip icon DIAMOND     how it looks in /kits
  #   /kitedit vip display <gold>VIP
  #   /kitedit vip cooldown 3600
  #   /kitedit vip maxclaims 5
  #   /kitedit vip price 500
  #   /kitedit vip permission chorus.kit.vip
  #   /kitedit vip onetime true
  #   /kitedit vip delete
  #
  # Leaving the value off puts a setting back to its default. Items are written
  # in the form above, so anything it cannot describe, such as custom model data,
  # is not carried over. The command says so when it happens.
  # Anything that will not fit in the player's inventory lands at their feet.
  definitions:

    starter:
      display: '<green><bold>Starter'
      lore:
        - '<gray>Everything you need to begin'
      icon: LEATHER_CHESTPLATE
      cooldown-seconds: 0
      one-time: true
      price: 0.0
      permission: ''
      items:
        - material: STONE_SWORD
        - material: STONE_PICKAXE
        - material: STONE_AXE
        - material: BREAD
          amount: 16
        - material: LEATHER_CHESTPLATE
          name: '<green>Starter Chestplate'
          lore:
            - '<dark_gray>Welcome to the server'
          enchantments:
            protection: 1
        - material: TORCH
          amount: 32

    daily:
      display: '<gold><bold>Daily'
      lore:
        - '<gray>Once a day, every day'
      icon: GOLD_INGOT
      cooldown-seconds: 86400
      one-time: false
      max-claims: 0
      price: 0.0
      auto-armor: true
      clear-inventory: false
      placeholders: true
      claim-actions:
        - 'sound: entity.player.levelup 0.6 1.4'
        - 'actionbar: <green>Daily kit claimed'
      fail-actions:
        - 'sound: block.note_block.bass 0.5 0.7'
      items:
        - material: GOLDEN_APPLE
          amount: 2
          name: '&6Daily Apple'
          lore:
            - '&7Claimed by %player%'
            - '&7on %date%'
        - material: COOKED_BEEF
          amount: 16
        - material: IRON_INGOT
          amount: 8

# ── Commands ──────────────────────────────────────────────────────────────
commands:

  # Everything below inherits this and overrides only what it needs.
  defaults:
    enabled: true
    warmup-seconds: 0
    cooldown-seconds: 0
    price: 0.0
    worlds: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2
    particle:
      name: ''
      count: 0
      spread: 0.4
      height: 1.8
      speed: 0.02

  # The per-kit cooldown above is the one that matters. This one would stop a
  # player using /kit at all for a while, whichever kit they asked for.
  kit:
    enabled: true
    sound:
      key: entity.player.levelup
      volume: 0.6
      pitch: 1.4

  kits:
    enabled: true
    sound:
      pitch: 1.5

  kitedit:
    enabled: true
    sound:
      key: block.note_block.pling
      volume: 0.5
      pitch: 1.2

  kitreset:
    enabled: true
    sound:
      key: block.note_block.pling
      volume: 0.5
      pitch: 1.8
