# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   K I T S                                                              │
# │   /kit  /kits  /kitedit                                                │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# ── Command options ───────────────────────────────────────────────────────
#
# Each command uses the `defaults` block plus whatever its own block changes.
#
#   enabled             false disables the command.
#   warmup-seconds      seconds to stand still before a teleport.
#   cooldown-seconds    seconds before the same player can use it again.
#   cooldown-group      commands with the same group share one cooldown.
#   cooldown-scope      who the cooldown applies to: player, world or server.
#   uses-per-day        uses allowed per day. 0 = no limit.
#   uses-reset-at       time the daily uses reset, in quotes: '04:00'.
#   price               price of each use. 0 = free. Needs an economy.
#   discounts           percent off the price for players with a permission. The
#                       biggest one the player has counts.
#                         discounts:
#                           - 'group.vip: 25'
#   price-item          items it also costs, as the item and how many: 'diamond 2'.
#                       '' = none. Renamed or enchanted items do not count.
#   charge-on           when the price is taken: success (once it works) or use
#                       (as soon as it is typed, before the warmup).
#   refund-on-cancel    true gives back a price taken on use if the teleport is
#                       cancelled.
#   worlds              worlds it works in. [ ] = all, [ '!event' ] = all but event.
#   sound               key, volume (0-10) and pitch (0.5-2). Empty key = silent.
#   particle            name (such as PORTAL), count, spread, height and speed.
#   permission          permission needed instead of the usual one. '' = everyone.
#   permission-message  message for players without that permission.
#   messages            messages for this command only, by their key in messages/:
#                         messages:
#                           error.no-permission: '<red>VIP only.'
#   requires            conditions: permission, placeholder, balance, playtime
#                       (seconds) or kit. placeholder compares with >=, <=, ==,
#                       !=, >, < or contains.
#                         requires:
#                           - 'balance: 500'
#                           - condition: 'placeholder: %player_level% >= 10'
#                             deny: '<red>Reach level 10 first.'
#   on-success          actions when the command works.
#   on-fail             actions when the command fails.
#                         on-success:
#                           - 'message: <green>Done.'
#                           - 'actionbar: <green>Done'
#                           - 'title: <gold>Title;<gray>Subtitle'
#                           - 'sound: entity.player.levelup 1 1.4'
#                           - 'broadcast: <gray>%player% used /%command%.'
#                           - 'console: give %player% bread 1'
#                           - 'player: spawn'
#                           - 'close'
#   log                 true saves every use to /stafflog.
#
# Bypass: chorus.teleport.instant (warmup), chorus.bypass.cooldown (cooldown
# and uses-per-day), chorus.bypass.price, chorus.bypass.worlds.

# false disables this whole module.
enabled: true

# ── Settings ──────────────────────────────────────────────────────────────
kits:
  # Kit given on a player's first join. Empty for none.
  first-join: starter

  # false shows /kits as a chat list instead of a menu.
  menu:
    enabled: true
    rows: 3
    icon: CHEST
    filler: ''
    navigation-filler: GRAY_STAINED_GLASS_PANE
    previous-page: ARROW
    next-page: ARROW
    close: BARRIER

  # ── /kitedit menu ───────────────────────────────────────────────────────
  # Item used for each button.
  editor:
    # Rows for the kit's items, 1 to 6.
    item-rows: 4

    filler: ''
    icon: ITEM_FRAME
    lore: BOOK
    items: CHEST
    preview: HOPPER
    cooldown: CLOCK
    max-claims: PAPER
    price: GOLD_INGOT
    permission: NAME_TAG
    enabled: LIME_DYE
    disabled: GRAY_DYE
    requirements: COMPARATOR
    claim-actions: EXPERIENCE_BOTTLE
    fail-actions: FIRE_CHARGE
    add: EMERALD
    new-kit: WRITABLE_BOOK
    back: ARROW
    delete: LAVA_BUCKET
    close: BARRIER

  # ── Kits ────────────────────────────────────────────────────────────────
  #
  #   display           name in /kits. MiniMessage or &-codes; && for a plain &.
  #   lore              lines under the name.
  #   icon              a material, or an item written like the ones in items:
  #                       icon: DIAMOND_SWORD
  #   cooldown-seconds  seconds before the same player can claim it again.
  #   one-time          true = once per player, ever.
  #   max-claims        times a player can claim it in total. 0 = no limit.
  #   auto-armor        puts armour on instead of in the inventory.
  #   clear-inventory   empties the inventory first.
  #   price             price of claiming it.
  #   permission        permission needed. Default chorus.kit.<name>. '' = everyone.
  #   requirements      conditions: permission, placeholder, balance, playtime
  #                     (seconds) or kit. placeholder compares with >=, <=, ==,
  #                     !=, >, < or contains.
  #                       - 'permission: chorus.kits.vip'
  #                       - condition: 'placeholder: %player_level% >= 10'
  #                         deny: '<red>Reach level 10 first.'
  #   claim-actions     actions when the kit is claimed.
  #   fail-actions      actions when claiming it fails.
  #                       - 'message: <green>Enjoy your %kit% kit.'
  #                       - 'broadcast: <gray>%player% claimed %kit%.'
  #                       - 'actionbar: <green>Claimed'
  #                       - 'title: <gold><bold>VIP;<gray>Welcome'
  #                       - 'sound: entity.player.levelup 1 1.4'
  #                       - 'console: lp user %player% parent add vip'
  #                       - 'player: spawn'
  #                       - 'close'
  #   placeholders      true fills %player%, %date%, %time% and PlaceholderAPI
  #                     placeholders in the items' names and lore.
  #   items             each item takes:
  #                       material      required
  #                       amount        default 1
  #                       name
  #                       lore
  #                       enchantments  such as { sharpness: 5, unbreaking: 3 }
  #                       unbreakable   true or false
  #
  # Items that do not fit are dropped at the player's feet.
  #
  # ── Editing in game ─────────────────────────────────────────────────────
  #
  #   /kitedit                          opens the editor menu
  #   /kitedit vip create               creates vip from your inventory
  #   /kitedit vip items                replaces its items with your inventory
  #   /kitedit vip icon DIAMOND
  #   /kitedit vip display <gold>VIP
  #   /kitedit vip cooldown 3600
  #   /kitedit vip maxclaims 5
  #   /kitedit vip price 500
  #   /kitedit vip permission chorus.kit.vip
  #   /kitedit vip onetime true
  #   /kitedit vip delete
  #
  # Without a value the setting goes back to its default. Custom model data is
  # not saved.
  definitions:

    starter:
      display: '<green><bold>Starter'
      lore:
        - '<gray>Everything you need to begin'
      icon: LEATHER_CHESTPLATE
      cooldown-seconds: 0
      one-time: true
      price: 0.0
      permission: ''
      items:
        - material: STONE_SWORD
        - material: STONE_PICKAXE
        - material: STONE_AXE
        - material: BREAD
          amount: 16
        - material: LEATHER_CHESTPLATE
          name: '<green>Starter Chestplate'
          lore:
            - '<dark_gray>Welcome to the server'
          enchantments:
            protection: 1
        - material: TORCH
          amount: 32

    daily:
      display: '<gold><bold>Daily'
      lore:
        - '<gray>Once a day, every day'
      icon: GOLD_INGOT
      cooldown-seconds: 86400
      one-time: false
      max-claims: 0
      price: 0.0
      auto-armor: true
      clear-inventory: false
      placeholders: true
      claim-actions:
        - 'sound: entity.player.levelup 0.6 1.4'
        - 'actionbar: <green>Daily kit claimed'
      fail-actions:
        - 'sound: block.note_block.bass 0.5 0.7'
      items:
        - material: GOLDEN_APPLE
          amount: 2
          name: '&6Daily Apple'
          lore:
            - '&7Claimed by %player%'
            - '&7on %date%'
        - material: COOKED_BEEF
          amount: 16
        - material: IRON_INGOT
          amount: 8

# ── Commands ──────────────────────────────────────────────────────────────
commands:

  defaults:
    enabled: true
    warmup-seconds: 0
    cooldown-seconds: 0
    cooldown-group: ''
    cooldown-scope: player
    uses-per-day: 0
    uses-reset-at: '00:00'
    price: 0.0
    discounts: [ ]
    price-item: ''
    charge-on: success
    refund-on-cancel: true
    worlds: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2
    particle:
      name: ''
      count: 0
      spread: 0.4
      height: 1.8
      speed: 0.02
    permission-message: ''
    requires: [ ]
    on-success: [ ]
    on-fail: [ ]
    log: false

  # A cooldown here applies to /kit for every kit.
  kit:
    enabled: true
    sound:
      key: entity.player.levelup
      volume: 0.6
      pitch: 1.4

  kits:
    enabled: true
    sound:
      pitch: 1.5

  kitedit:
    enabled: true
    sound:
      key: block.note_block.pling
      volume: 0.5
      pitch: 1.2

  kitreset:
    enabled: true
    sound:
      key: block.note_block.pling
      volume: 0.5
      pitch: 1.8
