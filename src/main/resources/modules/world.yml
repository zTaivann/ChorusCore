# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   W O R L D                                                            │
# │   /world  /time  /weather  /spawnmob  /sweep                           │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# The command block options are the same everywhere. modules/utility.yml lists
# them in full.

# Switches off every command in this file at once.
enabled: true

# ── Settings ──────────────────────────────────────────────────────────────
world:
  # On, /world also needs chorus.world.go.<world name>, so a creative or event
  # world can be closed without a second plugin. The name is lower case.
  per-world-permission: false

  # The most mobs one /spawnmob may place at once.
  spawnmob-limit: 20

  # How far /locate looks for a structure, in chunks.
  locate-radius-chunks: 64

  # How far /locate looks for a biome, in blocks.
  #
  # A biome search is worked out on the server thread by sampling the world's noise, and
  # there is no version of it that runs in the background. The interval between samples is
  # worked out from this radius so that a search always costs the same however far it
  # reaches: a wider one steps over more ground, so a small patch of a biome can be stepped
  # past. That is the trade, and it is the right way round.
  #
  # Anything above 3200 is treated as 3200.
  locate-biome-radius-blocks: 400

  # true makes /locate look for structures nobody has been to yet, which is what the
  # vanilla command does and is far more expensive. false finds the nearest one either way.
  # Biomes are not affected: there is no such thing as an unexplored one.
  locate-unexplored: false

  # Clears the ground on a timer, with a warning first. The one piece of housekeeping
  # every busy server ends up asking somebody to do by hand.
  auto-sweep:
    enabled: false

    # How often it runs.
    minutes: 15

    # How long before it happens everybody is told. 0 clears without warning.
    warn-seconds: 30

    # Any of the groups /sweep accepts. drops is the one worth running on a timer.
    target: drops

    # Leave empty for every world, or name the ones to clear.
    worlds: []

# ── Commands ──────────────────────────────────────────────────────────────
commands:

  # Everything below inherits this and overrides only what it needs.
  defaults:
    enabled: true
    warmup-seconds: 0
    cooldown-seconds: 0
    price: 0.0
    worlds: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2
    particle:
      name: ''
      count: 0
      spread: 0.4
      height: 1.8
      speed: 0.02

  world:
    enabled: true
    warmup-seconds: 3
    cooldown-seconds: 10
    sound:
      key: entity.enderman.teleport
      volume: 0.7
      pitch: 1.0
    particle:
      name: PORTAL
      count: 40
      height: 2.0
      speed: 0.05

  time:
    enabled: true
    sound:
      key: block.note_block.chime
      volume: 0.6
      pitch: 1.4

  weather:
    enabled: true
    sound:
      key: item.bucket.empty
      volume: 0.6
      pitch: 1.2

  spawnmob:
    enabled: true
    sound:
      key: entity.chicken.egg
      volume: 0.6
      pitch: 1.0

  # Clearing a whole world at once asks for a second press first. The window is
  # set in config.yml.
  sweep:
    enabled: true
    cooldown-seconds: 5
    sound:
      key: entity.generic.explode
      volume: 0.4
      pitch: 1.6

  tree:
    enabled: true
    cooldown-seconds: 3
    sound:
      key: block.grass.place
      volume: 0.6
      pitch: 1.0

  spawner:
    enabled: true
    sound:
      key: block.note_block.pling
      volume: 0.5
      pitch: 0.8

  unlimited:
    enabled: true

  # Ten seconds between searches: one of these is not free, and holding the key down
  # would be a way to stall the server from chat.
  locate:
    enabled: true
    cooldown-seconds: 10
    sound:
      key: block.lever.click
      volume: 0.5
      pitch: 1.4
