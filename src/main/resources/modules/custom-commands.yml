# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   C U S T O M   C O M M A N D S                                        │
# │   the /discord and /rules of your server                               │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Adding, renaming or removing a command, or changing its aliases, needs a
# restart. Other changes apply with /chorus reload.
#
#   description         shown in /help.
#   permission          permission needed. Empty = everyone.
#   permission-message  message for players without it.
#   aliases             other names.
#   cooldown-seconds    seconds before the same player can use it again.
#   cooldown-group      commands with the same group share one cooldown.
#   cooldown-scope      who the cooldown applies to: player, world or server.
#   uses-per-day        uses allowed per day. 0 = no limit.
#   uses-reset-at       time the daily uses reset, in quotes: '04:00'.
#   messages            lines sent to the player. %prefix% and %player% work.
#   run-as-player       commands run by the player.
#   run-as-console      commands run by the console.
#   sound               sound played to the player.
#   requires            conditions, as on any command (see modules/homes.yml).
#   on-success          actions when it runs, as on any command.
#   on-fail             actions when it fails.
#   log                 true saves every use to /stafflog.

# false disables every command in this file.
enabled: true

# ── The commands ──────────────────────────────────────────────────────────
custom:

  discord:
    description: Shows the Discord invite.
    permission: ''
    aliases: [ dc ]
    cooldown-seconds: 0
    messages:
      - '%prefix%<gray>Come talk to us:'
      - '<dark_gray>   ▪ <aqua><underlined>discord.gg/yourserver'
    run-as-player: [ ]
    run-as-console: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.4

  rules:
    description: Shows the server rules.
    permission: ''
    aliases: [ rule ]
    cooldown-seconds: 0
    messages:
      - '%prefix%<gray>Rules:'
      - '<dark_gray>   ▪ <gray>Be decent to each other'
      - '<dark_gray>   ▪ <gray>No cheating'
      - '<dark_gray>   ▪ <gray>No griefing'
    run-as-player: [ ]
    run-as-console: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2

  # Example with every option.
  website:
    description: Shows the website.
    permission: ''
    permission-message: ''
    aliases: [ web ]
    cooldown-seconds: 5
    cooldown-group: ''
    cooldown-scope: player
    uses-per-day: 0
    uses-reset-at: '00:00'
    messages:
      - '%prefix%<gray>Find us at <aqua><underlined>example.com'
    run-as-player: [ ]
    run-as-console: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2
    requires: [ ]
    on-success:
      - 'actionbar: <gray>The link is in your chat.'
    on-fail: [ ]
    log: false
