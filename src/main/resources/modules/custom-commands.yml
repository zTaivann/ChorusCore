# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   C U S T O M   C O M M A N D S                                        │
# │   the /discord and /rules of your server                               │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Commands you invent here are registered when the server starts, so adding,
# renaming or removing one, or changing its aliases, needs a restart rather
# than /chorus reload. Editing what an existing one says or does is picked up
# on reload.
#
# Each command takes:
#
#   description       shown in /help.
#   permission        who may use it. Empty means everyone.
#   permission-message
#                     what somebody without it is told. Empty keeps the usual line.
#   aliases           extra names for it.
#   cooldown-seconds  how long before the same player may repeat it.
#                     chorus.bypass.cooldown ignores it.
#   messages          lines sent to whoever ran it, in MiniMessage.
#                     %prefix% and %player% both work.
#   run-as-player     commands run as the player, with their permissions.
#   run-as-console    commands run as the console, with full permissions.
#                     Be careful: this is how you let a player trigger
#                     something they could not do themselves.
#   sound             played to the player who ran it.
#   requires          what has to be true first, such as 'money: 100' or
#                     'placeholder: %player_level% >= 10'.
#   on-success        actions once it has run, such as 'title: <gold>Hi'.
#   on-fail           actions when it is refused: no permission, a
#                     requirement or the cooldown.
#   log               true writes every use into the staff log (/stafflog).
#
# requires, on-success and on-fail are written the same way as on any other
# command; modules/homes.yml explains every type. %player% and %command% work
# in the actions.
#
# A command with no messages, no commands to run and no on-success actions is
# skipped with a warning, since it would do nothing at all.

# Switches off every command in this file at once.
enabled: true

# ── The commands ──────────────────────────────────────────────────────────
custom:

  discord:
    description: Shows the Discord invite.
    permission: ''
    aliases: [ dc ]
    cooldown-seconds: 0
    messages:
      - '%prefix%<gray>Come talk to us:'
      - '<dark_gray>   ▪ <aqua><underlined>discord.gg/yourserver'
    run-as-player: [ ]
    run-as-console: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.4

  rules:
    description: Shows the server rules.
    permission: ''
    aliases: [ rule ]
    cooldown-seconds: 0
    messages:
      - '%prefix%<gray>Rules:'
      - '<dark_gray>   ▪ <gray>Be decent to each other'
      - '<dark_gray>   ▪ <gray>No cheating'
      - '<dark_gray>   ▪ <gray>No griefing'
    run-as-player: [ ]
    run-as-console: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2

  # An example with every option written out. The actionbar comes from
  # on-success. Delete it if you do not want it.
  website:
    description: Shows the website.
    permission: ''
    permission-message: ''
    aliases: [ web ]
    cooldown-seconds: 5
    messages:
      - '%prefix%<gray>Find us at <aqua><underlined>example.com'
    run-as-player: [ ]
    run-as-console: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2
    requires: [ ]
    on-success:
      - 'actionbar: <gray>The link is in your chat.'
    on-fail: [ ]
    log: false
