# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   P L A Y E R S                                                        │
# │   /afk  /seen  /playtime  /whois  /list  /ptime  /pweather             │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# ── How a command block works ──────────────────────────────────────────────
#
# Every command reads the `defaults` block first and then its own, so a command
# only writes down what it does differently. Add any of these options to any
# command to override it:
#
#   enabled           false makes the command answer that it is switched off.
#                     The `enabled` at the top of this file does the same for
#                     the whole module at once.
#
#   warmup-seconds    how long the player stands still before the teleport
#                     happens. Only means anything for commands that teleport.
#                     Moving or taking damage during the wait cancels it and
#                     nothing is charged. chorus.teleport.instant skips it.
#
#   cooldown-seconds  how long before that player may use the command again.
#                     Only starts once the command actually succeeded.
#                     chorus.bypass.cooldown ignores it.
#
#   cooldown-group    a name for commands that wait as one. Using any command in
#                     the group starts the wait for all of them, for as long as
#                     the one used says. It works across files, so /home, /warp
#                     and /spawn can share one wait:
#
#                       home:
#                         cooldown-seconds: 30
#                         cooldown-group: travel
#
#                     A command with no cooldown-seconds takes no part. Empty
#                     keeps the command's own wait.
#
#   price             what it costs, through Vault. 0 is free. Without an
#                     economy plugin the price is ignored.
#                     chorus.bypass.price never pays.
#
#   worlds            the worlds the command works in. An empty list is everywhere.
#                     A name on its own is the only place it works; a name with !
#                     in front is the one place it does not:
#                       worlds: [ world, world_nether ]   only those two
#                       worlds: [ '!event' ]              everywhere but there
#                     chorus.bypass.worlds ignores it.
#
#   sound.key         a Minecraft sound name, for example entity.enderman.teleport.
#                     Empty for silence. A name the client does not know simply
#                     plays nothing, so a typo can never break anything.
#   sound.volume      0 to 10. Doubles as the distance others hear it from.
#   sound.pitch       0.5 to 2. Higher is squeakier.
#
#   particle.name     a Bukkit particle name, for example PORTAL. Empty for none.
#                     Mojang renamed several of these, so both the old and the
#                     new spelling are accepted and the right one is picked for
#                     your version. Safe on every supported version: PORTAL,
#                     REVERSE_PORTAL, FLAME, SOUL_FIRE_FLAME, CLOUD, END_ROD,
#                     DRAGON_BREATH, HEART, CRIT, ELECTRIC_SPARK, GLOW, NOTE,
#                     SNOWFLAKE, ASH.
#   particle.count    how many. 0 means none.
#   particle.spread   how far they scatter sideways, in blocks.
#   particle.height   how tall the burst is, in blocks.
#   particle.speed    how fast they drift. Keep it small.
#
#   messages          lines this command says instead of the ones in the messages
#                     folder, by the same keys. A blank one silences that line:
#
#                       messages:
#                         error.no-permission: '<red>Buy VIP to use this.'
#
#   permission        the permission it takes, in place of its own. '' lets
#                     everyone use it. Set it on a command, not in defaults.
#                     Extras such as the .others node keep their own names.
#   permission-message
#                     what somebody without that permission is told. Empty
#                     keeps the line from the messages folder.
#
#   requires          what has to be true before the command runs. Each one is
#                     written type: value, and takes either shape:
#
#                       requires:
#                         - 'money: 500'
#                         - condition: 'placeholder: %player_level% >= 10'
#                           deny: '<red>Come back at level 10.'
#
#                     The types are permission, placeholder, money, playtime
#                     (in seconds) and kit (a kit they must have taken).
#                     placeholder takes anything PlaceholderAPI knows, compared
#                     with >=, <=, ==, !=, >, < or contains. Without a deny line
#                     they get error.command-requirement from the messages folder.
#
#   on-success        what happens once the command has worked. For a teleport
#                     that is on arrival.
#   on-fail           what happens when it is refused: no permission, the wrong
#                     world, a requirement, the cooldown or the price.
#
#                     Both are written type: value, run in the order listed:
#
#                       on-success:
#                         - 'message: <green>Done.'
#                         - 'actionbar: <green>Done'
#                         - 'title: <gold>Welcome;<gray>back'
#                         - 'sound: entity.player.levelup 1 1.4'
#                         - 'broadcast: <gray>%player% used /%command%.'
#                         - 'console: give %player% bread 1'
#                         - 'player: spawn'
#                         - 'close'
#
#                     console runs as the server. %player% and %command% work in
#                     all of them, as does anything PlaceholderAPI knows.
#
#   log               true writes every use into the staff log, with whatever
#                     was typed after the command. Read it with /stafflog.
#                     Needs staff-log.enabled in config.yml.
#
# Teleport commands show their particles twice: once where the player left from
# and once where they arrive.

# Switches off every command in this file at once.
enabled: true

# ── Settings ──────────────────────────────────────────────────────────────
players:
  # Minutes of standing still before a player is marked away on their own.
  # 0 turns it off and leaves /afk as the only way in.
  auto-afk-minutes: 5

  # Minutes away before an away player is disconnected. 0 never kicks anyone.
  kick-after-minutes: 0

  # Tell everyone else when somebody goes away or comes back.
  broadcast: true

  # The longest a nickname may be, counting letters rather than colour codes.
  max-nick-length: 16

  # Adds the country to /whois, for whoever holds chorus.players.whois.ip.
  #
  # There is no country in a player.s connection. The only way to know is to ask a service
  # outside this server, which means sending that player.s address to it. That is a real
  # decision, so it is off until you turn it on. Answers are kept until the next restart.
  geoip:
    enabled: false
    endpoint: 'https://ipapi.co/%address%/country_name/'

# ── Commands ──────────────────────────────────────────────────────────────
commands:

  # Everything below inherits this and overrides only what it needs.
  defaults:
    enabled: true
    warmup-seconds: 0
    cooldown-seconds: 0
    cooldown-group: ''
    price: 0.0
    worlds: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2
    particle:
      name: ''
      count: 0
      spread: 0.4
      height: 1.8
      speed: 0.02
    permission-message: ''
    requires: [ ]
    on-success: [ ]
    on-fail: [ ]
    log: false

  # /playtime reads the figure the server already keeps, the same one the
  # vanilla statistics screen shows. It counts this server, not a whole network.
  afk:
    enabled: true
    sound:
      key: block.note_block.bass
      volume: 0.5
      pitch: 1.0

  seen:
    enabled: true
    sound:
      volume: 0.4
      pitch: 1.5

  playtime:
    enabled: true
    sound:
      volume: 0.4
      pitch: 1.5


  whois:
    enabled: true
    sound:
      volume: 0.4
      pitch: 1.5

  list:
    enabled: true
    sound:
      volume: 0.4
      pitch: 1.5

  # /ptime and /pweather only change what one client is shown. The world keeps
  # its own time and weather, and so does everybody standing next to them.
  ptime:
    enabled: true
    sound:
      key: block.amethyst_block.chime
      volume: 0.5
      pitch: 1.2

  pweather:
    enabled: true
    sound:
      key: block.amethyst_block.chime
      volume: 0.5
      pitch: 0.9

  nick:
    enabled: true
    sound:
      key: block.note_block.pling
      volume: 0.5
      pitch: 1.6

  realname:
    enabled: true
    sound:
      volume: 0.4
      pitch: 1.6
