# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   H O M E S                                                            │
# │   /home  /sethome  /delhome  /homes  /renamehome  /homeicon            │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# ── Command options ───────────────────────────────────────────────────────
#
# Each command uses the `defaults` block plus whatever its own block changes.
#
#   enabled             false disables the command.
#   warmup-seconds      seconds to stand still before a teleport.
#   cooldown-seconds    seconds before the same player can use it again.
#   cooldown-group      commands with the same group share one cooldown.
#   cooldown-scope      who the cooldown applies to: player, world or server.
#   uses-per-day        uses allowed per day. 0 = no limit.
#   uses-reset-at       time the daily uses reset, in quotes: '04:00'.
#   price               price of each use. 0 = free. Needs an economy.
#   discounts           percent off the price for players with a permission. The
#                       biggest one the player has counts.
#                         discounts:
#                           - 'group.vip: 25'
#   price-item          items it also costs, as the item and how many: 'diamond 2'.
#                       '' = none. Renamed or enchanted items do not count.
#   charge-on           when the price is taken: success (once it works) or use
#                       (as soon as it is typed, before the warmup).
#   refund-on-cancel    true gives back a price taken on use if the teleport is
#                       cancelled.
#   worlds              worlds it works in. [ ] = all, [ '!event' ] = all but event.
#   sound               key, volume (0-10) and pitch (0.5-2). Empty key = silent.
#   particle            name (such as PORTAL), count, spread, height and speed.
#   permission          permission needed instead of the usual one. '' = everyone.
#   permission-message  message for players without that permission.
#   messages            messages for this command only, by their key in messages/:
#                         messages:
#                           error.no-permission: '<red>VIP only.'
#   requires            conditions: permission, placeholder, balance, playtime
#                       (seconds) or kit. placeholder compares with >=, <=, ==,
#                       !=, >, < or contains.
#                         requires:
#                           - 'balance: 500'
#                           - condition: 'placeholder: %player_level% >= 10'
#                             deny: '<red>Reach level 10 first.'
#   on-success          actions when the command works.
#   on-fail             actions when the command fails.
#                         on-success:
#                           - 'message: <green>Done.'
#                           - 'actionbar: <green>Done'
#                           - 'title: <gold>Title;<gray>Subtitle'
#                           - 'sound: entity.player.levelup 1 1.4'
#                           - 'broadcast: <gray>%player% used /%command%.'
#                           - 'console: give %player% bread 1'
#                           - 'player: spawn'
#                           - 'close'
#   log                 true saves every use to /stafflog.
#
# Bypass: chorus.teleport.instant (warmup), chorus.bypass.cooldown (cooldown
# and uses-per-day), chorus.bypass.price, chorus.bypass.worlds.

# false disables this whole module.
enabled: true

# ── Settings ──────────────────────────────────────────────────────────────
homes:
  # Home name used when none is typed.
  default-name: home

  # With only one home, /home goes to it whatever its name.
  fallback-to-only-home: true

  # Homes per player. More with chorus.home.limit.<number> (the highest wins).
  # chorus.home.unlimited removes the limit.
  default-limit: 3

  # Letters, numbers, - and _ only.
  max-name-length: 16

  # Extra price of /sethome for each home the player already has. 0 = none.
  price-per-home: 0.0

  # Limit per world, on top of default-limit.
  world-limits:
    world_nether: 1
    world_the_end: 1

  # false shows /homes as a chat list instead of a menu.
  menu:
    enabled: true
    # 2 to 6. The last row holds the page buttons.
    rows: 3
    icon: LIME_BED
    # Background item. Empty for none.
    filler: ''
    # Background of the button row.
    navigation-filler: GRAY_STAINED_GLASS_PANE
    previous-page: ARROW
    next-page: ARROW
    close: BARRIER

# ── Commands ──────────────────────────────────────────────────────────────
commands:

  defaults:
    enabled: true
    warmup-seconds: 0
    cooldown-seconds: 0
    cooldown-group: ''
    cooldown-scope: player
    uses-per-day: 0
    uses-reset-at: '00:00'
    price: 0.0
    discounts: [ ]
    price-item: ''
    charge-on: success
    refund-on-cancel: true
    worlds: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2
    particle:
      name: ''
      count: 0
      spread: 0.4
      height: 1.8
      speed: 0.02
    permission-message: ''
    requires: [ ]
    on-success: [ ]
    on-fail: [ ]
    log: false

  home:
    enabled: true
    sound:
      key: entity.enderman.teleport
      volume: 0.7
      pitch: 1.2
    particle:
      name: PORTAL
      count: 45
      height: 2.0
      speed: 0.04

  sethome:
    enabled: true
    sound:
      key: entity.experience_orb.pickup
      volume: 0.7
      pitch: 1.4

  delhome:
    enabled: true
    sound:
      key: block.note_block.bass
      volume: 0.7
      pitch: 0.8

  homes:
    enabled: true
    sound:
      pitch: 1.5


  renamehome:
    enabled: true
    sound:
      volume: 0.5
      pitch: 1.3

  homeicon:
    enabled: true
    sound:
      key: entity.item.pickup
      volume: 0.5
      pitch: 1.4
