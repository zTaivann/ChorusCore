# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   H O M E S                                                            │
# │   /home  /sethome  /delhome  /homes  /renamehome  /homeicon            │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# ── How a command block works ──────────────────────────────────────────────
#
# Every command reads the `defaults` block first and then its own, so a command
# only writes down what it does differently. Add any of these options to any
# command to override it:
#
#   enabled           false makes the command answer that it is switched off.
#                     The `enabled` at the top of this file does the same for
#                     the whole module at once.
#
#   warmup-seconds    how long the player stands still before the teleport
#                     happens. Only means anything for commands that teleport.
#                     Moving or taking damage during the wait cancels it and
#                     nothing is charged. chorus.teleport.instant skips it.
#
#   cooldown-seconds  how long before that player may use the command again.
#                     Only starts once the command actually succeeded.
#                     chorus.bypass.cooldown ignores it.
#
#   price             what it costs, through Vault. 0 is free. Without an
#                     economy plugin the price is ignored.
#                     chorus.bypass.price never pays.
#
#   worlds            the worlds the command works in. An empty list is everywhere.
#                     A name on its own is the only place it works; a name with !
#                     in front is the one place it does not:
#                       worlds: [ world, world_nether ]   only those two
#                       worlds: [ '!event' ]              everywhere but there
#                     chorus.bypass.worlds ignores it.
#
#   sound.key         a Minecraft sound name, for example entity.enderman.teleport.
#                     Empty for silence. A name the client does not know simply
#                     plays nothing, so a typo can never break anything.
#   sound.volume      0 to 10. Doubles as the distance others hear it from.
#   sound.pitch       0.5 to 2. Higher is squeakier.
#
#   particle.name     a Bukkit particle name, for example PORTAL. Empty for none.
#                     Mojang renamed several of these, so both the old and the
#                     new spelling are accepted and the right one is picked for
#                     your version. Safe on every supported version: PORTAL,
#                     REVERSE_PORTAL, FLAME, SOUL_FIRE_FLAME, CLOUD, END_ROD,
#                     DRAGON_BREATH, HEART, CRIT, ELECTRIC_SPARK, GLOW, NOTE,
#                     SNOWFLAKE, ASH.
#   particle.count    how many. 0 means none.
#   particle.spread   how far they scatter sideways, in blocks.
#   particle.height   how tall the burst is, in blocks.
#   particle.speed    how fast they drift. Keep it small.
#
#   messages          lines this command says instead of the ones in the messages
#                     folder, by the same keys. A blank one silences that line:
#
#                       messages:
#                         error.no-permission: '<red>Buy VIP to use this.'
#
# Teleport commands show their particles twice: once where the player left from
# and once where they arrive.

# Switches off every command in this file at once.
enabled: true

# ── Settings ──────────────────────────────────────────────────────────────
homes:
  # Used when /home or /sethome is typed with no name.
  default-name: home

  # When a player has exactly one home and types a bare /home, go to that home
  # even if it is not called 'home'. Off means always use default-name.
  fallback-to-only-home: true

  # Homes for a player with no limit permission.
  # Grant more with chorus.home.limit.<number>, for example chorus.home.limit.10
  # The highest number a player holds wins. chorus.home.unlimited removes the cap.
  # A wildcard such as chorus.home.limit.* carries no number and cannot raise it.
  default-limit: 3

  # Names accept letters, numbers, hyphens and underscores.
  max-name-length: 16

  # Added to the price of /sethome for every home the player already has, so the
  # first is whatever the command block says and each one after costs more.
  # 0 turns it off. Moving a home you already have is never surcharged.
  price-per-home: 0.0

  # A cap for one world on top of the overall one, for the worlds where homes
  # should be rare. A world that is not listed has no cap of its own.
  world-limits:
    world_nether: 1
    world_the_end: 1

  # /homes opens a clickable grid instead of printing a line of names.
  menu:
    enabled: true
    # 2 to 6. The bottom row is always navigation, so 3 rows shows 18 a page.
    rows: 3
    # The item each home is shown as.
    icon: LIME_BED
    # Fills the content area. Leave empty for a plain window.
    filler: ''
    # Fills the navigation row, to set it apart from the entries above.
    navigation-filler: GRAY_STAINED_GLASS_PANE
    previous-page: ARROW
    next-page: ARROW
    close: BARRIER

# ── Commands ──────────────────────────────────────────────────────────────
commands:

  # Everything below inherits this and overrides only what it needs.
  defaults:
    enabled: true
    warmup-seconds: 0
    cooldown-seconds: 0
    price: 0.0
    worlds: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2
    particle:
      name: ''
      count: 0
      spread: 0.4
      height: 1.8
      speed: 0.02

  home:
    enabled: true
    sound:
      key: entity.enderman.teleport
      volume: 0.7
      pitch: 1.2
    particle:
      name: PORTAL
      count: 45
      height: 2.0
      speed: 0.04

  sethome:
    enabled: true
    sound:
      key: entity.experience_orb.pickup
      volume: 0.7
      pitch: 1.4

  delhome:
    enabled: true
    sound:
      key: block.note_block.bass
      volume: 0.7
      pitch: 0.8

  homes:
    enabled: true
    sound:
      pitch: 1.5


  renamehome:
    enabled: true
    sound:
      volume: 0.5
      pitch: 1.3

  homeicon:
    enabled: true
    sound:
      key: entity.item.pickup
      volume: 0.5
      pitch: 1.4
