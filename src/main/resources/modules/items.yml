# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   I T E M S                                                            │
# │   /hat  /condense  /clearinventory  /itemname  /lore  /more  /skull    │
# │   /unbreakable  /glow  /enchant  /stack                                │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# ── Command options ───────────────────────────────────────────────────────
#
# Each command uses the `defaults` block plus whatever its own block changes.
#
#   enabled             false disables the command.
#   warmup-seconds      seconds to stand still before a teleport.
#   cooldown-seconds    seconds before the same player can use it again.
#   cooldown-group      commands with the same group share one cooldown.
#   cooldown-scope      who the cooldown applies to: player, world or server.
#   uses-per-day        uses allowed per day. 0 = no limit.
#   uses-reset-at       time the daily uses reset, in quotes: '04:00'.
#   price               price of each use. 0 = free. Needs an economy.
#   discounts           percent off the price for players with a permission. The
#                       biggest one the player has counts.
#                         discounts:
#                           - 'group.vip: 25'
#   price-item          items it also costs, as the item and how many: 'diamond 2'.
#                       '' = none. Renamed or enchanted items do not count.
#   charge-on           when the price is taken: success (once it works) or use
#                       (as soon as it is typed, before the warmup).
#   refund-on-cancel    true gives back a price taken on use if the teleport is
#                       cancelled.
#   worlds              worlds it works in. [ ] = all, [ '!event' ] = all but event.
#   sound               key, volume (0-10) and pitch (0.5-2). Empty key = silent.
#   particle            name (such as PORTAL), count, spread, height and speed.
#   permission          permission needed instead of the usual one. '' = everyone.
#   permission-message  message for players without that permission.
#   messages            messages for this command only, by their key in messages/:
#                         messages:
#                           error.no-permission: '<red>VIP only.'
#   requires            conditions: permission, placeholder, balance, playtime
#                       (seconds) or kit. placeholder compares with >=, <=, ==,
#                       !=, >, < or contains.
#                         requires:
#                           - 'balance: 500'
#                           - condition: 'placeholder: %player_level% >= 10'
#                             deny: '<red>Reach level 10 first.'
#   on-success          actions when the command works.
#   on-fail             actions when the command fails.
#                         on-success:
#                           - 'message: <green>Done.'
#                           - 'actionbar: <green>Done'
#                           - 'title: <gold>Title;<gray>Subtitle'
#                           - 'sound: entity.player.levelup 1 1.4'
#                           - 'broadcast: <gray>%player% used /%command%.'
#                           - 'console: give %player% bread 1'
#                           - 'player: spawn'
#                           - 'close'
#   log                 true saves every use to /stafflog.
#
# Bypass: chorus.teleport.instant (warmup), chorus.bypass.cooldown (cooldown
# and uses-per-day), chorus.bypass.price, chorus.bypass.worlds.

# chorus.items.format lets players use colours in /itemname and /lore.

# false disables this whole module.
enabled: true

# ── Settings ──────────────────────────────────────────────────────────────
items:
  # Most lore lines per item.
  max-lore-lines: 10

  # /condense: 9 of the left item become 1 of the right. Named, enchanted or
  # damaged items are skipped.
  condense:
    IRON_INGOT: IRON_BLOCK
    GOLD_INGOT: GOLD_BLOCK
    DIAMOND: DIAMOND_BLOCK
    EMERALD: EMERALD_BLOCK
    NETHERITE_INGOT: NETHERITE_BLOCK
    COPPER_INGOT: COPPER_BLOCK
    LAPIS_LAZULI: LAPIS_BLOCK
    REDSTONE: REDSTONE_BLOCK
    COAL: COAL_BLOCK
    RAW_IRON: RAW_IRON_BLOCK
    RAW_GOLD: RAW_GOLD_BLOCK
    RAW_COPPER: RAW_COPPER_BLOCK
    WHEAT: HAY_BLOCK
    SLIME_BALL: SLIME_BLOCK
    BONE_MEAL: BONE_BLOCK

  # ── Restrictions ────────────────────────────────────────────────────────
  # Limits on /give, /more and /enchant. chorus.bypass.restrictions ignores them.
  restrictions:
    # Items /give and /more cannot give.
    blocked-items: [ ]

    # Each item also needs chorus.items.give.item.<name>, such as
    # chorus.items.give.item.diamond_sword.
    permission-per-item: false

    # Enchantments /enchant cannot add, such as mending or silk_touch.
    blocked-enchantments: [ ]

    # Each enchantment also needs chorus.items.enchant.<name>.
    permission-per-enchantment: false

    # false blocks levels above the normal maximum, even with
    # chorus.items.enchant.unsafe.
    unsafe-enchantments: true

# ── Inventory backups ─────────────────────────────────────────────────────
# Backups of a player's inventory, ender chest, experience, health and hunger.
# /restore [player] lists them.
backups:
  enabled: true

  # Backups older than this are deleted. 0 = never.
  keep-days: 14

  # Backups kept per player. 0 = no limit.
  keep-per-player: 20

  # When a backup is made.
  on:
    death: true
    join: true
    quit: true
    world: true
    clear: true
    kit: true
    manual: true

  # /restore menu. rows includes the button row.
  menu:
    rows: 6
    filler: ''
    navigation-filler: GRAY_STAINED_GLASS_PANE
    previous-page: ARROW
    next-page: ARROW
    close: BARRIER

# ── Commands ──────────────────────────────────────────────────────────────
commands:

  defaults:
    enabled: true
    warmup-seconds: 0
    cooldown-seconds: 0
    cooldown-group: ''
    cooldown-scope: player
    uses-per-day: 0
    uses-reset-at: '00:00'
    price: 0.0
    discounts: [ ]
    price-item: ''
    charge-on: success
    refund-on-cancel: true
    worlds: [ ]
    sound:
      key: ui.button.click
      volume: 0.5
      pitch: 1.2
    particle:
      name: ''
      count: 0
      spread: 0.4
      height: 1.8
      speed: 0.02
    permission-message: ''
    requires: [ ]
    on-success: [ ]
    on-fail: [ ]
    log: false

  hat:
    enabled: true
    sound:
      key: item.armor.equip_leather
      volume: 0.7
      pitch: 1.2

  condense:
