# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   M E N S A J E S   ·   E S P A Ñ O L                                  │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Este archivo solo escribe lo que traduce. Cualquier línea que falte se toma de
# messages.yml, así que nunca queda desactualizado: si una versión nueva agrega
# mensajes, salen en inglés hasta que alguien los traduzca, y nada se rompe
# mientras tanto.
#
# Por eso aquí no están las líneas que son pura decoración, como los separadores
# o los encabezados que solo llevan un %marcador%: no hay nada que traducir en
# ellas y se toman del archivo en inglés tal cual.
#
# Se activa en config.yml:
#
#   language:
#     default: es          todos lo leen
#     per-player: true     cada quien lee el idioma de su cliente
#
# Los %marcadores% y las etiquetas <color> tienen que quedar exactamente igual.
# Una línea vacía ('') no se envía.

