# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   C H O R U S   C O R E                                                │
# │   storage  -  economy  -  staff log                                    │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Other files:
#
#   aliases.yml           command aliases
#   palette.yml           colour names used in messages and menus
#   messages/             every message, one file per module
#   messages/menus.yml    menu text
#   messages/es/          Spanish translation
#   modules/              one file per module, with its commands
#
# /chorus reload reloads everything except storage and aliases.yml, which need
# a restart.

# ── Startup ───────────────────────────────────────────────────────────────
# false prints a single line at startup instead of the banner.
startup-banner: true

# ── Storage ───────────────────────────────────────────────────────────────
storage:
  # sqlite or mysql (MySQL or MariaDB).
  type: sqlite

  # sqlite only. Relative to plugins/ChorusCore/.
  file: chorus.db

  # mysql only.
  mysql:
    host: localhost
    port: 3306
    database: chorus
    username: root
    password: ''
    pool-size: 8
    # Added to the connection URL.
    properties:
      useSSL: false
      characterEncoding: utf8

# ── Backups ───────────────────────────────────────────────────────────────
# /chorus backup writes one zip with the database (SQLite only; a MySQL or
# MariaDB database is not copied), the configs and the messages.
backup:
  # Relative to plugins/ChorusCore/.
  folder: backups

  # Zips older than this are deleted after each backup. 0 keeps them all.
  keep-days: 14

# ── Economy ───────────────────────────────────────────────────────────────
economy:
  # false disables prices, /pay and /balance.
  enabled: true

  # Where balances are kept.
  #   auto   ChorusCore, or another economy plugin through Vault if there is one.
  #   self   always ChorusCore.
  #   vault  only another economy plugin through Vault.
  #   off    same as enabled: false.
  provider: auto

  # Balance of a player who joins for the first time. More with
  # chorus.economy.starting.<amount> (the highest wins).
  starting-balance: 0.0
  minimum-balance: 0.0
  maximum-balance: 1000000000000.0

  # Only used when ChorusCore keeps the balances.
  currency:
    symbol: "$"
    # true writes 100$ instead of $100.
    suffix: false
    # 0 to 4.
    decimals: 2
    # 1,234.50 by default. For 1.234,50 swap them. '' writes no thousands separator.
    thousands-separator: ','
    decimal-separator: '.'
    # true writes large amounts short: 1.5K, 2.25M. Typing 5k or 2m works either way.
    short-form: false
    # Letters for thousands, millions, billions and trillions.
    short-units: [ K, M, B, T ]
    singular: coin
    plural: coins

# ── Language ──────────────────────────────────────────────────────────────
# A language is a folder in messages/, such as messages/es/. Lines it does not
# translate are shown in English.
language:
  # Folder name of the language everyone gets. Empty is English.
  default: ''

  # true gives each player the language of their Minecraft client when there
  # is a folder for it.
  per-player: false

# ── Confirmations ─────────────────────────────────────────────────────────
confirmations:
  # Seconds to type a command again to confirm it. Applies to /clearinventory,
  # /delhome, /delwarp, /sweep of a whole world and large payments (see
  # modules/economy.yml). 0 asks for no confirmation.
  # chorus.bypass.confirm skips it.
  seconds: 0

# ── Metrics ───────────────────────────────────────────────────────────────
# Anonymous usage stats on bStats.
metrics: true

# ── Staff log ─────────────────────────────────────────────────────────────
# Records /freeze, /sudo, /lockdown, /tempfly, notes, /eco and every command
# with log: true. Read it with /stafflog.
staff-log:
  enabled: true

  # Entries older than this are deleted at startup. 0 keeps them forever.
  keep-days: 60

  # Entries per /stafflog page. Up to 50.
  page-size: 10

# ── Updates ───────────────────────────────────────────────────────────────
# Checks once a day for a new version and says so in the console.
updates:
  check: true

  # Where you downloaded ChorusCore: modrinth, spigot or builtbybit.
  source: modrinth

  # Also tells players with chorus.updates when they join.
  notify-staff: true
