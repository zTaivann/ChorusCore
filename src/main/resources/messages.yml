# ┌────────────────────────────────────────────────────────────────────────┐
# │                                                                        │
# │   M E S S A G E S                                                      │
# │   every line the plugin sends                                          │
# │                                                                        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Both formats work, in the same line if you like: MiniMessage tags such as
# <gold> or <gradient:#a06bff:#e0c3fc>, and the old codes &6 and &l. Write && for
# an & that is not a colour.
# MiniMessage format: https://docs.papermc.io/adventure/minimessage/format
# %prefix% is replaced with the value of 'prefix'.
# Leave a message empty ('') and it will not be sent at all.

